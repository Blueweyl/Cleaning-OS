    /* ---- destructive ---------------------------------------------------- */

    function startReal(closeDrawer) {
      CF.ui.confirm({
        title: 'Start your own business?',
        message: 'The Sparkle & Shine demo data is cleared and you start with a clean slate. ' +
                 'Nothing here is yours yet, so nothing real is lost.',
        confirmLabel: 'Start Fresh'
      }).then(function (ok) {
        if (!ok) return;
        CF.store.replace(CF.schema.emptyDatabase(), 'Start fresh');
        CF.views.onboarding.reset();
        closeDrawer();
        CF.router.go('#/home');
        CF.shell.repaint();
      });
    }

    function loadDemo(closeDrawer) {
      var db = CF.store.get();
      var inDemo = !!db.settings.demoMode;
      // Work of their own, added while the demo was loaded. Not counted by
      // `hasReal` below, which is about replacing a real business — but it is
      // just as much theirs, and resetting used to delete it without a word.
      var ownCount = inDemo ? CF.demo.ownWorkCount(db) : 0;
      var hasReal = !inDemo && (CF.q.activeClients().length || CF.q.jobs().length);

      CF.ui.confirm({
        title: hasReal ? 'Replace your data with the demo?'
             : ownCount ? 'Reset the sample data?'
             : 'Load demo data?',
        message: hasReal
          ? 'This wipes your real clients, jobs and invoices and replaces them with sample data. ' +
            'Export a backup first if you want to keep any of it.'
          : ownCount
            ? 'The sample clients, jobs and invoices go back to how they started. The ' +
              CF.fmt.plural(ownCount, 'record') + ' you added yourself ' +
              (ownCount === 1 ? 'is' : 'are') + ' kept.'
            : 'Loads the Sparkle & Shine sample business so you can explore every screen with real-looking data.',
        confirmLabel: hasReal ? 'Replace Everything'
                    : ownCount ? 'Reset Samples' : 'Load Demo',
        danger: hasReal
      }).then(function (ok) {
        if (!ok) return;
        // Resetting from inside the demo keeps their own work; loading the demo
        // over a real business is an explicit replacement they just confirmed.
        (ownCount ? CF.demo.reset() : CF.demo.load()).then(function () {
          closeDrawer();
          CF.router.go('#/home');
          CF.shell.repaint();
          CF.ui.toast(ownCount
            ? 'Sample data reset — your ' + CF.fmt.plural(ownCount, 'record') + ' kept'
            : 'Demo loaded', {
            undo: function () { CF.store.undo(); CF.shell.repaint(); }
          });
        });
      });
    }

    function eraseEverything(closeDrawer) {
      CF.ui.confirm({
        title: 'Erase everything?',
        message: 'Every client, job, quote, invoice and expense is permanently deleted from this device. ' +
                 'This cannot be undone once you close the app.',
        confirmLabel: 'Erase Everything', danger: true
      }).then(function (ok) {
        if (!ok) return;
        // Second gate: irreversible and irreplaceable deserves two.
        CF.ui.confirm({
          title: 'Last chance',
          message: 'Have you exported a backup? Once this is gone there is no cloud copy to recover from.',
          confirmLabel: 'Yes, erase it', cancelLabel: 'Back up first', danger: true
        }).then(function (sure) {
          if (!sure) {
            CF.backup.exportBackup();
            CF.ui.toast('Backup exported — nothing was erased');
            paint();
            return;
          }
          CF.store.replace(CF.schema.emptyDatabase(), 'Erase everything');
          CF.views.onboarding.reset();
          closeDrawer();
          CF.router.go('#/home');
          CF.shell.repaint();
          CF.ui.toast('Everything erased');
        });
      });
    }
  }

  CF.views = CF.views || {};
  CF.views.settings = { open: open };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/ui/shell.js */
/* ==========================================================================
   CleanFlow — Application shell
   Chrome (nav, search, quick add), route dispatch, and the single repaint
   path every view calls after it changes something.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  var root = null;
  var contentHost = null;
  var flash = null;
  var repaintQueued = false;

  var NAV = [
    { key: 'home',    icon: '🏠', label: 'Home',    route: '#/home' },
    { key: 'clients', icon: '👥', label: 'Clients', route: '#/clients' },
    { key: 'jobs',    icon: '📅', label: 'Jobs',    route: '#/jobs' },
    { key: 'money',   icon: '💰', label: 'Money',   route: '#/money' },
    { key: 'grow',    icon: '🚀', label: 'Grow',    route: '#/grow' }
  ];

  /* ---- Boot ------------------------------------------------------------- */

  function mount(hostEl) {
    root = hostEl;
    CF.router.start(function () { repaint(); });
    CF.store.subscribe(function () { /* views repaint explicitly */ });

    // Never lose the last few hundred milliseconds of typing. A closing page
    // does not wait for promises, so the synchronous path runs first and the
    // async one only tops it up.
    window.addEventListener('pagehide', function () { CF.store.flushSync(); });
    window.addEventListener('beforeunload', function () {
      CF.store.flushSync();
      CF.store.flush();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') {
        CF.store.flushSync();
        CF.store.flush();
        // Refresh the external copy while the app is idle, never mid-edit.
        if (CF.vault) CF.vault.maybeWrite();
      }
    });

    // A tab that loses writer status must repaint into its read-only state.
    if (CF.tabguard) CF.tabguard.onChange(function () { repaint(); });
    CF.store.onSaveState(function () { repaintBanners(); });
    if (CF.storage.onMirrorChange) CF.storage.onMirrorChange(function () { repaintBanners(); });

    // Global keyboard shortcuts, skipped while typing.
    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      if (e.metaKey || e.ctrlKey) {
        if (e.key === 'k') { e.preventDefault(); openSearch(); }
        return;
      }
      if (e.key === '/') { e.preventDefault(); openSearch(); }
    });
  }

  /** Coalesce repaints so a burst of changes renders once. */
  function repaint() {
    if (repaintQueued) return;
    repaintQueued = true;
    requestAnimationFrame(function () {
      repaintQueued = false;
      draw();
    });
  }

  function draw() {
    var db = CF.store.get();
    CF.views.jobs.stopTimer();

    // If the stored data could not be read, nothing else may render: the app
    // must not present an empty database that the next edit would save over.
    if (CF.store.isLocked()) {
      CF.dom.mount(root, recoveryScreen());
      return;
    }

    // Onboarding owns the whole screen until it hands over — including its
    // final "You're ready!" step, which runs after settings are already saved.
    if (CF.views.onboarding.isActive()) {
      CF.dom.mount(root, CF.views.onboarding.render());
      return;
    }

    var route = CF.router.get();
    CF.dom.mount(root, el('div.app', [
      safetyBanners(),
      db.settings.demoMode ? demoBanner() : null,
      topbar(route),
      contentHost = el('main#main.page', { tabindex: '-1' }, screenFor(route)),
      bottomNav(route)
    ]));
  }

  /* ---- Route dispatch ----------------------------------------------------- */

  function screenFor(route) {
    var V = CF.views;
    var s = route.section, v = route.view, id = route.id, q = route.query;

    try {
      if (s === 'home') return V.home.render();

      if (s === 'clients') {
        if (v === 'new') return V.clients.renderForm(null);
        if (v && id === 'edit') return V.clients.renderForm(v);
        if (v) return V.clients.renderProfile(v);
        return V.clients.renderList();
      }

      if (s === 'jobs') {
        if (v === 'new') return V.jobs.renderForm(null, q);
        if (v && id === 'edit') return V.jobs.renderForm(v, q);
        if (v && id === 'clean') return V.jobs.renderClean(v);
        if (v && id === 'done') return V.jobs.renderDone(v);
        if (v) return V.jobs.renderDetail(v);
        return V.jobs.renderList();
      }

      if (s === 'money') {
        if (v === 'quote') return V.quote.render(q, id);
        if (v === 'invoice' && id) return V.money.renderInvoice(id);
        if (v === 'paid' && id) return V.money.renderPaid(id);
        if (v === 'quotes' || v === 'invoices' || v === 'expenses') {
          V.money.setTab(v);
          return V.money.renderOverview();
        }
        return V.money.renderOverview();
      }

      if (s === 'grow') {
        if (v === 'proposal') return V.grow.renderProposal();
        return V.grow.render();
      }
    } catch (err) {
      console.error('[CleanFlow] view failed', err);
      return errorScreen(err);
    }

    return notFound();
  }

  /**
   * Shown when CleanFlow could not read what is on this device. Writing is
   * disabled until the user picks one of the two safe ways forward, so a bad
   * read can never turn into a blank database saved over good data.
   */
  function recoveryScreen() {
    var info = CF.store.lockInfo() || {};
    var corrupt = info.reason === 'corrupt';
    // Scanning quarantine is not free — do it once per render, not per use.
    var rescue = salvageOffer();

    return el('div.onboard', [
      el('div.onboard__card.anim-fade-up', [
        el('div.row.row-3.mb-5', [
          el('div.brand__mark.brand__mark--lg', { 'aria-hidden': 'true' }, 'C'),
          el('div', { style: { fontWeight: '800', fontSize: '18px' } }, 'CleanFlow')
        ]),
        el('h1', { style: { fontSize: '24px', fontWeight: '800', margin: 0, lineHeight: '1.25' } },
          corrupt ? 'Your saved data could not be read'
                  : 'CleanFlow could not open your data'),
        el('p', { style: { fontSize: '15px', color: 'var(--text-muted)', marginTop: '10px', lineHeight: '1.6' } },
          corrupt
            ? 'The file on this device is damaged. It has been set aside rather than deleted, ' +
              'so nothing has been overwritten — but CleanFlow cannot read it.'
            : 'Your browser would not let CleanFlow read its storage. This is usually temporary. ' +
              'Nothing has been changed or deleted.'),

        el('div.callout.callout--info.mt-5',
          'Editing is switched off until you choose below, so your saved data cannot be ' +
          'overwritten by an empty one.'),

        el('div.stack.stack-3.mt-6', [
          rescue,
          // When recovery is on offer it is the recommended path, so Try Again
          // steps down to secondary rather than competing with it.
          el('button.btn.btn--lg.btn--block' + (rescue ? '.btn--secondary' : '.btn--primary'), {
            type: 'button', autofocus: !rescue,
            onclick: function () { location.reload(); }
          }, 'Try Again'),
          el('button.btn.btn--secondary.btn--lg.btn--block', {
            type: 'button',
            onclick: function () { pickBackupFile(function () { repaint(); }); }
          }, 'Restore From a Backup File'),
          el('button.btn.btn--secondary.btn--block', {
            type: 'button', style: { color: 'var(--bad-text)' },
            onclick: startOverFromLock
          }, 'Start Over With an Empty CleanFlow')
        ]),

        info.quarantinedAs ? el('p.meta.mt-5',
          'The unreadable copy is kept in this browser under "' + info.quarantinedAs +
          '" in case it can be recovered.') : null,

        info.error ? el('details.mt-4', [
          el('summary.meta', { style: { cursor: 'pointer' } }, 'Technical details'),
          el('pre', {
            style: { fontSize: '11px', background: 'var(--chip)', padding: '12px',
                     borderRadius: '8px', overflow: 'auto', color: 'var(--text-muted)' }
          }, String(info.error && (info.error.message || info.error)))
        ]) : null
      ])
    ]);
  }

  /**
   * A cut-off write leaves most of the data intact, so offer to pull back
   * whatever is still readable before asking the user to give up on it.
   */
  function salvageOffer() {
    if (!CF.salvage) return null;
    var keys = CF.salvage.quarantineKeys();
    if (!keys.length) return null;

    var result = null;
    for (var i = 0; i < keys.length && !result; i++) {
      result = CF.salvage.fromQuarantine(keys[i]);
    }
    if (!result) return null;

    var c = result.counts;
    var total = c.clients + c.jobs + c.invoices + c.quotes + c.expenses;
    if (!total) return null;

    return el('div', [
      el('div.callout.callout--ok.mb-3',
        '✓ CleanFlow can still read ' + c.clients + ' clients, ' + c.jobs + ' jobs, ' +
        c.invoices + ' invoices, ' + c.quotes + ' quotes and ' + c.expenses +
        ' expenses out of the damaged file.'),
      el('button.btn.btn--primary.btn--lg.btn--block', {
        type: 'button', autofocus: true,
        onclick: function () { applySalvage(result); }
      }, 'Recover What You Can')
    ]);
  }

  function applySalvage(result) {
    var c = result.counts;
    CF.ui.confirm({
      title: 'Recover the readable data?',
      message: 'CleanFlow will restore ' + c.clients + ' clients, ' + c.jobs + ' jobs, ' +
               c.invoices + ' invoices, ' + c.quotes + ' quotes and ' + c.expenses +
               ' expenses. Anything the damage destroyed cannot be brought back, ' +
               'so check your records afterwards — and export a backup straight away.',
      confirmLabel: 'Recover'
    }).then(function (ok) {
      if (!ok) return;
      CF.store.replace(result.data, 'Recover damaged data');
      CF.store.logActivity({ icon: '🛟', text: 'Recovered data from a damaged file' });
      CF.router.go('#/home');
      repaint();
      CF.ui.toast('Recovered — export a backup now', { duration: 9000 });
    });
  }

  function startOverFromLock() {
    CF.ui.confirm({
      title: 'Start over with an empty CleanFlow?',
      message: 'Your unreadable data stays where it is, but CleanFlow will begin saving a ' +
               'fresh, empty database over it. If you have a backup file, restore that instead.',
      confirmLabel: 'Start Empty', cancelLabel: 'Go Back', danger: true
    }).then(function (ok) {
      if (!ok) return;
      CF.store.replace(CF.schema.emptyDatabase(), 'Start over');
      CF.views.onboarding.reset();
      CF.router.go('#/home');
      repaint();
    });
  }

  function notFound() {
    return CF.ui.empty({
      title: 'That screen doesn\'t exist',
      body: 'The link may be out of date. Everything lives under the five tabs.',
      action: { label: 'Go Home', onClick: function () { CF.router.go('#/home'); } }
    });
  }

  function errorScreen(err) {
    return el('div', [
      CF.ui.empty({
        title: 'Something went wrong on this screen',
        body: 'Your data is safe. Try going back, and export a backup if this keeps happening.',
        action: { label: 'Go Home', onClick: function () { CF.router.go('#/home'); } }
      }),
      el('details.mt-5', { style: { maxWidth: '560px', margin: '20px auto 0' } }, [
        el('summary.meta', { style: { cursor: 'pointer' } }, 'Technical details'),
        el('pre', {
          style: { fontSize: '11px', overflow: 'auto', background: 'var(--chip)',
                   padding: '12px', borderRadius: '8px', color: 'var(--text-muted)' }
        }, String(err && (err.stack || err.message) || err))
      ])
    ]);
  }

  /* ---- Chrome ------------------------------------------------------------- */

  /**
   * Anything that threatens the user's data gets a persistent bar, not a
   * toast — a toast they missed is a toast that never happened.
   */
  function safetyBanners() {
    var bars = [];

    if (CF.tabguard && !CF.tabguard.canWrite()) {
      bars.push(bar('warn',
        '👁 Read-only — CleanFlow is already open in another tab. Changes here will not be saved.',
        'Use This Tab', function () {
          CF.tabguard.takeOver();
          CF.ui.toast('This tab is now the one that saves');
          repaint();
        }));
    }

    var storage = CF.storage.describe();
    if (storage.mode === 'memory') {
      bars.push(bar('bad',
        '⚠ This browser is not saving anything. Export a backup before you close this tab.',
        'Export Backup', function () {
          CF.backup.exportBackup();
          CF.ui.toast('Backup downloaded');
        }));
    }

    if (storage.mirrorNote) {
      bars.push(bar('warn', '💾 ' + storage.mirrorNote, 'Back Up Now', function () {
        CF.backup.exportBackup();
        CF.ui.toast('Backup downloaded');
      }));
    }

    var err = CF.store.lastSaveError();
    if (err) {
      bars.push(bar('bad',
        '⚠ ' + (err.quota
          ? 'This device is out of space — your latest changes are not saved.'
          : 'Your latest changes could not be saved to this device.') +
        ' CleanFlow is still retrying.',
        'Export Backup', function () {
          CF.backup.exportBackup();
          CF.ui.toast('Backup downloaded');
        }));
    }

    return bars.length ? el('div.no-print', bars) : null;

    function bar(tone, message, actionLabel, onAction) {
      return el('div.safety-bar.safety-bar--' + tone, [
        el('span', message),
        onAction ? el('button.btn.btn--sm', {
          type: 'button',
          style: { background: 'rgba(255,255,255,0.18)', color: '#fff' },
          onclick: onAction
        }, actionLabel) : null
      ]);
    }
  }

  /** Cheap path for save-state changes: re-render without losing scroll. */
  function repaintBanners() { repaint(); }

  function demoBanner() {
    return el('div.demo-banner.no-print', [
      el('span', '🧪 Demo Business — you\'re exploring sample data.'),
      el('button.btn.btn--primary.btn--sm', {
        type: 'button', onclick: startRealBusiness
      }, 'Start My Business')
    ]);
  }

  /**
   * Leave the demo and set up for real.
   *
   * People try the app out properly before committing: they add their own
   * client, book a real job, record a real payment — all while the demo is
   * still loaded. This used to replace the whole database with an empty one
   * while the dialog assured them "nothing real is lost". It was: their client,
   * their job, their invoice and their payment, with no undo offered and no
   * mention that it had happened.
   *
   * The sample records are cleared; anything they added themselves comes with
   * them. The dialog says which of the two is about to happen.
   */
  function startRealBusiness() {
    var db = CF.store.get();
    var own = CF.demo.ownWork(db);
    var count = CF.demo.ownWorkCount(db);

    CF.ui.confirm({
      title: 'Start your own business?',
      message: count
        ? 'The ' + CF.fmt.plural(count, 'record') + ' you added yourself ' +
          (count === 1 ? 'is' : 'are') + ' kept — the sample clients, jobs and ' +
          'invoices are cleared. Then CleanFlow walks you through a two-minute setup.'
        : 'The demo data is cleared and CleanFlow walks you through a two-minute ' +
          'setup. You have not added anything of your own, so nothing real is lost.',
      confirmLabel: count ? 'Keep My Work' : 'Start Fresh'
    }).then(function (ok) {
      if (!ok) return;

      var fresh = CF.schema.emptyDatabase();
      // Carry their own records across, oldest first so ids and numbering read
      // in the order they were created.
      CF.demo.SEEDED.forEach(function (key) {
        fresh[key] = (own[key] || []).slice();
      });
      // Document numbers must not restart on top of invoices already issued.
      fresh.counters = Object.assign({}, fresh.counters, {
        invoice: highestOf(fresh.invoices, fresh.counters.invoice),
        quote: highestOf(fresh.quotes, fresh.counters.quote)
      });

      CF.store.replace(fresh, 'Start fresh');
      CF.views.onboarding.reset();
      CF.router.go('#/home');
      repaint();
      if (count) {
        CF.ui.toast(CF.fmt.plural(count, 'record') + ' kept from your trial run');
      }
    });
  }

  function highestOf(rows, current) {
    var top = Number(current) || 100;
    (rows || []).forEach(function (r) {
      var n = parseInt(r && r.number, 10);
      if (isFinite(n) && n > top) top = n;
    });
    return top;
  }

  function topbar(route) {
    var db = CF.store.get();
    var overdueBackup = CF.backup.backupOverdue();

    return el('header.topbar.no-print', [
      el('div.row.row-8', { style: { gap: '32px' } }, [
        el('a.brand', { href: '#/home', 'aria-label': 'CleanFlow home' }, [
          el('div.brand__mark', { 'aria-hidden': 'true' }, 'C'),
          el('span.brand__name', { style: { color: 'var(--text)' } }, 'CleanFlow')
        ]),
        el('nav.navlinks.desktop-only', { 'aria-label': 'Main' },
          NAV.map(function (n) {
            return el('button.navlink', {
              type: 'button',
              'aria-current': route.section === n.key ? 'page' : null,
              onclick: function () { CF.router.go(n.route); }
            }, [
              el('span.navlink__icon', { 'aria-hidden': 'true' }, n.icon),
              n.label
            ]);
          }))
      ]),

      el('div.row.row-3', [
        el('button.iconbtn', {
          type: 'button', 'aria-label': 'Search (press / )', onclick: openSearch
        }, '🔍'),
        el('button.btn.btn--sm.desktop-only', {
          type: 'button',
          style: { background: 'var(--brand-tint)', color: 'var(--brand-text)', fontWeight: '800' },
          onclick: openQuickAdd
        }, '+ New'),
        el('button.avatarbtn', {
          type: 'button',
          'aria-label': 'Settings' + (overdueBackup ? ' — backup overdue' : ''),
          style: overdueBackup ? { boxShadow: '0 0 0 2px var(--warn-text)' } : null,
          onclick: function () { CF.views.settings.open(); }
        }, CF.fmt.initials(db.business.name || 'CleanFlow'))
      ])
    ]);
  }

  function bottomNav(route) {
    var items = [NAV[0], NAV[1], null, NAV[2], NAV[3]];
    return el('nav.bottomnav.no-print', { 'aria-label': 'Main' },
      items.map(function (n) {
        if (!n) {
          return el('button.bottomnav__item', {
            type: 'button', 'aria-label': 'Quick add', onclick: openQuickAdd
          }, [el('span.bottomnav__fab', { 'aria-hidden': 'true' }, '+')]);
        }
        return el('button.bottomnav__item', {
          type: 'button',
          'aria-current': route.section === n.key ? 'page' : null,
          onclick: function () { CF.router.go(n.route); }
        }, [
          el('span.bottomnav__icon', { 'aria-hidden': 'true' }, n.icon),
          el('span.bottomnav__label', n.label)
        ]);
      }));
  }

  /* ---- Quick add ---------------------------------------------------------- */

  function openQuickAdd() {
    CF.ui.sheet({
      title: 'Quick Add',
      items: [
        { icon: '💰', label: 'New Quote',   onSelect: function () { CF.router.go('#/money/quote'); } },
        { icon: '📅', label: 'Book a Job',  onSelect: function () { CF.router.go('#/jobs/new'); } },
        { icon: '👥', label: 'New Client',  onSelect: function () { CF.router.go('#/clients/new'); } },
        { icon: '🧾', label: 'New Expense', onSelect: function () { CF.views.money.expenseModal(); } },
        { icon: '🚀', label: 'Build Proposal', onSelect: function () { CF.router.go('#/grow/proposal'); } }
      ]
    });
  }

  /* ---- Search -------------------------------------------------------------- */

  function openSearch() {
    var results = [];
    var activeIndex = 0;
    var listHost, input;

    CF.ui.overlay({
      variant: 'top',
      build: function (close) {
        input = el('input.searchbox__input', {
          type: 'search', autofocus: true,
          ariaLabel: 'Search clients, jobs, quotes and invoices',
          placeholder: 'Search clients, jobs, quotes, invoices…',
          'aria-label': 'Search',
          oninput: function (e) { run(e.target.value); },
          onkeydown: function (e) {
            if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
            else if (e.key === 'Enter' && results[activeIndex]) {
              e.preventDefault();
              close();
              CF.router.go(results[activeIndex].route);
            }
          }
        });

        listHost = el('div.searchbox__list');
        run('');

        return el('div.searchbox', {
          role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Search'
        }, [
          el('div.searchbox__head', input),
          listHost
        ]);

        function run(term) {
          results = term.trim() ? CF.q.search(term) : [];
          activeIndex = 0;
          paint(term);
        }

        function move(delta) {
          if (!results.length) return;
          activeIndex = (activeIndex + delta + results.length) % results.length;
          paint(input.value);
        }

        function paint(term) {
          CF.dom.clear(listHost);
          if (!term.trim()) {
            listHost.appendChild(el('div.center', {
              style: { padding: '30px 14px', fontSize: '13.5px', color: 'var(--text-faint)' }
            }, 'Start typing a client, job, quote or invoice.'));
            return;
          }
          if (!results.length) {
            listHost.appendChild(el('div.center', {
              style: { padding: '30px 14px', fontSize: '13.5px', color: 'var(--text-faint)' }
            }, 'No matches for "' + term + '".'));
            return;
          }
          results.forEach(function (r, i) {
            listHost.appendChild(el('button.searchbox__item' + (i === activeIndex ? '.is-active' : ''), {
              type: 'button',
              onclick: function () { close(); CF.router.go(r.route); }
            }, [
              el('span', { 'aria-hidden': 'true', style: { fontSize: '16px' } }, r.icon),
              el('span.grow', [
                el('span', { style: { display: 'block', fontSize: '14px', fontWeight: '700' } }, r.title),
                el('span.meta', r.sub)
              ]),
              el('span.searchbox__type', r.type)
            ]));
          });
        }
      }
    });
  }

  /* ---- Restore flow --------------------------------------------------------- */

  /**
   * Everything a restore is about to replace, counted and named.
   *
   * This used to count active clients and jobs only. Someone in their first
   * week — supplies bought, quotes written, nothing booked yet — or someone
   * who had archived their clients registered as zero, so the dialog never
   * said anything would be replaced and the automatic safety copy, which is
   * only taken when something is here, never ran. Restoring the wrong file
   * took their records with no warning and no way back.
   *
   * Archived clients count: archiving is not deleting, and their history is
   * what the accounts are built from.
   */
  function whatIsHere() {
    var db = CF.store.get();
    var parts = [];
    var total = 0;

    [['clients', 'client'], ['jobs', 'job'], ['quotes', 'quote'],
     ['invoices', 'invoice'], ['expenses', 'expense']].forEach(function (pair) {
      var n = (db[pair[0]] || []).filter(function (r) { return r && !r.deletedAt; }).length;
      if (!n) return;
      total += n;
      parts.push(CF.fmt.plural(n, pair[1]));
    });

    return {
      total: total,
      phrase: parts.length > 1
        ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1]
        : (parts[0] || 'nothing')
    };
  }

  /** Pick a backup file, show what is in it, then confirm before replacing. */
  function pickBackupFile(onDone) {
    var input = el('input', {
      type: 'file', accept: 'application/json,.json',
      style: { display: 'none' }
    });

    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (file) inspect(file);
      if (input.parentNode) input.parentNode.removeChild(input);
    });

    document.body.appendChild(input);
    input.click();

    function inspect(file) {
      CF.backup.inspectFile(file).then(function (info) {
        var c = info.counts;
        var here = whatIsHere();
        var hereNow = here.total;

        var lines = [];
        lines.push((info.businessName ? '"' + info.businessName + '"' : 'This backup') +
          (info.exportedAt
            ? ' was exported ' + CF.fmt.agoPhrase(CF.fmt.toKey(info.exportedAt)) + '.'
            : '.'));
        lines.push('It contains ' + c.clients + ' clients, ' + c.jobs + ' jobs, ' +
          c.invoices + ' invoices, ' + c.quotes + ' quotes and ' + c.expenses + ' expenses.');

        if (!info.tagged) {
          lines.push('⚠ It is missing CleanFlow\'s backup marker, so it may have been ' +
            'edited by hand.');
        }
        if (info.newerThanApp) {
          lines.push('⚠ It was made by a newer version of CleanFlow. Anything this version ' +
            'does not understand will be dropped when you next save.');
        }
        if (info.warnings && info.warnings.length) {
          lines.push('⚠ Skipping ' + info.warnings.join(', ') + '.');
        }
        if (hereNow > 0) {
          lines.push('This replaces the ' + here.phrase + ' already on this device.');
        }

        CF.ui.confirm({
          title: 'Restore this backup?',
          message: lines.join(' '),
          confirmLabel: 'Restore', cancelLabel: 'Keep What I Have', danger: true
        }).then(function (ok) {
          if (!ok) return;

          // Take a safety copy of what is here before replacing it, so a
          // restore of the wrong file is never a one-way door.
          if (hereNow > 0 && !CF.store.isLocked()) {
            try { CF.backup.exportBackup({ silent: true, suffix: 'before-restore' }); }
            catch (e) { /* a failed safety copy must not block the restore */ }
          }

          CF.backup.applyRestore(info.data).then(function () {
            CF.ui.toast(hereNow > 0
              ? 'Backup restored — your previous data was saved to your downloads first'
              : 'Backup restored', {
              undo: function () { CF.store.undo(); repaint(); },
              duration: 8000
            });
            if (onDone) onDone();
            repaint();
          });
        });
      }).catch(function (err) {
        // A damaged backup is usually a truncated one. Try to read what is
        // left before telling the user it is worthless.
        readAsText(file).then(function (text) {
          var rescued = CF.salvage ? CF.salvage.attempt(text) : null;
          var total = rescued
            ? rescued.counts.clients + rescued.counts.jobs + rescued.counts.invoices +
              rescued.counts.quotes + rescued.counts.expenses
            : 0;

          CF.ui.modal({
            size: 'sm',
            title: total ? 'That file is damaged' : 'Couldn\'t read that file',
            body: el('div.stack.stack-3', [
              el('p', { style: { fontSize: '13.5px', color: 'var(--text-muted)', lineHeight: '1.6', margin: 0 } },
                String(err.message || err)),
              total ? el('div.callout.callout--ok',
                'CleanFlow can still read ' + rescued.counts.clients + ' clients, ' +
                rescued.counts.jobs + ' jobs and ' + rescued.counts.invoices +
                ' invoices from it.') : null
            ]),
            actions: function (close) {
              return [
                el('button.btn.btn--secondary', {
                  type: 'button', onclick: function () { close(); }
                }, total ? 'Cancel' : 'OK'),
                total ? el('button.btn.btn--primary', {
                  type: 'button',
                  onclick: function () { close(); applySalvage(rescued); }
                }, 'Recover What You Can') : null
              ].filter(Boolean);
            }
          });
        });
      });
    }
  }

  function readAsText(file) {
    return new Promise(function (resolve) {
      try {
        var r = new FileReader();
        r.onload = function () { resolve(String(r.result || '')); };
        r.onerror = function () { resolve(''); };
        r.readAsText(file);
      } catch (e) { resolve(''); }
    });
  }

  /* ---- Flash (one-shot data between screens) ---------------------------------- */

  function setFlash(value) { flash = value; }
  function getFlash() { return flash; }

  CF.shell = {
    mount: mount,
    repaint: repaint,
    openSearch: openSearch,
    openQuickAdd: openQuickAdd,
    pickBackupFile: pickBackupFile,
    setFlash: setFlash,
    getFlash: getFlash
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/app.js */
/* ==========================================================================
   CleanFlow — Bootstrap
   Opens storage, loads the database, mounts the shell. If any of that
   fails the user gets a plain explanation rather than a blank page.
   ========================================================================== */
(function (CF) {
  'use strict';

  function boot() {
    var root = document.getElementById('app');
    if (!root) return;

    if (CF.tabguard) CF.tabguard.start();

    CF.store.init()
      .then(function () {
        var mode = CF.storage.describe();
        // The head script painted a theme from the mirror; now that the real
        // settings are open, let them have the final say — a restored backup
        // can carry a different choice than this device last used.
        if (CF.theme) CF.theme.sync();
        CF.shell.mount(root);
        CF.shell.repaint();

        if (CF.vault) CF.vault.init();

        var notice = CF.store.takeLoadNotice();
        if (notice) setTimeout(function () { CF.ui.toast(notice, { duration: 7000 }); }, 900);
        if (CF.store.isLocked()) return;

        if (mode.mode === 'memory') {
          setTimeout(function () {
            CF.ui.toast(
              'This browser is blocking local storage — nothing will be saved. Export a backup before you close.',
              { tone: 'bad', sticky: true }
            );
          }, 900);
        } else if (CF.backup.backupOverdue()) {
          setTimeout(function () {
            var days = CF.backup.daysSinceBackup();
            CF.ui.toast(
              days === null
                ? 'Tip: export a backup from Settings — it is the only copy of your data.'
                : 'It has been ' + days + ' days since your last backup.',
              { duration: 6000 }
            );
          }, 1600);
        }
      })
      .catch(function (err) {
        console.error('[CleanFlow] failed to start', err);
        root.innerHTML =
          '<div style="max-width:520px;margin:80px auto;padding:32px;font-family:system-ui,sans-serif;' +
          'background:#fff;border:1px solid #E9EBEF;border-radius:18px;">' +
          '<h1 style="font-size:20px;margin:0 0 8px;">CleanFlow couldn\'t start</h1>' +
          '<p style="color:#64748B;line-height:1.6;margin:0 0 16px;">' +
          'Your browser blocked the storage CleanFlow needs. Try opening this file in ' +
          'Chrome, Edge or Firefox, and make sure you are not in a private window.</p>' +
          '<pre style="font-size:11px;background:#F5F6F8;padding:12px;border-radius:8px;' +
          'overflow:auto;color:#64748B;">' + String(err && err.message || err) + '</pre></div>';
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.CF = window.CF || {});

</script>

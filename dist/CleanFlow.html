      }
    }

    /* ---- save / convert ---- */

    function validate() {
      if (draft.mode === 'new' && !draft.leadName.trim()) {
        CF.ui.toast('Enter the customer\'s name to continue', { tone: 'bad' });
        var input = formHost.querySelector('input');
        if (input) input.focus();
        return false;
      }
      if (draft.mode === 'existing' && !draft.clientId) {
        CF.ui.toast('Pick a client first', { tone: 'bad' });
        return false;
      }
      return true;
    }

    function payload(c) {
      return {
        clientId: draft.mode === 'existing' ? draft.clientId : null,
        clientName: draft.mode === 'existing'
          ? Q.clientName(draft.clientId) : draft.leadName.trim(),
        clientPhone: draft.leadPhone,
        serviceId: draft.serviceId,
        sqft: draft.sqft, beds: draft.beds, baths: draft.baths,
        condition: draft.condition, addonIds: draft.addonIds.slice(),
        frequency: draft.frequency,
        price: c.price, cost: c.cost, profit: c.profit,
        margin: c.margin, minutes: c.minutes,
        tax: c.tax, total: c.total
      };
    }

    function save(status) {
      if (!validate()) return;
      var c = calc();
      var quote = CF.actions.saveQuote(Object.assign(payload(c), { status: 'draft' }));
      if (status === 'sent') CF.actions.setQuoteStatus(quote.id, 'sent');
      discardDraft();
      CF.ui.toast(status === 'sent' ? 'Quote saved and marked sent' : 'Quote saved');
      go('#/money/quote/' + quote.id);
    }

    function acceptAndBook() {
      if (!validate()) return;
      var c = calc();
      var quote = CF.actions.saveQuote(Object.assign(payload(c), { status: 'sent' }));
      var result = CF.actions.acceptQuote(quote.id, { date: F.today() });
      if (!result) return;          // the write was refused; the toast explains why
      discardDraft();
      CF.ui.toast('Quote accepted — job booked');
      go('#/jobs/' + result.job.id + '/edit');
    }
  }

  function formatSqft(v) {
    return Number(v).toLocaleString() + ' sq ft';
  }

  /* ---- Saved quote ------------------------------------------------------------------ */

  function renderSaved(quote) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var biz = CF.store.get().business;
    var st = CF.schema.QUOTE_STATUS.filter(function (s) { return s.id === quote.status; })[0]
             || { label: quote.status, tone: 'neutral' };
    var name = quote.clientName || Q.clientName(quote.clientId);

    return el('div.anim-fade-up', { style: { maxWidth: '600px' } }, [
      el('div.no-print', [U.backLink('Back to Money', function () { go('#/money'); })]),

      el('div.card.card--roomy.paper', [
        el('div.row.between.row-4.row-wrap', [
          el('div', [
            el('div.eyebrow', 'Quote #' + quote.number),
            el('h1.h-card', { style: { marginTop: '6px' } }, name)
          ]),
          U.badge(st.label, st.tone, true)
        ]),

        biz.name ? el('div.meta.mt-2', biz.name +
          (biz.phone ? ' · ' + biz.phone : '')) : null,

        el('div.doc__block', [
          el('div.doc__label', 'Scope'),
          el('div.doc__body', [
            Q.serviceName(quote.serviceId), ' · ',
            // A quote restored from an edited file can carry junk here, and this
            // is the page the client reads. Never print NaN at them.
            scopeNumber(quote.sqft, 1200).toLocaleString(), ' sq ft · ',
            F.plural(scopeNumber(quote.beds, 2), 'bed'), ' · ',
            F.plural(scopeNumber(quote.baths, 1), 'bath'),
            (quote.addonIds || []).length
              ? el('div.mt-2', 'Includes: ' + (quote.addonIds || []).map(function (id) {
                  var a = CF.store.find('addons', id);
                  return a ? a.name : null;
                }).filter(Boolean).join(', '))
              : null
          ])
        ]),

        el('div.doc__total', [
          el('div', [
            el('div.meta', 'Frequency'),
            el('div', { style: { fontWeight: '700' } }, frequencyLabel(quote.frequency))
          ]),
          // Tax is re-derived from the current rate, not read back from the
          // quote: the client must see the number they will actually be
          // invoiced, and the invoice is raised at the rate in force then.
          quoteTax(quote) > 0
            ? el('div.right', [
                el('div.meta', F.money(quote.price) + ' + ' +
                  F.money(quoteTax(quote)) + ' ' + quoteTaxWord(quote)),
                el('div.h-card', F.money(quote.price + quoteTax(quote)))
              ])
            : el('div.h-card', F.money(quote.price))
        ]),

        el('div.card.card--tight.mt-4.no-print', { style: { background: 'var(--surface-sunken)' } }, [
          el('div.eyebrow.mb-2', 'Your numbers (not shown to the client)'),
          el('div.deflist', [
            U.defRow('Estimated cost', F.money(quote.cost)),
            U.defRow('Estimated profit', F.money(quote.profit)),
            U.defRow('Margin', quote.margin + '%')
          ])
        ]),

        el('div.stack.stack-3.mt-5.no-print', [
          quote.status !== 'accepted' ? el('button.btn.btn--primary.btn--block.btn--lg', {
            type: 'button', onclick: accept
          }, 'Accepted → Book Job') : el('div.callout.callout--ok.center',
            '✓ Accepted and booked'),

          el('div.row.row-3', [
            quote.status === 'draft' ? el('button.btn.btn--secondary', {
              type: 'button', style: { flex: '1' },
              onclick: function () {
                CF.actions.setQuoteStatus(quote.id, 'sent');
                CF.ui.toast('Marked as sent');
                CF.shell.repaint();
              }
            }, 'Mark Sent') : null,
            quote.status !== 'declined' && quote.status !== 'accepted'
              ? el('button.btn.btn--secondary', {
                  type: 'button', style: { flex: '1' }, onclick: decline
                }, 'Mark Declined') : null
          ].filter(Boolean)),

          el('div.row.row-3', { style: { justifyContent: 'center' } }, [
            el('button.linkbtn', { type: 'button', onclick: function () { window.print(); } },
              'Print / Save PDF'),
            el('button.linkbtn', { type: 'button', onclick: copyQuote }, 'Copy as message')
          ])
        ])
      ])
    ]);

    function accept() {
      var result = CF.actions.acceptQuote(quote.id, { date: F.today() });
      if (!result) return;          // the write was refused; the toast explains why
      CF.ui.toast('Job booked' + (quote.clientId ? '' : ' and client created'));
      go('#/jobs/' + result.job.id + '/edit');
    }

    function decline() {
      CF.ui.confirm({
        title: 'Mark this quote declined?',
        message: 'It stays in your records so you can see your win rate. You can always build a new one.',
        confirmLabel: 'Mark Declined'
      }).then(function (ok) {
        if (!ok) return;
        CF.actions.setQuoteStatus(quote.id, 'declined');
        CF.ui.toast('Quote marked declined', {
          undo: function () { CF.store.undo(); CF.shell.repaint(); }
        });
        CF.shell.repaint();
      });
    }

    function copyQuote() {
      var lines = [
        'Hi ' + String(name).split(' ')[0] + ',',
        '',
        'Here\'s your quote for ' + Q.serviceName(quote.serviceId).toLowerCase() + ':',
        '',
        Q.serviceName(quote.serviceId) + ' — ' + F.money(quote.price),
        quoteTax(quote) > 0
          ? 'Plus ' + taxWord() + ' ' + F.money(quoteTax(quote)) +
            ' — total ' + F.money(quote.price + quoteTax(quote))
          : null,

        Number(quote.sqft).toLocaleString() + ' sq ft · ' +
          F.plural(quote.beds, 'bed') + ' · ' + F.plural(quote.baths, 'bath'),
        'Frequency: ' + frequencyLabel(quote.frequency),
        '',
        'Let me know if you\'d like to get booked in.',
        biz.name ? '— ' + biz.name : ''
      ];
      CF.ui.copy(lines.filter(function (l) { return l !== null; }).join('\n'), 'Quote');
    }
  }

  /**
   * The tax on this quote.
   *
   * While a quote is open, this is re-derived from the current rate: the client
   * must see the number they will actually be invoiced, and the invoice is
   * raised at the rate in force when the work is done.
   *
   * Once accepted, it is read back from the quote. That figure was frozen at
   * acceptance, and it is what the client agreed to — changing the rate in
   * Settings afterwards used to rewrite the total on a signed quote and on the
   * "Copy as message" text, leaving it disagreeing with the invoice already
   * raised against it.
   */
  function quoteTax(quote) {
    if (quote.status === 'accepted' && quote.tax !== undefined && quote.tax !== null) {
      return Number(quote.tax) || 0;
    }
    return CF.pricing.taxOn(Number(quote.price) || 0);
  }

  /** The label for the tax line — the rate that applied, once one is frozen. */
  function quoteTaxWord(quote) {
    if (quote.status === 'accepted' && quote.taxRateAtAccept) {
      return taxWord() + ' at ' + quote.taxRateAtAccept + '%';
    }
    return taxWord();
  }

  function taxWord() {
    return CF.store.get().settings.taxLabel || 'Tax';
  }

  function frequencyLabel(id) {
    var f = CF.schema.FREQUENCIES.filter(function (x) { return x.id === id; })[0];
    return f ? f.label : 'One-time';
  }

  CF.views = CF.views || {};
  CF.views.quote = { render: render, reset: reset };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/grow.js */
/* ==========================================================================
   🚀 GROW — the work your own client list is already worth chasing

   Every money figure on this screen is potential, not earned: a client whose
   interval has lapsed, a quote nobody has answered. MONEY is the screen for
   what actually came in.

   Every card is earned by real data: a lapsed interval, an unanswered
   quote, a finished job with no review asked. Each one carries a message
   you can copy and send in seconds.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  function render() {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;

    var rebook = Q.readyToRebook();
    var followUp = Q.staleQuotes();
    var reviews = Q.readyForReview();
    var referrals = Q.referralCandidates();

    var potential = rebook.reduce(function (a, r) { return a + r.estimatedValue; }, 0) +
                    followUp.reduce(function (a, q) { return a + (q.price || 0); }, 0);

    var page = el('div.anim-fade-up', [
      el('h1.h-page', 'Grow Your Business'),
      // Every figure on this screen is work that has *not* been agreed: a
      // client who is due but has not said yes, a quote that has not been
      // answered. Saying "$645 is sitting here" put an unearned number in the
      // same visual language as the real totals in MONEY, which is how a solo
      // owner ends up planning around money nobody has promised them.
      el('div.sub.mb-6', potential > 0
        ? 'Up to ' + F.money(potential) + ' of potential work is waiting on a ' +
          'follow-up. Nothing here is booked or confirmed yet — these are ' +
          'estimates based on your usual prices.'
        : 'A few simple actions could bring in real revenue this week.')
    ]);

    var cards = [
      rebook.length ? rebookCard() : null,
      followUp.length ? followUpCard() : null,
      reviews.length ? reviewCard() : null,
      referrals.length ? referralCard() : null
    ].filter(Boolean);

    if (!cards.length) {
      page.appendChild(U.empty({
        title: 'Nothing to chase right now',
        body: Q.activeClients().length
          ? 'Every client is booked, every quote is answered and every review has been asked for. ' +
            'Opportunities appear here automatically as jobs finish and intervals lapse.'
          : 'Once you have clients and completed jobs, CleanFlow surfaces rebooking, review ' +
            'and referral opportunities right here.'
      }));
    } else {
      // Cards size to their content rather than stretching to the tallest in
      // the row — an opportunity card padded with empty space reads as broken.
      page.appendChild(el('div.grid.grid-2.mb-6', {
        style: { alignItems: 'start' }
      }, cards));
    }

    page.appendChild(proposalBanner());
    page.appendChild(templateLibrary());
    return page;

    /* ---- cards ------------------------------------------------------------- */

    function card(config) {
      return el('div.opp', [
        el('div.opp__title', config.icon + ' ' + config.title),
        config.revenue ? el('div.opp__revenue', [
          'Potential value: ', el('b', F.money(config.revenue)),
          el('span.opp__revenue-note', ' · estimated, not booked')
        ]) : null,
        el('div.opp__why', config.why),
        el('div.stack.stack-2.mt-4', config.items)
      ]);
    }

    function oppItem(config) {
      var done = !!CF.store.get().outreach[config.key];
      return el('div.opp__item', [
        el('div.row.between.row-2.row-wrap', [
          el('div.opp__item-label', config.label),
          el('div.row.row-2', [
            config.primary ? el('button.btn.btn--sm', {
              type: 'button',
              style: { background: 'var(--brand-tint-2)', border: '1px solid var(--brand-border)',
                       color: 'var(--brand-text)' },
              onclick: config.primary.onClick
            }, config.primary.label) : null,
            el('button.btn.btn--secondary.btn--sm', {
              type: 'button', onclick: config.onCopy
            }, 'Copy')
          ])
        ]),
        done
          ? el('div.opp__done', [
              '✓ Marked contacted',
              el('button.linkbtn', {
                type: 'button',
                style: { fontSize: '11.5px', marginLeft: '8px', color: 'var(--text-faint)' },
                onclick: function () {
                  CF.actions.clearContacted(config.key);
                  CF.shell.repaint();
                }
              }, 'undo')
            ])
          : el('button.linkbtn', {
              type: 'button',
              style: { fontSize: '11.5px', textDecoration: 'none', padding: '4px 0' },
              onclick: function () {
                CF.actions.markContacted(config.key);
                CF.shell.repaint();
              }
            }, 'Mark contacted')
      ]);
    }

    function rebookCard() {
      return card({
        icon: '💰',
        title: F.plural(rebook.length, 'client') + ' ready to rebook',
        revenue: rebook.reduce(function (a, r) { return a + r.estimatedValue; }, 0),
        why: 'Their normal cleaning interval has passed and nothing is booked ahead.',
        items: rebook.slice(0, 5).map(function (r) {
          return oppItem({
            key: 'rebook:' + r.client.id + ':' + r.lastJobDate,
            label: r.client.name + ' — ' + F.plural(r.daysSince, 'day') + ' since last visit',
            primary: {
              label: 'Book Again',
              onClick: function () { go('#/jobs/new?client=' + r.client.id); }
            },
            onCopy: function () {
              copyTemplate('tpl-rebook', {
                client: firstName(r.client.name),
                days: r.daysSince
              }, 'Rebook message');
            }
          });
        })
      });
    }

    function followUpCard() {
      return card({
        icon: '💬',
        title: F.plural(followUp.length, 'quote') + ' need follow-up',
        revenue: followUp.reduce(function (a, q) { return a + (q.price || 0); }, 0),
        why: 'Sent a few days ago with no answer yet. One nudge wins more of these than you\'d think.',
        items: followUp.slice(0, 5).map(function (q) {
          var name = q.clientName || Q.clientName(q.clientId);
          return oppItem({
            key: 'followup:' + q.id,
            label: name + ' — sent ' + F.agoPhrase(q.sentDate || q.date),
            primary: {
              label: 'Open',
              onClick: function () { go('#/money/quote/' + q.id); }
            },
            onCopy: function () {
              copyTemplate('tpl-followup', {
                client: firstName(name),
                amount: F.money(q.price)
              }, 'Follow-up message');
            }
          });
        })
      });
    }

    function reviewCard() {
      return card({
        icon: '⭐',
        title: F.plural(reviews.length, 'customer') + ' ready for a review request',
        why: 'They had a clean recently and you haven\'t asked yet. Reviews are how new clients find you.',
        items: reviews.slice(0, 5).map(function (r) {
          return oppItem({
            key: 'review:' + r.client.id,
            label: r.client.name + ' — ' + F.plural(r.stats.jobsCompleted, 'job') + ' completed',
            onCopy: function () {
              copyTemplate('tpl-review', { client: firstName(r.client.name) }, 'Review request');
            }
          });
        })
      });
    }

    function referralCard() {
      return card({
        icon: '🤝',
        title: F.plural(referrals.length, 'referral opportunity', 'referral opportunities'),
        why: 'Long-standing clients who keep rebooking — the people most likely to recommend you.',
        items: referrals.slice(0, 5).map(function (r) {
          return oppItem({
            key: 'referral:' + r.client.id,
            label: 'Ask ' + r.client.name + ' — ' +
                   F.plural(r.stats.jobsCompleted, 'job') + ' together',
            onCopy: function () {
              copyTemplate('tpl-referral', { client: firstName(r.client.name) }, 'Referral message');
            }
          });
        })
      });
    }

    /* ---- extras --------------------------------------------------------------- */

    function proposalBanner() {
      return el('div.ink.row.between.row-5.row-wrap', [
        el('div', [
          el('div', { style: { fontSize: '17px', fontWeight: '800' } },
            'Commercial Proposal Generator'),
          el('div', { style: { fontSize: '13.5px', color: 'var(--ink-muted)', marginTop: '4px' } },
            'Create a professional printable proposal for offices, gyms and retail clients.')
        ]),
        el('button.btn.btn--primary', {
          type: 'button', onclick: function () { go('#/grow/proposal'); }
        }, 'Build Proposal')
      ]);
    }

    function templateLibrary() {
      return el('div.mt-8', [
        U.sectionHeader('Message Templates'),
        el('p.meta.mb-3', 'Edit these once and every Copy button uses your own words.'),
        el('div.stack.stack-2', CF.store.all('templates').map(function (t) {
          return el('div.listrow', [
            el('div.grow', [
              el('div.listrow__title', t.name),
              el('div.listrow__sub.truncate', t.body)
            ]),
            el('button.btn.btn--secondary.btn--sm', {
              type: 'button', onclick: function () { editTemplate(t); }
            }, 'Edit')
          ]);
        }))
      ]);
    }

    function editTemplate(t) {
      var body = t.body;
      CF.ui.modal({
        size: 'md', title: 'Edit: ' + t.name,
        sub: 'Use {client}, {business}, {amount}, {days} and {referralOffer} as placeholders.',
        body: function () {
          return U.field({
            label: 'Message', value: body, multiline: true, rows: 6, autofocus: true,
            onInput: function (v) { body = v; }
          }).node;
        },
        actions: function (close) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { close(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                CF.store.update('templates', t.id, { body: body }, 'Edit template');
                close();
                CF.ui.toast('Template saved');
                CF.shell.repaint();
              }
            }, 'Save')
          ];
        }
      });
    }

    function copyTemplate(templateId, vars, label) {
      var t = CF.store.find('templates', templateId);
      CF.ui.copy(CF.actions.renderTemplate(t ? t.body : '', vars), label);
    }

    function firstName(name) { return String(name || '').split(' ')[0]; }
  }

  /* ---- Commercial proposal --------------------------------------------------------- */

  var proposal = null;

  function blankProposal() {
    return {
      client: '', property: '',
      scope: 'Nightly trash removal, kitchen & breakroom sanitation, restroom deep clean, ' +
             'common area vacuuming and surface disinfecting.',
      frequency: '5x / week',
      price: '', period: 'month',
      terms: 'Net 15 · 90-day minimum commitment · cancel anytime after.',
      number: CF.store.get().counters.proposal + 1
    };
  }

  /** Has anything actually been typed, or is this still the starting text? */
  function proposalStarted(p) {
    if (!p) return false;
    var blank = blankProposal();
    return ['client', 'property', 'scope', 'frequency', 'price', 'terms']
      .some(function (k) { return String(p[k] || '') !== String(blank[k] || ''); });
  }

  function renderProposal() {
    var U = CF.ui, F = CF.fmt, go = CF.router.go;
    var biz = CF.store.get().business;

    // A proposal takes real typing and is never saved as a record — the next
    // step is Print. A reload after that (or a back-swipe on a phone) used to
    // wipe it with nothing to recover. Pick the draft back up instead.
    if (!proposal) proposal = CF.drafts.load('proposal') || blankProposal();

    function remember() {
      if (proposalStarted(proposal)) CF.drafts.save('proposal', proposal);
      else CF.drafts.clear('proposal');
    }

    var preview = el('div.paper');

    function paintPreview() {
      CF.dom.mount(preview, el('div', [
        el('div.doc__head', [
          el('div.doc__biz', biz.name || 'Your Business Name'),
          el('div.doc__ref', 'Proposal #CP-' + proposal.number)
        ]),
        el('div.doc__block', [
          el('div.doc__label', 'Prepared for'),
          el('div.doc__value', proposal.client || 'Client name'),
          proposal.property ? el('div.meta.mt-1', proposal.property) : null
        ]),
        el('div.doc__block', [
          el('div.doc__label', 'Scope of work'),
          el('div.doc__body', proposal.scope)
        ]),
        el('div.doc__total', [
          el('div', { style: { fontSize: '13.5px', color: 'var(--text-muted)' } },
            'Frequency: ' + proposal.frequency),
          el('div.h-card', proposal.price
            ? F.money(F.parseMoney(proposal.price)) + '/' + proposal.period
            : '—')
        ]),
        el('div.doc__terms', 'Terms: ' + proposal.terms),
        biz.phone || biz.email ? el('div.doc__terms', { style: { marginTop: '8px' } },
          [biz.phone, biz.email].filter(Boolean).join(' · ')) : null
      ]));
    }

    function bind(label, key, opts) {
      var cfg = Object.assign({
        label: label, value: proposal[key],
        onInput: function (v) { proposal[key] = v; remember(); paintPreview(); }
      }, opts || {});
      return U.field(cfg).node;
    }

    function discard() {
      proposal = null;
      CF.drafts.clear('proposal');
      CF.shell.repaint();
    }

    paintPreview();

    return el('div.anim-fade-up', [
      el('div.no-print', [
        U.backLink('Back to Grow', function () { go('#/grow'); }),
        el('h1.h-page.mb-5', 'Commercial Proposal')
      ]),

      el('div.grid.grid-calc', [
        el('div.card.card--roomy.stack.stack-4.no-print', [
          bind('Client', 'client', { placeholder: 'e.g. Meridian Coworking', autofocus: true }),
          bind('Property', 'property', { placeholder: '3rd floor office suite' }),
          bind('Scope of work', 'scope', { multiline: true, rows: 4 }),
          bind('Frequency', 'frequency', { placeholder: '5x / week' }),
          el('div.grid.grid-2', [
            bind('Price', 'price', { type: 'number', inputmode: 'decimal',
              prefix: CF.store.get().settings.currencySymbol }),
            U.field({
              label: 'Per', type: 'select', value: proposal.period,
              options: [
                { value: 'month', label: 'Month' },
                { value: 'week', label: 'Week' },
                { value: 'visit', label: 'Visit' }
              ],
              onChange: function (v) { proposal.period = v; remember(); paintPreview(); }
            }).node
          ]),
          bind('Terms', 'terms', { multiline: true, rows: 2 }),

          !biz.name ? el('div.callout.callout--warn',
            'Add your business name in Settings so it appears at the top of this proposal.') : null,

          el('div.row.row-3', [
            el('button.btn.btn--primary', {
              type: 'button', style: { flex: '1' },
              onclick: function () { window.print(); }
            }, 'Print / Save PDF'),
            el('button.btn.btn--secondary', {
              type: 'button',
              onclick: function () {
                if (!proposalStarted(proposal)) { discard(); return; }
                CF.ui.confirm({
                  title: 'Clear this proposal?',
                  message: 'Everything you have typed here will be discarded. ' +
                           'Print or save a PDF first if you still need it.',
                  confirmLabel: 'Clear It', cancelLabel: 'Keep Typing', danger: true
                }).then(function (ok) { if (ok) discard(); });
              }
            }, 'Clear')
          ])
        ]),
        preview
      ])
    ]);
  }

  CF.views = CF.views || {};
  /**
   * Forget the proposal being typed.
   *
   * `proposal` is module state, so clearing the saved draft was not enough — the
   * in-memory copy repopulated the form inside a business it was never written
   * for. A restore calls this the way it calls the quote screen's reset.
   */
  function resetProposal() { proposal = null; }

  CF.views.grow = {
    render: render, renderProposal: renderProposal, resetProposal: resetProposal
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/settings.js */
/* ==========================================================================
   Settings — business details, services, pricing, and the data you own

   The Backup & Data block is the most important thing in this panel. There
   is no cloud copy, so this is where the product is honest about that and
   makes exporting a one-tap habit.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  function open() {
    CF.ui.drawer({
      title: 'Settings',
      body: function (close) { return panel(close); }
    });
  }

  function panel(close) {
    var host = el('div.stack.stack-6');
    paint();
    return host;

    function paint() {
      CF.dom.clear(host);
      var db = CF.store.get();
      var F = CF.fmt, U = CF.ui;

      /* ---- Demo notice ---- */
      if (db.settings.demoMode) {
        host.appendChild(el('div.callout.callout--warn', [
          el('div.callout__title', '🧪 You\'re in the demo'),
          el('div.callout__body',
            'This is sample data for Sparkle & Shine. Starting your own business clears it.'),
          el('button.btn.btn--primary.btn--block.btn--sm.mt-3', {
            type: 'button', onclick: function () { startReal(close); }
          }, 'Start My Business')
        ]));
      }

      /* ---- Business ---- */
      host.appendChild(group('Business', [
        row('Business name', db.business.name || 'Not set', function () {
          editText('Business name', db.business.name, function (v) {
            CF.store.commit('Edit business', function (d) { d.business.name = v; });
          });
        }),
        row('Your name', db.business.owner || 'Not set', function () {
          editText('Your name', db.business.owner, function (v) {
            CF.store.commit('Edit business', function (d) { d.business.owner = v; });
          });
        }),
        row('Phone', db.business.phone || 'Not set', function () {
          editText('Phone', db.business.phone, function (v) {
            CF.store.commit('Edit business', function (d) { d.business.phone = v; });
          });
        }),
        row('Email', db.business.email || 'Not set', function () {
          editText('Email', db.business.email, function (v) {
            CF.store.commit('Edit business', function (d) { d.business.email = v; });
          });
        }),
        row('Service area', db.business.serviceArea || 'Not set', function () {
          editText('Service area', db.business.serviceArea, function (v) {
            CF.store.commit('Edit business', function (d) { d.business.serviceArea = v; });
          });
        })
      ]));

      /* ---- Appearance ---- */
      host.appendChild(group('Appearance', [themeRow()]));

      /* ---- Money settings ---- */
      var currency = CF.schema.CURRENCIES.filter(function (c) {
        return c.code === db.settings.currency;
      })[0] || CF.schema.CURRENCIES[0];

      host.appendChild(group('Money', [
        row('Currency', currency.label + ' (' + currency.symbol.trim() + ')', editCurrency),
        // A rate outside 0-100 cannot be typed in, but a restored or edited file
        // can carry one. Billing caps it at 100%, so showing a bare "450%" here
        // tells the owner they are charging something they are not.
        row('Tax', db.settings.taxEnabled
          ? db.settings.taxLabel + ' ' + db.settings.taxRate + '%' +
            (validRate(db.settings.taxRate) ? '' : ' — not valid, tap to fix')
          : 'Off', editTax),
        row('Invoice terms', F.plural(db.settings.invoiceTermsDays, 'day'), function () {
          editNumber('Invoice terms (days)', db.settings.invoiceTermsDays, function (v) {
            CF.store.commit('Edit terms', function (d) { d.settings.invoiceTermsDays = v; });
          }, null, 3650);
        }),
        row('Your hourly cost', F.money(db.settings.hourlyCost), function () {
          editNumber('Your hourly cost', db.settings.hourlyCost, function (v) {
            CF.store.commit('Edit cost', function (d) { d.settings.hourlyCost = v; });
          }, 'Used to estimate profit on quotes. Include your time, supplies and travel.');
        }),
        row('Round prices to', F.money(db.settings.roundTo), function () {
          editNumber('Round prices to nearest', db.settings.roundTo, function (v) {
            CF.store.commit('Edit rounding', function (d) { d.settings.roundTo = Math.max(1, v); });
          });
        })
      ]));

      /* ---- Services ---- */
      host.appendChild(group('Services & Pricing',
        CF.store.all('services').map(function (s) {
          return row(
            s.name + (s.active === false ? ' (off)' : ''),
            F.money(s.basePrice),
            function () { editService(s); }
          );
        }).concat([
          el('button.btn.btn--secondary.btn--block.btn--sm', {
            type: 'button', onclick: addService
          }, '+ Add a service')
        ])
      ));

      /* ---- Add-ons ---- */
      host.appendChild(group('Add-ons',
        CF.store.all('addons').map(function (a) {
          return row(a.name, '+' + F.money(a.price), function () { editAddon(a); });
        }).concat([
          el('button.btn.btn--secondary.btn--block.btn--sm', {
            type: 'button', onclick: addAddon
          }, '+ Add an add-on')
        ])
      ));

      /* ---- Checklists ---- */
      host.appendChild(group('Cleaning Checklists',
        CF.store.all('checklists').map(function (c) {
          return row(c.name, F.plural(c.items.length, 'step'), function () { editChecklist(c); });
        })
      ));

      /* ---- Follow-up timing ---- */
      host.appendChild(group('Follow-up timing', [
        row('Nudge quotes after', F.plural(db.settings.quoteFollowUpDays, 'day'), function () {
          editNumber('Nudge unanswered quotes after (days)', db.settings.quoteFollowUpDays,
            function (v) {
              CF.store.commit('Edit timing', function (d) { d.settings.quoteFollowUpDays = v; });
            }, null, 365);
        }),
        row('Rebook grace period', F.plural(db.settings.rebookGraceDays, 'day'), function () {
          editNumber('Days past due before "ready to rebook"', db.settings.rebookGraceDays,
            function (v) {
              CF.store.commit('Edit timing', function (d) { d.settings.rebookGraceDays = v; });
            }, null, 365);
        }),
        row('Referral offer', db.settings.referralOffer || 'Not set', function () {
          editText('Referral thank-you offer', db.settings.referralOffer, function (v) {

          }, 'e.g. $20 — used in your referral message template.');

      ]));

      /* ---- Backup & data ---- */
      host.appendChild(backupSection());

      /* ---- Danger zone ---- */
      host.appendChild(dangerZone());

      host.appendChild(el('p.meta.center', 'CleanFlow · runs entirely on this device'));

    /* ---- building blocks ------------------------------------------------- */

    /**
     * Theme picker. A segmented control rather than a row-and-modal because
     * it is the one setting where you want to see the result the instant you
     * touch it — the whole screen is the preview.
     */
    function themeRow() {
      var host = el('div.seg.seg--outline', {
        role: 'group', 'aria-label': 'Appearance'
      });
      var options = [
        { value: 'system', label: 'System' },
        { value: 'light',  label: 'Light' },
        { value: 'dark',   label: 'Dark' }
      ];

      function paint() {
        var picked = CF.theme.choice();
        CF.dom.clear(host);
        options.forEach(function (o) {
          host.appendChild(el('button.seg__item', {
            type: 'button',
            // Sized by its own label rather than forced to a third of the
            // drawer: at 360px an equal split clipped "System" to "Syst…".
            style: { flex: '1 1 auto', minWidth: 'max-content' },
            'aria-pressed': picked === o.value ? 'true' : 'false',
            onclick: function () {
              CF.theme.set(o.value);
              paint();
              // Repaint the app behind the drawer so every screen is already
              // in the new theme when this closes.
              CF.shell.repaint();
            }
          }, o.label));
        });
      }
      paint();

      return el('div.stack.stack-2', [
        host,
        el('div.meta',
          'System follows your phone or computer. Printed invoices and quotes ' +
          'always come out on white paper.')
      ]);
    }

    function group(title, rows) {
      return el('div', [
        el('div.eyebrow.mb-3', title),
        el('div.stack.stack-2', rows)
      ]);
    }

    function row(label, value, onClick) {
      return el(onClick ? 'button' : 'div', {
        type: onClick ? 'button' : null,

        style: {
          padding: '13px 14px', background: 'var(--surface-sunken)',
          border: '1px solid var(--border-soft)', borderRadius: 'var(--r-md)',
          cursor: onClick ? 'pointer' : 'default', width: '100%',
          font: 'inherit', color: 'inherit', textAlign: 'left', gap: '12px'
        },
        onclick: onClick || null
      }, [
        el('span', { style: { fontSize: '13.5px', fontWeight: '600' } }, label),
        el('span', { style: { fontSize: '13px', color: 'var(--text-faint)' } }, value)
      ]);

          .map(function (kind) {

    /**
     * The one backup that outlives the browser. Hidden entirely where the
     * File System Access API is missing, so nobody is shown a dead button.
     */
    function vaultSection() {
      if (!CF.vault || !CF.vault.supported()) {
        return el('div.callout.callout--info.mb-3',
          '💡 Tip: keep your exported backups in a cloud-synced folder ' +
          '(Dropbox, iCloud, OneDrive). That copy survives even if this ' +
          'browser\'s data is cleared.');
      }

      var host = el('div.mb-3');
      paintVault();
      return host;

      function paintVault() {
        CF.vault.status().then(function (st) {
          CF.dom.clear(host);

          if (!st.configured) {
            host.appendChild(el('div.callout.callout--info', [
              el('div.callout__title', '📁 Auto-Backup Folder'),
              el('div', { style: { fontSize: '12.5px', lineHeight: '1.6' } },
                'Pick a folder once — ideally one that syncs to the cloud — and ' +
                'CleanFlow keeps a fresh backup in it automatically. This is the ' +
                'only copy that survives clearing your browser data.'),
              el('button.btn.btn--primary.btn--block.btn--sm.mt-3', {
                type: 'button', onclick: pick
              }, 'Choose a Folder')
            ]));
            return;
          }

          var needsPermission = st.permission !== 'granted';
          host.appendChild(el('div.callout.callout--' + (needsPermission ? 'warn' : 'ok'), [
            el('div.callout__title', '📁 Auto-Backup Folder'),
            el('div', { style: { fontSize: '12.5px', lineHeight: '1.6' } },
              needsPermission
                ? 'Saving to "' + st.folderName + '" is paused — your browser needs ' +
                  'you to allow access again.'
                : 'Backing up to "' + st.folderName + '"' +
                  (st.lastWrite ? ' · last copy ' + CF.fmt.agoPhrase(CF.fmt.toKey(new Date(st.lastWrite))) : '')),
            el('div.row.row-2.mt-3', [
              el('button.btn.btn--primary.btn--sm', {
                type: 'button', style: { flex: '1' },
                onclick: function () {
                  CF.vault.write(true).then(function () {
                    CF.ui.toast('Saved a copy to ' + st.folderName);
                    paintVault();
                  }).catch(function () {
                    CF.ui.toast('Could not write to that folder', { tone: 'bad' });
                    paintVault();
                  });
                }
              }, needsPermission ? 'Reconnect' : 'Save Now'),
              el('button.btn.btn--secondary.btn--sm', {
                type: 'button',
                onclick: function () {
                  CF.vault.forget().then(function () {
                    CF.ui.toast('Folder backup turned off');
                    paintVault();
                  });
                }
              }, 'Turn Off')
            ])
          ]));
        }).catch(function () { CF.dom.clear(host); });
      }

      function pick() {
        CF.vault.choose().then(function () {
          CF.ui.toast('Folder backup is on — a copy is saved there automatically');
          paintVault();
        }).catch(function (err) {
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
          CF.ui.toast('Could not set up that folder', { tone: 'bad' });
        });
      }
    }

    function dangerZone() {
      var db = CF.store.get();
      return el('div', [
        el('div.eyebrow.mb-3', { style: { color: 'var(--bad-text)' } }, 'Danger Zone'),

    /* ---- editors ---------------------------------------------------------- */

    function editText(label, value, onSave, hint) {
      var next = value || '';
      CF.ui.modal({
        size: 'sm', title: label,
        body: function () {
          return CF.ui.field({
            label: null, value: next, autofocus: true, hint: hint,
            onInput: function (v) { next = v; }
          }).node;
        },
        actions: function (closeModal) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { closeModal(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () { onSave(next.trim()); closeModal(); paint(); CF.shell.repaint(); }
            }, 'Save')
          ];
        }
      });
    }

    /**
     * A price or duration typed into a service or add-on.
     *
     * These fields used `Number(v) || 0`, which lets a negative through
     * unchanged and turns 1e999 into Infinity. A service saved that way booked
     * every later job at a negative or infinite price.
     */
    function validRate(v) {
      var n = Number(v);
      return isFinite(n) && n >= 0 && n <= 100;
    }

    function positiveNumber(v, cap) {
      var n = Number(v);
      if (!isFinite(n) || n < 0) return 0;
      return Math.min(n, cap);
    }

    function editNumber(label, value, onSave, hint, cap) {
      var next = value;
      CF.ui.modal({
        size: 'sm', title: label,
        body: function () {
          return CF.ui.field({
            label: null, value: next, type: 'number', inputmode: 'decimal',
            autofocus: true, hint: hint,
            onInput: function (v) { next = v; }
          }).node;
        },
        actions: function (closeModal) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { closeModal(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                var n = Number(next);
                // isNaN lets Infinity through: 1e999 passed both checks and was
                // saved, and as an invoice term it produced a due date of
                // "NaN-NaN-NaN". An upper bound keeps the figure meaningful.
                var top = cap || 1000000;
                if (!isFinite(n) || n < 0) {
                  CF.ui.toast('Enter a number', { tone: 'bad' }); return;
                }
                if (n > top) {
                  CF.ui.toast('That is too large — the most is ' + top, { tone: 'bad' });
                  return;
                }
                onSave(n); closeModal(); paint(); CF.shell.repaint();
              }
            }, 'Save')
          ];
        }
      });
    }

    function editCurrency() {
      var code = CF.store.get().settings.currency;
      CF.ui.modal({
        size: 'sm', title: 'Currency',
        sub: 'Changes how every amount is displayed. It does not convert existing numbers.',
        body: function () {
          return CF.ui.field({
            label: null, type: 'select', value: code, autofocus: true,
            options: CF.schema.CURRENCIES.map(function (c) {
              return { value: c.code, label: c.label + ' (' + c.symbol.trim() + ')' };
            }),
            onChange: function (v) { code = v; }
          }).node;
        },
        actions: function (closeModal) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { closeModal(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                var c = CF.schema.CURRENCIES.filter(function (x) { return x.code === code; })[0];
                CF.store.commit('Change currency', function (d) {
                  d.settings.currency = c.code;
                  d.settings.currencySymbol = c.symbol;
                });

    function editTax() {
      var s = CF.store.get().settings;
      var next = { enabled: s.taxEnabled, rate: s.taxRate, label: s.taxLabel };
      // Starting this true meant that opening the editor on a rate a restored
      // file had left out of range and pressing Save committed it again,
      // unchanged and unquestioned. It reflects the value on screen from the
      // outset, so Save is refused until the rate is actually valid.
      var rateValid = validRate(s.taxRate);
      // Declared out here because the Save handler lives in a sibling closure
      // and has to be able to re-show the error.
      var rateField = null;
      CF.ui.modal({
        size: 'sm', title: 'Tax',
        sub: 'Applied to new invoices. Existing invoices keep the tax they were raised with.',
        body: function () {
          rateField = CF.ui.field({
            label: 'Rate (%)', value: next.rate, type: 'number', inputmode: 'decimal',
            min: 0, max: 100,
            hint: 'A percentage, e.g. 8.25 — not the amount.',
            onInput: function (v) {
              var n = Number(v);
              // A stray minus sign here would quietly discount every invoice.
              if (v !== '' && (!isFinite(n) || n < 0 || n > 100)) {
                rateField.setError('Enter a rate between 0 and 100.');
                // Keep the last good rate. Falling back to 0 meant that typing
                // 150, reading the error and saving anyway charged no tax from
                // then on — the opposite of what was asked for, with nothing
                // said. Save is blocked instead, so the number cannot be lost.
                rateValid = false;
                return;
              }
              rateField.setError('');
              rateValid = true;
              next.rate = isFinite(n) ? n : 0;
            }
          });
          var labelField = CF.ui.field({
            label: 'What do you call it?', value: next.label,
            placeholder: 'Tax, VAT, GST…',
            onInput: function (v) { next.label = v; }
          });
          var toggle = CF.ui.checkRow({
            label: 'Charge tax on invoices', checked: next.enabled,
            onToggle: function () {
              next.enabled = !next.enabled;
              toggle.setAttribute('aria-pressed', next.enabled ? 'true' : 'false');
              toggle.querySelector('.checkrow__box').textContent = next.enabled ? '✓' : '';
            }
          });
          if (!rateValid) rateField.setError('Enter a rate between 0 and 100.');
          return el('div.stack.stack-4', [toggle, rateField.node, labelField.node]);
        },
        actions: function (closeModal) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { closeModal(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                if (!rateValid) {
                  if (rateField) rateField.setError('Enter a rate between 0 and 100.');
                  CF.ui.toast('Fix the tax rate before saving', { tone: 'bad' });
                  return;
                }
                CF.store.commit('Edit tax', function (d) {
                  d.settings.taxEnabled = next.enabled;
                  d.settings.taxRate = next.rate;
                  d.settings.taxLabel = next.label || 'Tax';
                });
                closeModal(); paint(); CF.shell.repaint();
              }
            }, 'Save')
          ];
        }
      });
    }

    function editChecklist(c) {
      var text = c.items.join('\n');
      CF.ui.modal({
        size: 'md', title: c.name,
        sub: 'One step per line. This is the checklist you tick off during a clean.',
        body: function () {
          return el('div.stack.stack-4', [

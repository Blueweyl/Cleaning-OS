            options: CF.schema.PROPERTY_TYPES.map(function (t) { return { value: t, label: t }; }),
            onChange: function (v) { draft.propertyType = v; } }).node,
          U.field({ label: 'Size (sq ft)', value: draft.sqft, type: 'number',
            inputmode: 'numeric', placeholder: '1800',
            onInput: function (v) { draft.sqft = v; } }).node
        ]),
        el('div.grid.grid-2', [
          U.field({ label: 'Bedrooms', value: draft.beds, type: 'number', min: 0, max: 20,
            inputmode: 'numeric', onInput: function (v) { draft.beds = Number(v); } }).node,
          U.field({ label: 'Bathrooms', value: draft.baths, type: 'number', min: 0, max: 20,
            inputmode: 'numeric', onInput: function (v) { draft.baths = Number(v); } }).node
        ])
      ]),

      el('div.card.card--roomy.stack.stack-4', [
        el('h2.h-section', 'Getting in'),
        el('p.meta', { style: { marginTop: '-8px' } },
          'This is what shows on the job card when you arrive.'),
        U.field({ label: 'Access instructions', value: draft.access, multiline: true, rows: 2,
          placeholder: 'Side gate code 4471. Key under the blue planter.',
          onInput: function (v) { draft.access = v; } }).node,
        U.field({ label: 'Pets', value: draft.pets, multiline: true, rows: 2,
          placeholder: 'Friendly golden retriever — keep the back door closed.',
          onInput: function (v) { draft.pets = v; } }).node,
        U.field({ label: 'Cleaning preferences', value: draft.preferences, multiline: true, rows: 2,
          placeholder: 'Eco-friendly products only. Kitchen first.',
          onInput: function (v) { draft.preferences = v; } }).node
      ]),

      el('div.card.card--roomy.stack.stack-4', [
        el('h2.h-section', 'Service & status'),
        el('div.grid.grid-2', [
          U.field({ label: 'Preferred service', type: 'select', value: draft.preferredServiceId,
            options: Q.activeServices().map(function (s) { return { value: s.id, label: s.name }; }),
            onChange: function (v) { draft.preferredServiceId = v; } }).node,
          U.field({ label: 'Frequency', type: 'select', value: draft.frequency,
            options: CF.schema.FREQUENCIES.map(function (f) { return { value: f.id, label: f.label }; }),
            onChange: function (v) { draft.frequency = v; } }).node
        ]),
        U.field({ label: 'Status', type: 'select', value: draft.status,
          options: CF.schema.CLIENT_STATUS.map(function (s) { return { value: s.id, label: s.label }; }),
          onChange: function (v) { draft.status = v; } }).node,
        U.field({ label: 'Contract / welcome info', value: draft.contract, multiline: true, rows: 2,
          placeholder: 'Signed welcome packet on file · bi-weekly agreement',
          onInput: function (v) { draft.contract = v; } }).node,
        U.field({ label: 'Notes', value: draft.notes, multiline: true, rows: 3,
          placeholder: 'Anything else worth remembering.',
          onInput: function (v) { draft.notes = v; } }).node
      ]),

      el('div.row.row-3.row-wrap', [
        el('button.btn.btn--primary.btn--lg', { type: 'submit' },
          isEdit ? 'Save Changes' : 'Add Client'),
        el('button.btn.btn--secondary.btn--lg', {
          type: 'button', onclick: function () { go(isEdit ? '#/clients/' + id : '#/clients'); }
        }, 'Cancel')
      ])
    ]);

    return el('div.anim-fade-up.page--narrow', { style: { maxWidth: '640px' } }, [
      U.backLink(isEdit ? 'Back to ' + existing.name : 'Back to Clients',
        function () { go(isEdit ? '#/clients/' + id : '#/clients'); }),
      el('h1.h-page.mb-5', isEdit ? 'Edit client' : 'New client'),
      form
    ]);

    function save() {
      // Tidy first, then validate what will actually be stored — otherwise a
      // name of pure whitespace passes the check and saves as empty.
      var clean = CF.actions.cleanClientFields(draft);

      if (!clean.name) {
        nameField.setError('Enter the client\'s name to continue.');
        nameField.input.focus();
        return;
      }
      if (clean.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(clean.email)) {
        emailField.setError('That email address does not look complete.');
        emailField.input.focus();
        return;
      }

      var dupes = CF.actions.likelyDuplicates(clean, isEdit ? id : null);
      if (dupes.length && !dupeAcknowledged) {
        askAboutDuplicate(dupes[0], clean);
        return;
      }
      commitSave(clean);
    }

    function commitSave(clean) {
      if (isEdit) {
        CF.store.update('clients', id, clean, 'Edit client');
        CF.ui.toast('Client updated');
        go('#/clients/' + id);
      } else {
        var created = CF.actions.createClient(clean);
        CF.ui.toast(created.name + ' added');
        go('#/clients/' + created.id);
      }
    }

    /**
     * Two records for one household is the quiet way a client's history splits
     * in half. Offered, not enforced — two families really can share a name.
     */
    function askAboutDuplicate(match, clean) {
      var why = CF.actions.likelyDuplicates({ name: '', phone: clean.phone },
        isEdit ? id : null).length
        ? 'the same phone number' : 'the same name';

      CF.ui.confirm({
        title: 'You may already have this client',
        message: match.name + ' has ' + why + '. Adding another record splits ' +
                 'their job history and invoices between the two.',
        confirmLabel: 'Add Anyway',
        cancelLabel: 'Open ' + match.name
      }).then(function (ok) {
        if (ok) { dupeAcknowledged = true; commitSave(clean); }
        else go('#/clients/' + match.id);
      });
    }
  }

  CF.views = CF.views || {};
  CF.views.clients = {
    renderList: renderList,
    renderProfile: renderProfile,
    renderForm: renderForm
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/jobs.js */
/* ==========================================================================
   📅 JOBS — Book → Start → Checklist → Complete → Invoice

   The list is four honest buckets. The detail screen is a doorstep card:
   address, access notes, price, one obvious button. Active cleaning is
   built for a phone held in one hand.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  var view = 'today';
  var manageOpenId = null;
  var showAll = false;
  var timerHandle = null;

  /* ---- List ----------------------------------------------------------------- */

  function renderList() {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;

    var buckets = {
      today:     Q.todaysJobsIncludingDone(),
      upcoming:  Q.upcomingJobs(),
      recurring: Q.recurringJobs(),
      completed: Q.completedJobs()
    };
    var overdue = Q.overdueJobs();
    var rows = buckets[view] || [];

    var page = el('div.anim-fade-up', [
      U.pageHeader({
        title: 'Jobs',
        actions: [
          el('button.btn.btn--secondary.btn--sm', {
            type: 'button', onclick: function () { CF.backup.exportCsv('jobs'); }
          }, 'Export CSV'),
          el('button.btn.btn--primary', {
            type: 'button', onclick: function () { go('#/jobs/new'); }
          }, '+ Book Job')
        ]
      })
    ]);

    if (overdue.length && view === 'today') {
      page.appendChild(el('div.callout.callout--warn.mb-4', [
        el('strong', F.plural(overdue.length, 'job') + ' from a past date is still open. '),
        el('button.linkbtn', {
          type: 'button', onclick: function () { view = 'overdue'; CF.shell.repaint(); }
        }, 'Review them')
      ]));
    }

    if (view === 'overdue') buckets.overdue = overdue;
    rows = buckets[view] || [];

    page.appendChild(U.tabs({
      label: 'Job views',
      value: view,
      onChange: function (v) { view = v; manageOpenId = null; showAll = false; CF.shell.repaint(); },
      options: [
        { value: 'today',     label: 'Today',     count: buckets.today.length },
        { value: 'upcoming',  label: 'Upcoming',  count: buckets.upcoming.length },
        { value: 'recurring', label: 'Recurring', count: buckets.recurring.length },
        { value: 'completed', label: 'Completed', count: buckets.completed.length }
      ].concat(overdue.length ? [{ value: 'overdue', label: 'Needs Closing', count: overdue.length }] : [])
    }));

    if (!rows.length) {
      page.appendChild(U.empty({
        small: true,
        title: emptyCopy()[0],
        body: emptyCopy()[1],
        action: { label: '+ Book a Job', onClick: function () { go('#/jobs/new'); } }
      }));
      return page;
    }

    // Years of finished jobs would otherwise draw a card each; see ui.cappedList.
    page.appendChild(U.cappedList({
      rows: rows, row: jobCard, noun: 'job', showAll: showAll,
      onShowAll: function () { showAll = true; CF.shell.repaint(); }
    }));
    return page;

    function emptyCopy() {
      return ({
        today:     ['Nothing on the books today', 'A clear day. Book a job and it shows up here.'],
        upcoming:  ['No upcoming jobs', 'Jobs you schedule ahead of time appear here.'],
        recurring: ['No recurring jobs yet', 'Set a job to repeat and the next visit books itself when you finish one.'],
        completed: ['No completed jobs yet', 'Finished jobs and their invoices land here.'],
        overdue:   ['Nothing needs closing', 'Every past job has been completed or cancelled.']
      })[view] || ['Nothing here yet', ''];
    }

    function jobCard(job) {
      var status = statusOf(job);
      var isRecurringView = view === 'recurring';
      var open = manageOpenId === job.id;

      var card = el('div.card.card--flush', [
        el('button.listrow', {
          type: 'button',
          style: { border: 'none', borderRadius: '0' },
          onclick: function () { go('#/jobs/' + job.id); }
        }, [
          el('div.listrow__time', isRecurringView
            ? frequencyLabel(job.recurrence && job.recurrence.frequency)
            : F.whenLabel(job.date, job.time)),
          el('div.listrow__rule', { 'aria-hidden': 'true' }),
          el('div.grow', [
            el('div.listrow__title', Q.clientName(job.clientId, job.clientName)),
            el('div.listrow__sub', Q.serviceName(job.serviceId, job.serviceName))
          ]),
          el('div.listrow__price', F.money(Q.jobTotal(job))),
          U.badge(status.label, status.tone)
        ])
      ]);

      if (isRecurringView) {
        card.appendChild(el('button.linkbtn', {
          type: 'button',
          style: { display: 'block', width: '100%', textAlign: 'left',
                   padding: '10px 20px', borderTop: '1px solid var(--border-softer)',
                   textDecoration: 'none', fontSize: '12.5px' },
          'aria-expanded': open ? 'true' : 'false',
          onclick: function () {
            manageOpenId = open ? null : job.id;
            CF.shell.repaint();
          }
        }, (open ? '− ' : '+ ') + 'Manage Recurring'));

        if (open) card.appendChild(recurringActions(job));
      }

      return card;
    }

    function recurringActions(job) {
      return el('div.grid.grid-2', {
        style: { gap: '8px', padding: '0 20px 16px' }
      }, [
        act('Reschedule', function () { go('#/jobs/' + job.id + '/edit'); }),
        act('Skip Next', function () {
          CF.actions.skipNextOccurrence(job.id);
          CF.ui.toast('Skipped to ' + F.shortDate(CF.store.find('jobs', job.id).date), {
            undo: undoLast
          });
        }),
        act('Change Price', function () { go('#/jobs/' + job.id + '/edit'); }),
        act('End Recurring', function () {
          CF.ui.confirm({
            title: 'End this recurring schedule?',
            message: 'Future visits for ' + Q.clientName(job.clientId, job.clientName) +
                     ' stop being booked automatically. This job itself stays on your calendar.',
            confirmLabel: 'End Schedule', danger: true
          }).then(function (ok) {
            if (!ok) return;
            CF.actions.endRecurring(job.id);
            CF.ui.toast('Recurring schedule ended', { undo: undoLast });
          });
        }, 'danger')
      ]);

      function act(label, onClick, tone) {
        return el('button.btn.btn--quiet.btn--sm', {
          type: 'button', onclick: onClick,
          style: tone === 'danger' ? { color: 'var(--bad-text)' } : null
        }, label);
      }
    }
  }

  function undoLast() { CF.store.undo(); CF.shell.repaint(); }

  function statusOf(job) {
    var s = CF.schema.JOB_STATUS.filter(function (x) { return x.id === job.status; })[0];
    return s || { label: job.status, tone: 'neutral' };
  }

  function frequencyLabel(id) {
    var f = CF.schema.FREQUENCIES.filter(function (x) { return x.id === id; })[0];
    return f ? f.label : 'One-time';
  }

  /* ---- Detail ---------------------------------------------------------------- */

  function renderDetail(id) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var job = CF.store.find('jobs', id);

    if (!job || job.deletedAt) {
      return U.empty({
        title: 'That job is no longer here',
        action: { label: 'Back to Jobs', onClick: function () { go('#/jobs'); } }
      });
    }

    var status = statusOf(job);
    var progress = Q.checklistProgress(job);
    var invoice = job.invoiceId ? CF.store.find('invoices', job.invoiceId) : null;

    return el('div.anim-fade-up', { style: { maxWidth: '640px' } }, [
      U.backLink('Back to Jobs', function () { go('#/jobs'); }),

      el('div.card.card--roomy', [
        el('div.row.between.row-3.row-wrap', [
          el('div', [
            el('h1.h-card', Q.clientName(job.clientId, job.clientName)),
            job.address ? el('div.sub', job.address) : null
          ]),
          U.badge(status.label, status.tone, true)
        ]),

        el('div.row.row-5.row-wrap', {
          style: { marginTop: '16px', padding: '14px 0',
                   borderTop: '1px solid var(--border-soft)',
                   borderBottom: '1px solid var(--border-soft)' }
        }, [
          fact('SERVICE', Q.serviceName(job.serviceId, job.serviceName)),
          fact('PRICE', F.money(Q.jobTotal(job))),
          fact('WHEN', F.whenLabel(job.date, job.time)),
          job.recurrence && job.recurrence.frequency !== 'one-time' && !job.recurrence.endedAt
            ? fact('REPEATS', frequencyLabel(job.recurrence.frequency)) : null
        ]),

        U.accessNote(job.notes) ? el('div.mt-4', U.accessNote(job.notes)) : null,

        (job.extras || []).length ? el('div.mt-4.card.card--tight', [
          el('div.eyebrow.mb-3', 'Extra charges'),
          el('div.stack.stack-2', job.extras.map(function (e) {
            return U.defRow(e.label, F.money(e.amount));
          }))
        ]) : null,

        progress.total ? el('div.mt-5', [
          el('div.row.between.mb-2', [
            el('span.meta', progress.done + '/' + progress.total + ' checklist items'),
            el('span.meta', progress.percent + '%')
          ]),
          U.progress(progress.percent)
        ]) : null,

        el('div.mt-5', [
          primaryAction(),
          // The invoice screen says when a billed figure disagrees with its own
          // lines. Showing the same figure here as plain fact made the warning
          // depend on which screen the owner happened to open.
          invoice && Q.invoiceInconsistent(invoice)
            ? el('div.meta.mt-2', { style: { color: 'var(--warn-text)' } },
                '⚠ This invoice does not add up — open it before chasing the balance.')
            : null
        ].filter(Boolean)),

        el('div.mt-4', [
          el('details', [
            el('summary', {
              style: { cursor: 'pointer', fontSize: '13px', fontWeight: '700',
                       color: 'var(--brand-text)', padding: '8px 0', listStyle: 'none' }
            }, 'More actions'),
            el('div.grid.grid-2.mt-3', [
              el('button.btn.btn--quiet.btn--sm', {
                type: 'button', onclick: function () { go('#/jobs/' + job.id + '/edit'); }
              }, 'Edit / Reschedule'),
              // Not offered once the job is closed: the invoice has already been
              // raised from these lines, so a charge added now would never
              // reach the bill the client was given.
              job.status !== 'completed' ? el('button.btn.btn--quiet.btn--sm', {
                type: 'button', onclick: addCharge
              }, 'Add Charge') : null,
              job.clientId ? el('button.btn.btn--quiet.btn--sm', {
                type: 'button', onclick: function () { go('#/clients/' + job.clientId); }
              }, 'View Client') : null,
              job.status !== 'completed' ? el('button.btn.btn--quiet.btn--sm', {
                type: 'button',
                style: { color: 'var(--bad-text)' },
                onclick: cancel
              }, 'Cancel Job') : null
            ].filter(Boolean))
          ])
        ])
      ])
    ]);

    function fact(label, value) {
      return el('div', [
        el('div', { style: { fontSize: '12px', color: 'var(--text-faint)', fontWeight: '600' } }, label),
        el('div', { style: { fontSize: '14px', fontWeight: '700', marginTop: '3px' } }, value)
      ]);
    }

    function primaryAction() {
      if (job.status === 'completed') {
        return invoice
          ? el('button.btn.btn--primary.btn--block.btn--lg', {
              type: 'button', onclick: function () { go('#/money/invoice/' + invoice.id); }
            }, 'View Invoice · ' + F.money(invoice.total))
          : el('button.btn.btn--primary.btn--block.btn--lg', {
              type: 'button',
              onclick: function () {
                var inv = CF.actions.createInvoiceForJob(job.id);
                go('#/money/invoice/' + inv.id);
              }
            }, 'Create Invoice');
      }
      if (job.status === 'cancelled') {
        return el('div.callout.callout--info', 'This job was cancelled.');
      }
      return el('button.btn.btn--primary.btn--block.btn--xl', {
        type: 'button',
        onclick: function () {
          if (job.status !== 'in_progress') CF.actions.startJob(job.id);
          go('#/jobs/' + job.id + '/clean');
        }
      }, job.status === 'in_progress' ? 'RESUME CLEANING' : 'START CLEANING');
    }

    function addCharge() {
      var amount = '', label = 'Extra';
      CF.ui.modal({
        title: 'Add a charge',
        sub: 'Gets added to this job and its invoice.',
        body: function () {
          var amt = U.field({ label: 'Amount', type: 'number', inputmode: 'decimal',
            prefix: CF.store.get().settings.currencySymbol, autofocus: true,
            onInput: function (v) { amount = v; } });
          var lbl = U.field({ label: 'What for?', value: 'Extra', placeholder: 'e.g. Inside fridge',
            onInput: function (v) { label = v; } });
          return el('div.stack.stack-4', [amt.node, lbl.node]);
        },
        actions: function (close) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { close(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                var value = Number(amount);
                if (!value || value <= 0) { CF.ui.toast('Enter an amount above zero', { tone: 'bad' }); return; }
                if (!CF.actions.addExtraCharge(job.id, label || 'Extra', value)) return;
                close();
                CF.ui.toast('Added ' + F.money(value), { undo: undoLast });
              }
            }, 'Add Charge')
          ];
        }
      });
    }

    function cancel() {
      CF.ui.confirm({
        title: 'Cancel this job?',
        message: 'The job for ' + Q.clientName(job.clientId, job.clientName) +
                 ' on ' + F.shortDate(job.date) + ' will be marked cancelled. ' +
                 'It stays in your history.',
        confirmLabel: 'Cancel Job', cancelLabel: 'Keep It', danger: true
      }).then(function (ok) {
        if (!ok) return;
        CF.actions.cancelJob(job.id);
        go('#/jobs');
        CF.ui.toast('Job cancelled', { undo: undoLast });
      });
    }
  }

  /* ---- Active cleaning -------------------------------------------------------- */

  function renderClean(id) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var job = CF.store.find('jobs', id);

    if (!job || job.deletedAt) {
      return U.empty({ title: 'That job is no longer here',
        action: { label: 'Back to Jobs', onClick: function () { go('#/jobs'); } } });
    }
    if (job.status === 'completed') { go('#/jobs/' + id); return el('div'); }

    var progress = Q.checklistProgress(job);
    var timerNode = el('div', {
      style: { fontSize: '22px', fontWeight: '800', color: 'var(--brand-text)',
               fontVariantNumeric: 'tabular-nums' },
      role: 'timer', 'aria-label': 'Time on this job'
    }, F.duration(CF.actions.elapsedSeconds(job)));

    startTimer(function () {
      var live = CF.store.find('jobs', id);
      if (!live) return stopTimer();
      timerNode.textContent = F.duration(CF.actions.elapsedSeconds(live));
    });

    var running = !!job.startedAt;

    return el('div.anim-fade-up', { style: { maxWidth: '520px' } }, [
      U.backLink('Back to job', function () { go('#/jobs/' + id); }),

      el('div.row.between.row-3.mb-4', [
        el('div', [
          el('h1', { style: { fontSize: '19px', fontWeight: '800', margin: 0 } },
            Q.clientName(job.clientId, job.clientName)),
          el('div', { style: { fontSize: '13px', color: 'var(--text-muted)' } },
            Q.serviceName(job.serviceId, job.serviceName))
        ]),
        el('div.row.row-3', [
          timerNode,
          el('button.iconbtn', {
            type: 'button',
            'aria-label': running ? 'Pause timer' : 'Resume timer',
            onclick: function () {
              if (running) CF.actions.pauseJob(id); else CF.actions.resumeJob(id);
              CF.shell.repaint();
            }
          }, running ? '⏸' : '▶')
        ])
      ]),

      // A timer left running overnight would otherwise be recorded as the real
      // duration of the clean and quietly wreck every hourly figure after it.
      CF.actions.timerLooksForgotten(job) ? el('div.callout.callout--warn.mb-4', [
        el('strong', 'That timer has been running a long time. '),
        'It looks like it was left on. ',
        el('button.linkbtn', {
          type: 'button',
          onclick: function () {
            CF.ui.confirm({
              title: 'Reset the timer for this clean?',
              message: 'The recorded time goes back to zero. Nothing else about ' +
                       'the job changes.',
              confirmLabel: 'Reset Timer'
            }).then(function (ok) {
              if (!ok) return;
              CF.store.update('jobs', id, { elapsedSeconds: 0, startedAt: null },
                'Reset timer');
              CF.ui.toast('Timer reset', {
                undo: function () { CF.store.undo(); CF.shell.repaint(); }
              });
              CF.shell.repaint();
            });
          }
        }, 'Reset it')
      ]) : null,

      U.accessNote(job.notes) ? el('div.mb-4', U.accessNote(job.notes)) : null,

      el('div.card', { style: { padding: '20px 20px 8px' } }, [
        el('div.row.between.mb-3', { style: { alignItems: 'baseline' } }, [
          el('div', { style: { fontSize: '14px', fontWeight: '700', color: 'var(--text-2)' } },
            progress.done + '/' + progress.total + ' Complete'),
          el('div', { style: { fontSize: '14px', fontWeight: '800', color: 'var(--brand-text)' } },
            progress.percent + '%')
        ]),
        el('div.mb-5', U.progress(progress.percent)),
        el('div.stack', (Array.isArray(job.checklist) ? job.checklist : []).map(function (item) {
          return el('button.checklist__item', {
            type: 'button',
            'aria-pressed': item.done ? 'true' : 'false',
            onclick: function () {
              // Refused once the job is closed; don't repaint over the reason.
              if (!CF.actions.toggleChecklistItem(job.id, item.id)) return;
              CF.shell.repaint();
            }
          }, [
            el('span.checklist__box', { 'aria-hidden': 'true' }, item.done ? '✓' : ''),
            el('span.checklist__label', item.label)
          ]);
        }))
      ]),

      el('div.center.mt-3', [
        el('button.linkbtn', {
          type: 'button',
          style: { textDecoration: 'none' },
          onclick: function () { go('#/jobs/' + id); }
        }, '+ Add Charge')
      ]),

      el('button.btn.btn--primary.btn--block.btn--xl.mt-2', {
        type: 'button',
        disabled: !progress.complete,
        'aria-disabled': progress.complete ? 'false' : 'true',
        title: progress.complete ? '' : 'Finish every checklist item first',
        onclick: complete
      }, 'COMPLETE JOB → CREATE INVOICE'),

      !progress.complete ? el('p.meta.center.mt-2',
        F.plural(progress.total - progress.done, 'item') + ' left before you can close this job.') : null
    ]);

    function complete() {
      if (!progress.complete) {
        CF.ui.toast('Finish all checklist items first');
        return;
      }
      stopTimer();
      var result = CF.actions.completeJob(job.id);
      if (!result) return;          // the write was refused; the toast explains why
      CF.shell.setFlash({
        kind: 'job-complete',
        jobId: job.id,
        invoiceId: result.invoice ? result.invoice.id : null,
        nextJobId: result.nextJob ? result.nextJob.id : null
      });
      go('#/jobs/' + job.id + '/done');
    }
  }

  /* ---- Completion screen ------------------------------------------------------- */

  function renderDone(id) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var job = CF.store.find('jobs', id);
    if (!job) { go('#/jobs'); return el('div'); }

    var flash = CF.shell.getFlash() || {};
    var invoice = job.invoiceId ? CF.store.find('invoices', job.invoiceId) : null;
    var nextJob = flash.nextJobId ? CF.store.find('jobs', flash.nextJobId) : null;
    var progress = Q.checklistProgress(job);

    return el('div.success.anim-pop', [
      el('div.success__mark', { 'aria-hidden': 'true' }, '✓'),
      el('h1.success__title', 'Cleaning Complete'),
      el('p.success__body', [
        progress.total + '/' + progress.total + ' tasks · ',
        el('strong', { style: { color: 'var(--text)' } },
          F.money(Q.jobTotal(job)) + ' to collect')
      ]),

      nextJob ? el('div.callout.callout--info.mt-5', { style: { textAlign: 'left' } },
        '🔁 Next visit for ' + Q.clientName(job.clientId, job.clientName) +
        ' is already booked for ' + F.relativeDate(nextJob.date) + '.') : null,

      invoice ? el('button.btn.btn--primary.btn--block.btn--lg.mt-6', {
        type: 'button', onclick: function () { go('#/money/invoice/' + invoice.id); }
      }, 'View Invoice #' + invoice.number) : null,

      el('button.btn.btn--secondary.btn--block.mt-3', {
        type: 'button', onclick: function () { go('#/jobs'); }
      }, 'Back to Jobs')
    ]);
  }

  /* ---- Book / edit form --------------------------------------------------------- */

  function renderForm(id, query) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var existing = id ? CF.store.find('jobs', id) : null;
    var isEdit = !!existing;
    var clients = Q.activeClients();
    var services = Q.activeServices();

    if (!clients.length && !isEdit) {
      return U.empty({
        title: 'Add a client first',
        body: 'Jobs belong to a client, so CleanFlow can reuse their address and access notes.',
        action: { label: '+ Add a Client', onClick: function () { go('#/clients/new'); } }
      });
    }

    var preselect = (query && query.client) || null;
    var draft = Object.assign({
      clientId: preselect || (clients[0] || {}).id || null,
      serviceId: (services[0] || {}).id || null,
      date: F.today(), time: '09:00',
      price: (services[0] || {}).basePrice || 0,
      address: '', notes: '',
      frequency: 'one-time', until: ''
    }, existing ? {
      clientId: existing.clientId, serviceId: existing.serviceId,
      date: existing.date, time: existing.time, price: existing.price,
      address: existing.address, notes: existing.notes,
      frequency: (existing.recurrence && existing.recurrence.frequency) || 'one-time',
      until: (existing.recurrence && existing.recurrence.until) || ''
    } : {});

    if (!isEdit && draft.clientId) applyClientDefaults(draft.clientId, true);

    var priceField, addressField, notesField;

    var body = el('div.stack.stack-5');

    function build() {
      CF.dom.clear(body);

      var clientField = U.field({
        label: 'Client', type: 'select', value: draft.clientId, required: true,
        options: clients.map(function (c) { return { value: c.id, label: c.name }; }),
        onChange: function (v) { draft.clientId = v; applyClientDefaults(v); build(); }
      });

      var serviceField = U.field({
        label: 'Service', type: 'select', value: draft.serviceId, required: true,
        options: services.map(function (s) {
          return { value: s.id, label: s.name + ' — ' + F.money(s.basePrice) };
        }),
        onChange: function (v) {
          draft.serviceId = v;
          var svc = CF.store.find('services', v);
          if (svc && !isEdit) draft.price = svc.basePrice;
          build();
        }
      });

      priceField = U.field({
        label: 'Price', type: 'number', value: draft.price, inputmode: 'decimal',
        prefix: CF.store.get().settings.currencySymbol,
        hint: 'Starts from the service base price — change it for this job only.',
        onInput: function (v) { draft.price = v; }
      });

      addressField = U.field({
        label: 'Address', value: draft.address,
        placeholder: 'Where is this clean?',
        onInput: function (v) { draft.address = v; }
      });

      notesField = U.field({
        label: 'Access, pets & parking', value: draft.notes, multiline: true, rows: 3,
        hint: 'Pre-filled from the client. Anything you add here shows on the job card.',
        onInput: function (v) { draft.notes = v; }
      });

      body.appendChild(el('div.card.card--roomy.stack.stack-4', [
        clientField.node,
        serviceField.node,
        el('div.grid.grid-2', [
          U.field({ label: 'Date', type: 'date', value: draft.date, required: true,
            min: '2000-01-01', max: '2100-12-31',
            onChange: function (v) { draft.date = v; build(); } }).node,
          U.field({ label: 'Start time', type: 'time', value: draft.time,
            onChange: function (v) { draft.time = v; build(); } }).node
        ]),
        priceField.node,
        U.field({ label: 'Repeats', type: 'select', value: draft.frequency,
          hint: 'On a repeating job, finishing one visit books the next automatically.',
          options: CF.schema.FREQUENCIES.map(function (f) { return { value: f.id, label: f.label }; }),
          onChange: function (v) { draft.frequency = v; build(); } }).node,

        // Without a last date the only way to stop a repeat is to remember to
        // end it by hand — easy to forget on a contract with a known end.
        draft.frequency !== 'one-time'
          ? U.field({ label: 'Repeat until (optional)', type: 'date', value: draft.until,
              hint: 'Leave blank to keep repeating. The last visit booked will be on or before this date.',
              onChange: function (v) { draft.until = v; } }).node
          : null
      ].filter(Boolean)));

      var clash = Q.conflictsFor({
        date: draft.date, time: draft.time,
        minutes: Q.jobMinutes({ serviceId: draft.serviceId }),
        excludeId: id || null
      });
      if (clash.length) {
        body.appendChild(el('div.callout.callout--warn', [
          el('strong', '⚠ That overlaps ' + F.plural(clash.length, 'job') + ' already booked. '),
          clash.slice(0, 3).map(function (j) {
            return el('div.meta', F.clockTime(j.time) + ' · ' +
              Q.clientName(j.clientId, j.clientName) + ' · ' +
              F.hoursLabel(Q.jobMinutes(j)));
          }),
          el('div.meta', { style: { marginTop: '6px' } },
            'You can still book it — CleanFlow will not stop you.')
        ]));
      }

      body.appendChild(el('div.card.card--roomy.stack.stack-4', [
        addressField.node,
        notesField.node
      ]));

      body.appendChild(el('div.row.row-3.row-wrap', [
        el('button.btn.btn--primary.btn--lg', { type: 'button', onclick: save },
          isEdit ? 'Save Changes' : 'Book Job'),
        el('button.btn.btn--secondary.btn--lg', {
          type: 'button', onclick: function () { go(isEdit ? '#/jobs/' + id : '#/jobs'); }
        }, 'Cancel')
      ]));
    }

    function applyClientDefaults(clientId, initial) {
      var c = CF.store.find('clients', clientId);
      if (!c) return;
      draft.address = c.address || '';
      draft.notes = [c.access, c.pets, c.preferences].filter(Boolean).join(' ');
      if (initial || !isEdit) {
        if (c.preferredServiceId) draft.serviceId = c.preferredServiceId;
        var svc = CF.store.find('services', draft.serviceId);
        if (svc) draft.price = svc.basePrice;
        if (c.frequency) draft.frequency = c.frequency;
      }
    }

    function save() {
      if (!draft.clientId) { CF.ui.toast('Pick a client first', { tone: 'bad' }); return; }

      var when = F.fromKey(draft.date);
      if (!when || isNaN(when.getTime()) ||
          when.getFullYear() < 2000 || when.getFullYear() > 2100) {
        CF.ui.toast('That date does not look right — check the year', { tone: 'bad' });
        return;
      }
      if (draft.until && draft.until < draft.date) {
        CF.ui.toast('The repeat end date is before the first visit', { tone: 'bad' });
        return;
      }

      var payload = {
        clientId: draft.clientId,
        clientName: Q.clientName(draft.clientId),
        serviceId: draft.serviceId,
        serviceName: Q.serviceName(draft.serviceId),
        date: draft.date, time: draft.time,
        price: Number(draft.price) || 0,
        address: draft.address, notes: draft.notes,
        recurrence: {
          frequency: draft.frequency, endedAt: null,
          until: draft.frequency === 'one-time' ? null : (draft.until || null),
          anchorDay: (F.fromKey(draft.date) || new Date()).getDate()
        }
      };

      if (isEdit) {
        // Swapping service mid-job would silently discard ticked items.
        if (draft.serviceId !== existing.serviceId &&
            Q.checklistProgress(existing).done === 0) {
          payload.checklist = CF.actions.checklistFor(draft.serviceId);
        }
        CF.store.update('jobs', id, payload, 'Edit job');
        CF.ui.toast('Job updated');
        go('#/jobs/' + id);
      } else {
        var job = CF.actions.bookJob(payload);
        CF.ui.toast('Job booked for ' + F.relativeDate(job.date), { undo: undoLast });
        go('#/jobs/' + job.id);
      }
    }

    build();

    return el('div.anim-fade-up', { style: { maxWidth: '640px' } }, [
      U.backLink(isEdit ? 'Back to job' : 'Back to Jobs',
        function () { go(isEdit ? '#/jobs/' + id : '#/jobs'); }),
      el('h1.h-page.mb-5', isEdit ? 'Edit job' : 'Book a job'),
      body
    ]);
  }

  /* ---- Timer plumbing ------------------------------------------------------------ */

  function startTimer(tick) {
    stopTimer();
    timerHandle = setInterval(tick, 1000);
  }
  function stopTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  CF.views = CF.views || {};
  CF.views.jobs = {
    renderList: renderList,
    renderDetail: renderDetail,
    renderClean: renderClean,
    renderDone: renderDone,
    renderForm: renderForm,
    stopTimer: stopTimer
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/money.js */
/* ==========================================================================
   💰 MONEY — pricing, quotes, invoices, expenses, profit

   Enough to know whether the month is working. Deliberately not accounting
   software: no ledgers, no reconciliation, no chart of accounts.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  var tab = 'overview';
  // Reset whenever the tab changes, so asking for every invoice does not also
  // draw every expense. See ui.cappedList for why long lists wait behind a tap.
  var showAll = false;
  var monthOffset = 0;

  /* ---- Overview -------------------------------------------------------------- */

  function renderOverview() {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var month = Q.monthBounds(monthOffset);
    var sum = Q.summary(month.from, month.to);

    var page = el('div.anim-fade-up', [
      U.pageHeader({
        title: 'Money',
        actions: [el('button.btn.btn--primary', {
          type: 'button', onclick: function () { go('#/money/quote'); }
        }, 'Create Quote')]
      }),

      el('div.row.between.row-3.mb-4', [
        el('div.row.row-2', [
          el('button.iconbtn', {
            type: 'button', 'aria-label': 'Previous month',
            onclick: function () { monthOffset--; CF.shell.repaint(); }
          }, '‹'),
          el('div', { style: { fontWeight: '700', minWidth: '150px', textAlign: 'center' } },
            month.label),
          el('button.iconbtn', {
            type: 'button', 'aria-label': 'Next month',
            disabled: monthOffset >= 0,
            onclick: function () { if (monthOffset < 0) { monthOffset++; CF.shell.repaint(); } }
          }, '›')
        ]),
        monthOffset !== 0 ? el('button.linkbtn', {
          type: 'button', onclick: function () { monthOffset = 0; CF.shell.repaint(); }
        }, 'This month') : null
      ]),

      el('div.grid.grid-3.mb-5', [
        U.stat({ label: 'Revenue', value: F.money(sum.revenue),
                 note: sum.taxCollected > 0
                   ? F.plural(sum.jobsCompleted, 'job') + ' completed · after ' +
                     (CF.store.get().settings.taxLabel || 'tax')
                   : F.plural(sum.jobsCompleted, 'job') + ' completed' }),
        U.stat({ tone: 'ok', label: 'Estimated Profit', value: F.money(sum.profit),
                 note: 'Revenue minus expenses — a rough guide, not accounting-grade.' }),
        U.stat({ tone: 'warn', label: 'Waiting to Collect', value: F.money(sum.outstanding),
                 // This total sums every open invoice, so one that disagrees
                 // with its own lines is inside the figure. It sits above all
                 // four tabs, which is why the Money screen showed a disputed
                 // amount as settled fact on every one of them.
                 note: F.plural(Q.openInvoices().length, 'open invoice') +
                   (function () {
                     var off = Q.openInvoices().filter(function (i) {
                       return Q.invoiceInconsistent(i);
                     }).length;
                     return off
                       ? ' · ' + F.plural(off, 'invoice') + ' does not add up'
                       : '';
                   })() })
      ]),

      U.tabs({
        label: 'Money views', value: tab,
        onChange: function (v) { tab = v; showAll = false; CF.shell.repaint(); },
        options: [
          { value: 'overview', label: 'Overview' },
          { value: 'quotes',   label: 'Quotes',   count: Q.quotes().length },
          { value: 'invoices', label: 'Invoices', count: Q.invoices().length },
          { value: 'expenses', label: 'Expenses', count: Q.expenses().length }
        ]
      })
    ]);

    page.appendChild(({
      overview: overviewTab,
      quotes:   quotesTab,
      invoices: invoicesTab,
      expenses: expensesTab
    })[tab](month, sum));

    return page;
  }

  function overviewTab(month, sum) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var overdue = Q.overdueInvoices();
    var stale = Q.staleQuotes();

    var attention = []
      .concat(overdue.slice(0, 4).map(function (inv) {
        return {
          title: Q.clientName(inv.clientId, inv.clientName) + ' — overdue invoice',
          sub: F.money(Q.invoiceRemaining(inv)) + ' · due ' + F.agoPhrase(inv.dueDate),
          cta: 'View', route: '#/money/invoice/' + inv.id
        };
      }))
      .concat(stale.slice(0, 3).map(function (q) {
        return {
          title: (q.clientName || Q.clientName(q.clientId)) + ' — quote follow-up',
          sub: F.money(q.price) + ' · sent ' + F.agoPhrase(q.sentDate || q.date),
          cta: 'Follow Up', route: '#/grow'
        };
      }));

    var payments = Q.paymentsIn(month.from, month.to);
    var spend = Q.expenses().filter(function (e) {
      return e.date >= month.from && e.date <= month.to;
    });

    var transactions = payments.map(function (p) {
      return { icon: '💵', label: 'Payment — ' + Q.clientName(p.clientId, p.clientName), date: p.date,
               amount: p.amount, tone: 'in' };
    }).concat(spend.map(function (e) {
      return { icon: '🧾', label: e.category + (e.note ? ' — ' + e.note : ''), date: e.date,
               amount: -e.amount, tone: 'out' };
    })).sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 12);

    return el('div', [
      el('h2.h-section.mb-3', 'Needs Attention'),
      attention.length
        ? el('div.list.mb-6', attention.map(function (a) {
            return el('div.attention__row', [
              el('div.grow', [
                el('div.listrow__title', a.title),
                el('div.listrow__sub', a.sub)
              ]),
              el('button.btn.btn--quiet.btn--sm', {
                type: 'button', onclick: function () { go(a.route); }
              }, a.cta)
            ]);
          }))
        : el('div.callout.callout--ok.mb-6', '✅ No overdue invoices or stale quotes.'),

      el('div.row.between.mb-3', [
        el('h2.h-section', 'Recent Transactions'),
        transactions.length ? el('button.linkbtn', {
          type: 'button', onclick: function () { CF.backup.exportCsv('payments'); }
        }, 'Export payments') : null
      ]),

      transactions.length
        ? el('div.list', transactions.map(function (t) {
            return el('div.listrow', [
              el('span', { 'aria-hidden': 'true' }, t.icon),
              el('div.grow', [
                el('div.listrow__title', t.label),
                el('div.meta', F.shortDate(t.date))
              ]),
              el('div.listrow__price', {
                style: { color: t.amount >= 0 ? 'var(--ok-text)' : 'var(--bad-text)' }
              }, F.money(t.amount, { signed: true }))
            ]);
          }))
        : U.emptySoft('Payments and expenses show up here once you start recording them.'),

      el('div.card.mt-6', [
        el('div.eyebrow.mb-3', month.label + ' summary'),
        el('div.deflist', [
          sum.taxCollected > 0 ? U.defRow('Collected from clients', F.money(sum.collected)) : null,
          sum.taxCollected > 0
            ? U.defRow((CF.store.get().settings.taxLabel || 'Tax') + ' collected (not yours)',
                       '−' + F.money(sum.taxCollected))
            : null,
          U.defRow('Your revenue', F.money(sum.revenue)),
          U.defRow('Expenses', F.money(sum.expenses)),
          U.defRow('Average job value', F.money(sum.averageJob)),
          U.defRow('Estimated profit', F.money(sum.profit), true),
          el('div.meta', { style: { marginTop: '4px' } },
            sum.margin + '% margin · ' + F.money(sum.outstanding) +
            ' still to collect (all time)')
        ].filter(Boolean))
      ])
    ]);
  }

  /* ---- Quotes tab ---------------------------------------------------------------- */

  function quotesTab() {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var rows = Q.quotes().slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    if (!rows.length) {
      return U.empty({
        small: true, title: 'No quotes yet',
        body: 'Quotes you build for leads and clients show up here.',
        action: { label: '+ Create Quote', onClick: function () { go('#/money/quote'); } }
      });
    }

    return el('div', [
      el('div.row.between.mb-3', [
        el('div.meta', F.plural(rows.length, 'quote')),
        el('button.linkbtn', { type: 'button',
          onclick: function () { CF.backup.exportCsv('quotes'); } }, 'Export CSV')
      ]),
      U.cappedList({ rows: rows, noun: 'quote', showAll: showAll,
        onShowAll: function () { showAll = true; CF.shell.repaint(); },
        row: function (q) {
          var st = CF.schema.QUOTE_STATUS.filter(function (s) { return s.id === q.status; })[0]
                   || { label: q.status, tone: 'neutral' };
          return el('button.listrow', {
            type: 'button', onclick: function () { go('#/money/quote/' + q.id); }
          }, [
            el('div.grow', [
              el('div.listrow__title', q.clientName || Q.clientName(q.clientId)),
              el('div.meta', '#' + q.number + ' · ' + F.shortDate(q.date) +
                (q.status === 'sent' ? ' · sent ' + F.agoPhrase(q.sentDate || q.date) : ''))
            ]),
            el('div.right', [
              el('div.listrow__price', F.money(q.price)),
              U.badge(st.label, st.tone)
            ])
          ]);
        } })
    ]);
  }

  /* ---- Invoices tab ---------------------------------------------------------------- */

  function invoicesTab() {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var rows = Q.invoices().slice().sort(function (a, b) {
      return a.issueDate < b.issueDate ? 1 : -1;
    });

    if (!rows.length) {
      return U.empty({
        small: true, title: 'No invoices yet',
        body: 'Complete a job and CleanFlow raises its invoice for you.'
      });
    }

    return el('div', [
      el('div.row.between.mb-3', [
        el('div.meta', F.money(Q.outstandingTotal()) + ' outstanding across ' +
          F.plural(Q.openInvoices().length, 'invoice')),
        el('button.linkbtn', { type: 'button',
          onclick: function () { CF.backup.exportCsv('invoices'); } }, 'Export CSV')
      ]),
      U.cappedList({ rows: rows, noun: 'invoice', showAll: showAll,
        onShowAll: function () { showAll = true; CF.shell.repaint(); },
        row: function (inv) {
          var st = Q.invoiceStatus(inv);
          return el('button.listrow', {
            type: 'button', onclick: function () { go('#/money/invoice/' + inv.id); }
          }, [
            el('div.grow', [
              el('div.listrow__title', Q.clientName(inv.clientId, inv.clientName)),
              el('div.meta', '#' + inv.number + ' · ' + F.shortDate(inv.issueDate) +
                (st.id === 'overdue' ? ' · ' + F.plural(st.daysLate, 'day') + ' late' : '') +
                // This row prints inv.total, which is exactly the figure an
                // inconsistent invoice disagrees with itself about. Every other
                // screen showing it says so; a list is no less a place to be told.
                (Q.invoiceInconsistent(inv) ? ' · does not add up' : ''))
            ]),
            el('div.right', [
              el('div.listrow__price', F.money(inv.total)),
              U.badge(st.label, st.tone)
            ])
          ]);
        } })
    ]);
  }

  /* ---- Expenses tab ------------------------------------------------------------------ */

  function expensesTab(month) {
    var U = CF.ui, F = CF.fmt, Q = CF.q;
    var rows = Q.expenses().slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var byCategory = {};
    rows.filter(function (e) { return e.date >= month.from && e.date <= month.to; })
        .forEach(function (e) {
          byCategory[e.category] = (byCategory[e.category] || 0) + (Number(e.amount) || 0);
        });
    var categories = Object.keys(byCategory).sort(function (a, b) {
      return byCategory[b] - byCategory[a];
    });

    return el('div', [
      el('div.row.between.row-3.mb-4', [
        el('div.meta', rows.length ? F.plural(rows.length, 'expense') + ' recorded' : ''),
        el('div.row.row-2', [
          rows.length ? el('button.linkbtn', { type: 'button',
            onclick: function () { CF.backup.exportCsv('expenses'); } }, 'Export CSV') : null,
          el('button.btn.btn--primary.btn--sm', {
            type: 'button', onclick: function () { expenseModal(); }
          }, '+ Add Expense')
        ])
      ]),

      categories.length ? el('div.card.mb-4', [
        el('div.eyebrow.mb-3', month.label + ' by category'),
        el('div.deflist', categories.map(function (c) {
          return U.defRow(c, F.money(byCategory[c]));
        }))
      ]) : null,

      rows.length
        ? U.cappedList({ rows: rows, noun: 'expense', showAll: showAll,
            onShowAll: function () { showAll = true; CF.shell.repaint(); },
            row: function (e) {
              return el('div.listrow', [
                el('div.grow', [
                  el('div.listrow__title', e.category),
                  el('div.meta', F.shortDate(e.date) + (e.note ? ' · ' + e.note : ''))
                ]),
                el('div.listrow__price', F.money(e.amount)),
                el('button.iconbtn', {
                  type: 'button', 'aria-label': 'Delete expense',
                  onclick: function () { deleteExpense(e); }
                }, '✕')
              ]);
            } })
        : el('div.empty--soft', { style: { textAlign: 'center', padding: '36px 24px' } },
            'Log gas, supplies and other costs here — it takes seconds and makes your profit number real.')
    ]);

    function deleteExpense(e) {
      CF.ui.confirm({
        title: 'Delete this expense?',
        message: F.money(e.amount) + ' — ' + e.category + ' on ' + F.shortDate(e.date) + '.',
        confirmLabel: 'Delete', danger: true
      }).then(function (ok) {
        if (!ok) return;
        CF.store.remove('expenses', e.id, 'Delete expense');
        CF.ui.toast('Expense deleted', {
          undo: function () { CF.store.undo(); CF.shell.repaint(); }
        });
      });
    }
  }

  /* ---- Quick expense modal -------------------------------------------------------------- */

  function expenseModal() {
    var U = CF.ui, F = CF.fmt;
    var draft = { amount: '', category: 'Supplies', note: '', date: F.today() };
    var amountField;

    CF.ui.modal({
      title: 'New expense',
      body: function () {
        amountField = U.field({
          label: 'Amount', type: 'number', inputmode: 'decimal', autofocus: true,
          prefix: CF.store.get().settings.currencySymbol,
          onInput: function (v) { draft.amount = v; amountField.setError(''); }
        });

        var catHost = el('div.row.row-2.row-wrap');
        function paintCats() {
          CF.dom.clear(catHost);
          CF.schema.EXPENSE_CATEGORIES.forEach(function (c) {
            catHost.appendChild(el('button.seg__item', {
              type: 'button',
              'aria-pressed': draft.category === c ? 'true' : 'false',
              onclick: function () { draft.category = c; paintCats(); }
            }, c));
          });
        }
        paintCats();

        return el('div.stack.stack-4', [
          amountField.node,
          el('div.field', [el('div.field__label', 'Category'), catHost]),
          U.field({ label: 'Date', type: 'date', value: draft.date,
            onChange: function (v) { draft.date = v; } }).node,
          U.field({ label: 'Note (optional)', placeholder: 'e.g. Restock at the supply shop',
            onInput: function (v) { draft.note = v; } }).node
        ]);
      },
      actions: function (close) {
        return [
          el('button.btn.btn--secondary', { type: 'button', onclick: function () { close(); } }, 'Cancel'),
          el('button.btn.btn--primary', {
            type: 'button',
            onclick: function () {
              var value = Number(draft.amount);
              if (!value || value <= 0) {
                amountField.setError('Enter an amount above zero.');
                amountField.input.focus();
                return;
              }
              // The domain layer validates the date and category too, so it can
              // still refuse. Closing regardless would toast "Expense saved"
              // and offer an Undo that took back the previous action instead.
              if (!CF.actions.addExpense({
                amount: value, category: draft.category,
                note: draft.note, date: draft.date
              })) return;
              close();
              CF.ui.toast('Expense saved', {
                undo: function () { CF.store.undo(); CF.shell.repaint(); }
              });
              CF.shell.repaint();
            }
          }, 'Save Expense')
        ];
      }
    });
  }

  /* ---- Invoice detail --------------------------------------------------------------------- */

  function renderInvoice(id) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var inv = CF.store.find('invoices', id);
    if (!inv || inv.deletedAt) {
      return U.empty({ title: 'That invoice is no longer here',
        action: { label: 'Back to Money', onClick: function () { go('#/money'); } } });
    }

    var biz = CF.store.get().business;
    var st = Q.invoiceStatus(inv);
    var received = Q.invoiceReceived(inv);
    var remaining = Q.invoiceRemaining(inv);
    var over = Q.invoiceOverpaid(inv);

    return el('div.anim-fade-up', { style: { maxWidth: '600px' } }, [
      el('div.no-print', [U.backLink('Back to Money', function () { go('#/money'); })]),

      el('div.card.card--roomy.paper', [
        el('div.row.between.row-4.row-wrap', [
          el('div', [
            el('div.eyebrow', 'Invoice #' + inv.number),
            el('h1.h-card', { style: { marginTop: '6px' } },
              Q.clientName(inv.clientId, inv.clientName))
          ]),
          U.badge(st.label, st.tone, true)
        ]),

        biz.name ? el('div.meta.mt-2', biz.name +
          (biz.phone ? ' · ' + biz.phone : '') +
          (biz.email ? ' · ' + biz.email : '')) : null,

        el('div.row.row-5.row-wrap.mt-4', [
          el('div', [el('div.doc__label', 'Issued'), el('div', F.shortDate(inv.issueDate))]),
          el('div', [el('div.doc__label', 'Due'), el('div', F.shortDate(inv.dueDate))])
        ]),

        el('div', {
          style: { marginTop: '22px', padding: '16px 0',
                   borderTop: '1px solid var(--border-soft)',
                   borderBottom: '1px solid var(--border-soft)' }
        }, el('div.stack.stack-3', (inv.lines || []).map(function (l) {
          return el('div.lineitem', [
            el('span.lineitem__name', l.label),
            el('span.lineitem__amt', F.money(l.amount))
          ]);
        }))),

        el('div.deflist.mt-4', [
          inv.tax ? U.defRow('Subtotal', F.money(inv.subtotal)) : null,
          // The rate is named because it can legitimately differ from Settings:
          // an invoice raised against an accepted quote is billed at the rate
          // agreed then, so without this the figure looks like a mistake.
          inv.tax ? U.defRow(
            (CF.store.get().settings.taxLabel || 'Tax') +
              (isFinite(Number(inv.taxRate)) && Number(inv.taxRate) > 0
                ? ' at ' + Number(inv.taxRate) + '%' : ''),
            F.money(inv.tax)) : null,
          U.defRow('Invoice total', F.money(inv.total)),
          U.defRow('Received', F.money(received)),
          over > 0 ? U.defRow('Overpaid', F.money(over), true) : null,
          over > 0 ? null : U.defRow('Remaining', F.money(remaining), true)
        ].filter(Boolean)),

        over > 0 ? el('div.callout.callout--warn.mt-3',
          'This invoice has been paid ' + F.money(over) + ' more than its total. ' +
          'Remove or correct a payment below, or refund the difference.') : null,

        // A restored file can arrive self-contradictory. CleanFlow will not
        // quietly rewrite a billed figure, so it points at the disagreement
        // instead and leaves the decision where it belongs.
        (function () {
          var off = Q.invoiceInconsistent(inv);
          if (!off) return null;
          return el('div.callout.callout--warn.mt-3', [
            el('div', { style: { fontWeight: '700' } }, 'This invoice does not add up'),
            el('div.mt-1', 'Its lines come to ' + F.money(off.lines) +
              (off.tax > 0 ? ' plus ' + F.money(off.tax) + ' ' +
                (CF.store.get().settings.taxLabel || 'tax') : '') +
              ', but the total recorded on it is ' + F.money(off.total) + '.'),
            el('div.mt-1', 'The figure you were billed has been left exactly as it ' +
              'was — nothing has been changed. This usually means the file was ' +
              'edited outside CleanFlow. Check it against your own copy of the ' +
              'invoice before chasing the balance.')
          ]);
        })(),

        (inv.payments || []).length ? el('div.mt-4', [
          el('div.eyebrow.mb-2', 'Payments'),
          el('div.stack.stack-2', inv.payments.map(function (p) {
            return el('div.row.between', [
              el('span.meta', F.shortDate(p.date) + ' · ' + p.method),
              el('span.row.row-2', [
                el('strong', F.money(p.amount)),
                el('button.iconbtn.no-print', {
                  type: 'button', 'aria-label': 'Remove payment',
                  style: { width: '28px', height: '28px', fontSize: '13px' },
                  onclick: function () { removePayment(p); }
                }, '✕')
              ])
            ]);
          }))
        ]) : null,

        remaining <= 0
          ? el('div.callout.callout--ok.mt-5.center', '✓ Paid in full')
          : el('button.btn.btn--primary.btn--block.btn--lg.mt-5.no-print', {
              type: 'button', onclick: paymentModal
            }, 'Record Payment'),

        el('div.row.row-3.mt-4.no-print', { style: { justifyContent: 'center' } }, [
          el('button.linkbtn', { type: 'button', onclick: function () { window.print(); } },
            'Print / Save PDF'),
          remaining > 0 ? el('button.linkbtn', {
            type: 'button', onclick: copyReminder
          }, 'Copy payment reminder') : null
        ])
      ])
    ]);

    function paymentModal() {
      var amount = String(remaining);
      var method = 'Cash';
      var amountField;

      CF.ui.modal({
        size: 'sm', title: 'Record payment',
        sub: Q.clientName(inv.clientId, inv.clientName) + ' · ' + F.money(remaining) + ' remaining',
        body: function () {
          amountField = U.field({
            label: 'Amount received', type: 'number', inputmode: 'decimal',
            value: amount, autofocus: true,
            prefix: CF.store.get().settings.currencySymbol,
            onInput: function (v) { amount = v; amountField.setError(''); }
          });
          return el('div.stack.stack-4', [
            amountField.node,
            U.field({ label: 'Method', type: 'select', value: method,
              options: CF.schema.PAYMENT_METHODS.map(function (m) { return { value: m, label: m }; }),
              onChange: function (v) { method = v; } }).node
          ]);
        },
        actions: function (close) {
          return [
            el('button.btn.btn--secondary', { type: 'button', onclick: function () { close(); } }, 'Cancel'),
            el('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                var value = Number(amount);
                if (!value || value <= 0) {
                  amountField.setError('Enter an amount above zero.');
                  return;
                }
                if (value > remaining + 0.001) {
                  amountField.setError('That is more than the ' + F.money(remaining) + ' outstanding.');
                  return;
                }
                // The domain layer re-checks the balance against the invoice
                // as it stands now, so it can still refuse what this modal
                // thought was fine — a second tab, or a stale screen.
                if (!CF.actions.recordPayment(inv.id, value, method)) return;
                close();
                var nowPaid = Q.invoiceRemaining(CF.store.find('invoices', inv.id)) <= 0.001;
                if (nowPaid) {
                  CF.shell.setFlash({ kind: 'paid', invoiceId: inv.id, amount: value });
                  go('#/money/paid/' + inv.id);
                } else {
                  CF.ui.toast('Partial payment recorded');
                  CF.shell.repaint();
                }
              }
            }, 'Save Payment')
          ];
        }
      });
    }

    function removePayment(p) {
      CF.ui.confirm({
        title: 'Remove this payment?',
        message: F.money(p.amount) + ' recorded on ' + F.shortDate(p.date) +
                 ' will be removed and the invoice will show as owing again.',
        confirmLabel: 'Remove', danger: true
      }).then(function (ok) {
        if (!ok) return;
        CF.actions.removePayment(inv.id, p.id);
        CF.ui.toast('Payment removed', {
          undo: function () { CF.store.undo(); CF.shell.repaint(); }
        });
        CF.shell.repaint();
      });
    }

    function copyReminder() {
      var tpl = CF.store.find('templates', 'tpl-payment');
      CF.ui.copy(CF.actions.renderTemplate(tpl ? tpl.body : '', {
        client: (Q.clientName(inv.clientId, inv.clientName) || '').split(' ')[0],
        invoice: '#' + inv.number,
        amount: F.money(remaining)
      }), 'Payment reminder');
    }
  }

  /* ---- Payment success ------------------------------------------------------------------------ */

  function renderPaid(id) {
    var F = CF.fmt, Q = CF.q, go = CF.router.go;
    var inv = CF.store.find('invoices', id);
    var flash = CF.shell.getFlash() || {};
    if (!inv) { go('#/money'); return el('div'); }

    return el('div.success.anim-pop', [
      el('div.success__mark', { 'aria-hidden': 'true' }, '✓'),
      el('h1.success__title', 'Payment Recorded'),
      el('p.success__body', [
        el('strong', { style: { color: 'var(--text)' } }, F.money(flash.amount || inv.total)),
        ' received from ' + Q.clientName(inv.clientId, inv.clientName)
      ]),
      el('p.meta.mt-3', 'Invoice #' + inv.number + ' is paid in full.'),
      el('button.btn.btn--primary.btn--block.btn--lg.mt-6', {
        type: 'button', onclick: function () { go('#/grow'); }
      }, 'Ask for a review →'),
      el('button.btn.btn--secondary.btn--block.mt-3', {
        type: 'button', onclick: function () { go('#/money'); }
      }, 'Back to Money')
    ]);
  }

  CF.views = CF.views || {};
  CF.views.money = {
    renderOverview: renderOverview,
    renderInvoice: renderInvoice,
    renderPaid: renderPaid,
    expenseModal: expenseModal,
    setTab: function (t) { tab = t; }
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/quote.js */
/* ==========================================================================
   💰 SMART QUOTE — price the job with your reasoning visible

   The left pane collects what you know. The right pane shows one confident
   number, the working behind it, and whether the margin is worth the drive.
   The owner can always override — it is their business.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  /** A scope figure fit to print: never NaN, null or undefined. */
  function scopeNumber(value, fallback) {
    var n = Number(value);
    return isFinite(n) && n >= 0 ? Math.round(n) : fallback;
  }

  var draft = null;
  var showCalc = false;
  var editingPrice = false;
  // What the draft looked like the moment it was created, so leaving an
  // untouched calculator doesn't ask a pointless question.
  var pristine = null;

  /** Drop the working quote and its recovery copy together. */
  function discardDraft() {
    draft = null;
    pristine = null;
    if (CF.drafts) CF.drafts.clear('quote');
  }

  function reset(query) {
    var services = CF.q.activeServices();
    var preClient = query && query.client ? CF.store.find('clients', query.client) : null;

    // When a client is selected — explicitly or as the default — their
    // property is what we should be pricing, not a generic 1,800 sq ft house.
    var seedClient = preClient || CF.q.activeClients()[0] || null;

    draft = {
      mode: preClient ? 'existing' : (CF.q.activeClients().length ? 'existing' : 'new'),
      clientId: seedClient ? seedClient.id : null,
      leadName: '', leadPhone: '',
      serviceId: (seedClient && seedClient.preferredServiceId) || (services[0] || {}).id || null,
      sqft: (seedClient && seedClient.sqft) || 1800,
      beds: (seedClient && seedClient.beds) || 3,
      baths: (seedClient && seedClient.baths) || 2,
      condition: 'normal',
      addonIds: [],
      frequency: (seedClient && seedClient.frequency) || 'one-time',
      override: null,
      notes: ''
    };
    showCalc = false;
    editingPrice = false;
    pristine = JSON.stringify(draft);
  }

  /**
   * Has this quote had real work put into it?
   *
   * A draft recovered from a previous session counts by definition — it
   * survived a reload, so it is not something we should throw away quietly.
   */
  function quoteStarted() {
    if (!draft) return false;
    if (pristine === null) return true;
    return JSON.stringify(draft) !== pristine;
  }

  /* ---- Builder ------------------------------------------------------------------ */

  function render(query, quoteId) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;

    if (quoteId) {
      var existing = CF.store.find('quotes', quoteId);
      if (existing) return renderSaved(existing);
    }

    // A quote is several minutes of tapping before anything is saved. Losing it
    // to a refresh or a back-swipe used to mean starting the whole thing again,
    // so the working draft is picked back up here.
    //
    // Arriving with a client in the route ("Quote this client" from their page)
    // is an explicit request for a new quote about someone specific, so that
    // wins over a leftover draft — otherwise the wrong client's numbers would
    // be sitting on screen under their name.
    if (!draft && !(query && query.client)) {
      draft = CF.drafts.load('quote') || null;
      if (draft) pristine = null;      // recovered work; treat it as unsaved
    }
    if (!draft) reset(query);

    var services = Q.activeServices();
    var clients = Q.activeClients();
    var addons = CF.store.all('addons');

    var page = el('div.anim-fade-up', [
      U.backLink('Back to Money', function () { leave(go); }),
      el('h1.h-page.mb-5', 'Smart Quote Calculator')
    ]);

    var panelHost = el('div.quote__panel');
    var formHost = el('div.quote__form');

    page.appendChild(el('div.grid.grid-calc', [formHost, panelHost]));

    paint();
    return page;

    function paint() {
      remember();
      paintForm();
      paintPanel();
    }

    /** Keep the in-progress quote recoverable. Cleared the moment it is saved. */
    function remember() {
      if (draft) CF.drafts.save('quote', draft);
    }

    /**
     * Leaving by the back link abandons the quote, as it always has. It just
     * asks first now: a back-swipe is easy to do by accident on a phone, and
     * there is no saved quote to return to.
     */
    function leave(goTo) {
      if (!quoteStarted()) { discardDraft(); goTo('#/money'); return; }
      CF.ui.confirm({
        title: 'Leave without saving this quote?',
        message: 'Nothing has been saved yet, so this price and everything you ' +
                 'entered will be discarded. Save Quote first if you want to keep it.',
        confirmLabel: 'Discard It', cancelLabel: 'Keep Editing', danger: true
      }).then(function (ok) {
        if (!ok) return;
        discardDraft();
        goTo('#/money');
      });
    }

    function calc() {
      return CF.pricing.calculate({
        serviceId: draft.serviceId, sqft: draft.sqft,
        beds: draft.beds, baths: draft.baths,
        condition: draft.condition, addonIds: draft.addonIds,
        frequency: draft.frequency, override: draft.override
      });
    }

    /* ---- left: inputs ---- */
    function paintForm() {
      CF.dom.clear(formHost);

      if (clients.length) {
        formHost.appendChild(U.segmented({
          label: 'Who is this for',
          value: draft.mode, fill: true,
          options: [
            { value: 'existing', label: 'Existing Client' },
            { value: 'new', label: 'New Customer' }
          ],
          onChange: function (v) { draft.mode = v; paint(); }
        }));
      }

      if (draft.mode === 'existing' && clients.length) {
        formHost.appendChild(U.field({
          label: 'Client', type: 'select', value: draft.clientId,
          options: clients.map(function (c) { return { value: c.id, label: c.name }; }),
          onChange: function (v) {
            draft.clientId = v;
            var c = CF.store.find('clients', v);
            if (c) {
              if (c.sqft) draft.sqft = c.sqft;
              if (c.beds) draft.beds = c.beds;
              if (c.baths) draft.baths = c.baths;
              if (c.preferredServiceId) draft.serviceId = c.preferredServiceId;
              if (c.frequency) draft.frequency = c.frequency;
            }
            draft.override = null;
            paint();
          }
        }).node);
      } else {
        formHost.appendChild(el('div.stack.stack-3', [
          U.field({
            label: 'Customer name', value: draft.leadName, required: true,
            placeholder: 'e.g. Nina Alvarez',
            onInput: function (v) { draft.leadName = v; remember(); }
          }).node,
          U.field({
            label: 'Phone (optional)', value: draft.leadPhone, type: 'tel',
            placeholder: '(512) 555-0100',
            onInput: function (v) { draft.leadPhone = v; remember(); }
          }).node,
          el('p.meta', 'No full profile needed yet — CleanFlow creates one when they say yes.')
        ]));
      }

      formHost.appendChild(el('div.field', [
        el('div.field__label', 'Service type'),
        U.segmented({
          label: 'Service type', value: draft.serviceId, fill: true, outline: true,
          options: services.map(function (s) { return { value: s.id, label: s.name.replace(' Cleaning', '') }; }),
          onChange: function (v) { draft.serviceId = v; draft.override = null; paint(); }
        })
      ]));

      var sizeLabel = el('div.field__hint', formatSqft(draft.sqft));
      formHost.appendChild(el('div.field', [
        el('label.field__label', { for: 'quote-size' }, 'Property size'),
        el('input.range#quote-size', {
          type: 'range', min: 400, max: 6000, step: 100, value: draft.sqft,
          'aria-valuetext': formatSqft(draft.sqft),
          oninput: function (e) {
            draft.sqft = Number(e.target.value);
            draft.override = null;
            remember();
            sizeLabel.textContent = formatSqft(draft.sqft);
            paintPanel();
          }
        }),
        sizeLabel
      ]));

      formHost.appendChild(el('div.grid.grid-2', [
        counter('Bedrooms', draft.beds, 0, 8, function (v) { draft.beds = v; draft.override = null; paint(); }),
        counter('Bathrooms', draft.baths, 0, 8, function (v) { draft.baths = v; draft.override = null; paint(); })
      ]));

      formHost.appendChild(el('div.field', [
        el('div.field__label', 'Condition'),
        U.segmented({
          label: 'Condition', value: draft.condition, fill: true,
          options: CF.schema.CONDITIONS.map(function (c) { return { value: c.id, label: c.label }; }),
          onChange: function (v) { draft.condition = v; draft.override = null; paint(); }
        }),
        el('div.field__hint', ({
          light:  'Well-kept, cleaned recently.',
          normal: 'Typical lived-in home.',
          heavy:  'Neglected, post-build or post-party — expect extra time.'
        })[draft.condition])
      ]));

      formHost.appendChild(el('div.field', [
        el('div.field__label', 'Add-ons'),
        el('div.stack.stack-2', addons.map(function (a) {
          return U.checkRow({
            label: a.name,
            meta: '+' + F.money(a.price),
            checked: draft.addonIds.indexOf(a.id) !== -1,
            onToggle: function () {
              var i = draft.addonIds.indexOf(a.id);
              if (i === -1) draft.addonIds.push(a.id);
              else draft.addonIds.splice(i, 1);
              draft.override = null;
              paint();
            }
          });
        }))
      ]));

      formHost.appendChild(U.field({
        label: 'How often?', type: 'select', value: draft.frequency,
        hint: 'Weekly and bi-weekly work gets an automatic loyalty discount.',
        options: CF.schema.FREQUENCIES.map(function (f) { return { value: f.id, label: f.label }; }),
        onChange: function (v) { draft.frequency = v; draft.override = null; paint(); }
      }).node);
    }

    function counter(label, value, min, max, onChange) {
      return el('div.field', [
        el('div.field__label', label),
        el('div.row.row-2', [
          el('button.btn.btn--secondary', {
            type: 'button', 'aria-label': 'Fewer ' + label.toLowerCase(),
            style: { minWidth: '44px', padding: '0' },
            disabled: value <= min,
            onclick: function () { if (value > min) onChange(value - 1); }
          }, '−'),
          el('div', {
            style: { flex: '1', textAlign: 'center', fontWeight: '800', fontSize: '16px' },
            'aria-live': 'polite'
          }, String(value)),
          el('button.btn.btn--secondary', {
            type: 'button', 'aria-label': 'More ' + label.toLowerCase(),
            style: { minWidth: '44px', padding: '0' },
            disabled: value >= max,
            onclick: function () { if (value < max) onChange(value + 1); }
          }, '+')
        ])
      ]);
    }

    /* ---- right: the number ---- */
    function paintPanel() {
      var c = calc();
      var verdict = CF.pricing.marginVerdict(c.margin);
      CF.dom.clear(panelHost);

      var priceNode;
      if (editingPrice) {
        var input = el('input.quote__price-input', {
          type: 'number', value: c.price, autofocus: true, inputmode: 'decimal',
          'aria-label': 'Quote price',
          onblur: function (e) {
            draft.override = e.target.value === '' ? null : Number(e.target.value);
            remember();
            editingPrice = false;
            paintPanel();
          },
          onkeydown: function (e) { if (e.key === 'Enter') e.target.blur(); }
        });
        priceNode = el('div.row.row-2', {
          style: { justifyContent: 'center', marginTop: '10px' }
        }, [
          el('span', { style: { fontSize: '56px', fontWeight: '800' } },
            CF.store.get().settings.currencySymbol),
          input
        ]);
      } else {
        priceNode = el('button.quote__price', {
          type: 'button',
          'aria-label': 'Quote price ' + F.money(c.price) + '. Activate to edit.',
          onclick: function () { editingPrice = true; paintPanel(); }
        }, [
          F.money(c.price),
          el('span.quote__price-edit', { 'aria-hidden': 'true' }, '✎ edit')
        ]);
      }

      panelHost.appendChild(el('div.ink.ink--quote', [
        el('div.quote__eyebrow', 'Your Suggested Price'),
        el('div.quote__basis', c.overridden
          ? 'Manually set · suggested was ' + F.money(c.suggested)
          : 'Based on your pricing settings'),

        priceNode,

        // The owner quotes a pre-tax figure but bills the total; say so here so
        // the two numbers are never a surprise to either side.
        c.tax > 0 ? el('div.quote__basis', { style: { marginTop: '2px' } },
          '+ ' + F.money(c.tax) + ' ' + taxWord() + ' · client pays ' + F.money(c.total)) : null,

        el('div', { style: { marginTop: '4px' } }, [
          el('button.linkbtn.linkbtn--on-ink', {
            type: 'button',
            'aria-expanded': showCalc ? 'true' : 'false',
            onclick: function () { showCalc = !showCalc; paintPanel(); }
          }, showCalc ? 'Hide calculation' : 'See calculation')
        ]),

        showCalc ? el('div.quote__calc', [
          calcRow('Base (' + c.serviceName + ')', F.money(c.base)),
          c.sizeAdjust ? calcRow('Size adjustment', '+' + F.money(c.sizeAdjust)) : null,
          c.roomAdjust ? calcRow('Rooms adjustment',
            (c.roomAdjust > 0 ? '+' : '') + F.money(c.roomAdjust)) : null,
          c.conditionAdjust ? calcRow('Condition (' + c.conditionLabel + ')',
            (c.conditionAdjust > 0 ? '+' : '') + F.money(c.conditionAdjust)) : null,
          c.addonTotal ? calcRow('Add-ons', '+' + F.money(c.addonTotal)) : null,
          c.freqDiscount ? calcRow('Recurring discount (' + c.freqDiscountPct + '%)',
            '−' + F.money(c.freqDiscount)) : null,
          el('div.quote__calc-row.quote__calc-row--total', [
            el('span', 'Suggested'), el('span', F.money(c.suggested))
          ])
        ].filter(Boolean)) : null,

        el('div.quote__figures', [
          figure('Est. time', F.hoursLabel(c.minutes)),
          figure('Est. cost', F.money(c.cost)),
          figure('Est. profit', F.money(c.profit), 'ok'),
          figure('Margin', c.margin + '%', verdict.tone === 'ok' ? 'ok' : 'thin')
        ]),

        el('div', {
          style: {
            marginTop: '14px', fontSize: '12.5px', fontWeight: '700',
            color: verdict.tone === 'ok' ? 'var(--ok-bright)'
                 : verdict.tone === 'warn' ? 'var(--warn-dot)' : '#FF9A94'
          }
        }, verdict.text + ' · ' + F.money(c.hourlyRate) + '/hr'),

        el('div.row.row-3.mt-6', [
          el('button.btn.btn--on-ink', {
            type: 'button', style: { flex: '1' }, onclick: function () { save('draft'); }
          }, 'Save Quote'),
          el('button.btn.btn--primary', {
            type: 'button', style: { flex: '1' }, onclick: acceptAndBook
          }, draft.mode === 'new' ? 'Create Client + Book' : 'Book Job')
        ]),

        el('div.row.row-3.mt-3', { style: { justifyContent: 'center' } }, [
          el('button.linkbtn.linkbtn--on-ink', {
            type: 'button', onclick: function () { save('sent'); }
          }, 'Save & mark sent')
        ])
      ]));

      function calcRow(label, value) {
        return el('div.quote__calc-row', [el('span', label), el('span', value)]);
      }
      function figure(label, value, tone) {
        return el('div', [
          el('div.quote__fig-label', label),
          el('div.quote__fig-value' + (tone === 'ok' ? '.quote__fig-value--ok'
            : tone === 'thin' ? '.quote__fig-value--thin' : ''), value)
        ]);

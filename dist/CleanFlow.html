  /** Records from the scrape, everything else from the structurally valid trim. */
  function merge(trimResult, scrapeResult) {
    var base = trimResult.data;
    var extra = scrapeResult.data;
    ['clients', 'jobs', 'invoices', 'quotes', 'expenses'].forEach(function (key) {
      var seen = Object.create(null);
      var combined = [];
      base[key].concat(extra[key]).forEach(function (r) {
        if (!r || !r.id || seen[r.id]) return;
        seen[r.id] = true;
        combined.push(r);
      });
      base[key] = combined;
    });
    return {
      data: base,
      method: 'trimmed + scraped',
      partial: true,
      counts: {
        clients: base.clients.length, jobs: base.jobs.length,
        invoices: base.invoices.length, quotes: base.quotes.length,
        expenses: base.expenses.length
      }
    };
  }

  function finish(raw, method, partial) {
    var data = raw && raw.data && raw._cleanflow ? raw.data : raw;
    var migrated = CF.schema.migrate(data);
    return {
      data: migrated,
      method: method,
      partial: partial,
      counts: {
        clients:  migrated.clients.length,
        jobs:     migrated.jobs.length,
        invoices: migrated.invoices.length,
        quotes:   migrated.quotes.length,
        expenses: migrated.expenses.length
      }
    };
  }

  function countAll(obj) {
    if (!obj) return 0;
    return ['clients', 'jobs', 'invoices', 'quotes', 'expenses'].reduce(function (a, k) {
      return a + (Array.isArray(obj[k]) ? obj[k].length : 0);
    }, 0);
  }

  /* ---- Pass 1: trim to the last balanced point ---------------------------
     Walks the text once tracking depth and string state, remembering every
     offset where the structure was closed. Then closes the open braces and
     brackets at the furthest such point and tries to parse.                */

  function trimToBalanced(text) {
    var depth = 0, inString = false, escaped = false;
    var stack = [];
    var lastComplete = -1;
    var checkpoints = [];

    for (var i = 0; i < text.length; i++) {
      var ch = text[i];

      if (inString) {
        if (escaped) { escaped = false; }
        else if (ch === '\\') { escaped = true; }
        else if (ch === '"') { inString = false; }
        continue;
      }

      if (ch === '"') { inString = true; continue; }
      if (ch === '{' || ch === '[') { stack.push(ch); depth++; continue; }
      if (ch === '}' || ch === ']') {
        stack.pop(); depth--;
        if (depth === 0) lastComplete = i;
        continue;
      }
      // A comma at shallow depth is a safe place to cut a partial array.
      if (ch === ',' && depth > 0 && depth <= 4) checkpoints.push({ at: i, stack: stack.slice() });
    }

    // The whole thing was valid after all.
    if (lastComplete === text.length - 1) {
      try { return JSON.parse(text); } catch (e) { /* fall through */ }
    }
    if (lastComplete > 0) {
      try { return JSON.parse(text.slice(0, lastComplete + 1)); } catch (e) { /* fall through */ }
    }

    // Try the latest checkpoints, newest first — that keeps the most records.
    for (var c = checkpoints.length - 1; c >= 0 && c > checkpoints.length - 400; c--) {
      var cp = checkpoints[c];
      var candidate = text.slice(0, cp.at) + closers(cp.stack);
      try {
        var parsed = JSON.parse(candidate);
        if (parsed && typeof parsed === 'object') return parsed;
      } catch (e) { /* keep walking back */ }
    }
    return null;
  }

  function closers(stack) {
    var out = '';
    for (var i = stack.length - 1; i >= 0; i--) out += stack[i] === '{' ? '}' : ']';
    return out;
  }

  /* ---- Pass 2: scrape individual records ---------------------------------
     Last resort for badly mangled text. Pulls out every balanced `{...}` that
     has an `id`, then files each one by the fields it carries.             */

  function scrapeRecords(text) {
    var found = [];
    for (var i = 0; i < text.length; i++) {
      if (text[i] !== '{') continue;
      var end = matchBrace(text, i);
      if (end === -1) continue;
      var slice = text.slice(i, end + 1);
      if (slice.length > 200000) { i = end; continue; }
      try {
        var obj = JSON.parse(slice);
        if (obj && typeof obj === 'object' && typeof obj.id === 'string') found.push(obj);
      } catch (e) { /* not a whole record */ }
      i = end;                       // never re-scan the inside of a record
      if (found.length > 100000) break;
    }
    if (!found.length) return null;

    var out = { clients: [], jobs: [], invoices: [], quotes: [], expenses: [] };
    found.forEach(function (r) {
      var bucket = classify(r);
      if (bucket) out[bucket].push(r);
    });
    return out;
  }

  function matchBrace(text, start) {
    var depth = 0, inString = false, escaped = false;
    for (var i = start; i < text.length; i++) {
      var ch = text[i];
      if (inString) {
        if (escaped) escaped = false;
        else if (ch === '\\') escaped = true;
        else if (ch === '"') inString = false;
        continue;
      }
      if (ch === '"') { inString = true; continue; }
      if (ch === '{') depth++;
      else if (ch === '}') { depth--; if (depth === 0) return i; }
    }
    return -1;
  }

  /** Work out what a loose record is from the fields it has. */
  function classify(r) {
    if (r.payments !== undefined || (r.lines !== undefined && r.total !== undefined)) return 'invoices';
    if (r.margin !== undefined && r.price !== undefined) return 'quotes';
    if (r.checklist !== undefined || r.serviceId !== undefined && r.date !== undefined && r.status !== undefined) return 'jobs';
    if (r.category !== undefined && r.amount !== undefined) return 'expenses';
    if (r.name !== undefined && (r.address !== undefined || r.phone !== undefined ||
        r.frequency !== undefined || r.status !== undefined)) return 'clients';
    return null;
  }

  /** Try to salvage whatever is sitting in this browser's quarantine. */
  function fromQuarantine(key) {
    var raw;
    try { raw = localStorage.getItem(key); } catch (e) { return null; }
    if (!raw) return null;
    return attempt(raw);
  }

  function quarantineKeys() {
    var keys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('cleanflow:corrupt:') === 0) keys.push(k);
      }
    } catch (e) { /* storage unavailable */ }
    return keys.sort().reverse();
  }

  CF.salvage = {
    attempt: attempt,
    fromQuarantine: fromQuarantine,
    quarantineKeys: quarantineKeys
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/features/vault.js */
/* ==========================================================================
   CleanFlow — Folder backup ("Auto-Backup Folder")

   Everything else in this app lives inside the browser's storage for this
   file. Clearing site data, switching browsers or losing the profile takes
   all of it — and no amount of careful writing inside that box helps.

   So: with one permission grant, CleanFlow keeps a copy of the backup file in
   a real folder the owner picks (their Dropbox, iCloud Drive, OneDrive or a
   USB stick), and refreshes it automatically. That copy survives everything
   the browser can do to itself.

   Entirely optional and fully feature-detected. Where the File System Access
   API is missing — Firefox, Safari, older browsers — none of this appears and
   the ordinary Export button remains the way to back up.
   ========================================================================== */
(function (CF) {
  'use strict';

  var HANDLE_DB = 'cleanflow-vault';
  var HANDLE_STORE = 'handles';
  var HANDLE_KEY = 'folder';
  var MIN_INTERVAL_MS = 5 * 60 * 1000;   // don't rewrite more than every 5 min

  var handle = null;
  var lastWrite = 0;
  var busy = false;

  function supported() {
    return typeof window !== 'undefined' &&
           typeof window.showDirectoryPicker === 'function';
  }

  /* ---- Handle storage -----------------------------------------------------
     A directory handle is structured-cloneable, so IndexedDB can keep it
     across restarts. It is held apart from the main database so restoring a
     backup never drags someone else's folder permission along with it.     */

  function openHandleDb() {
    return new Promise(function (resolve, reject) {
      var req;
      try { req = indexedDB.open(HANDLE_DB, 1); }
      catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(HANDLE_STORE)) db.createObjectStore(HANDLE_STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function putHandle(value) {
    return openHandleDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(HANDLE_STORE, 'readwrite');
        tx.objectStore(HANDLE_STORE).put(value, HANDLE_KEY);
        tx.oncomplete = function () { db.close(); resolve(); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      });
    });
  }

  function getHandle() {
    return openHandleDb().then(function (db) {
      return new Promise(function (resolve) {
        var tx = db.transaction(HANDLE_STORE, 'readonly');
        var req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
        req.onsuccess = function () { db.close(); resolve(req.result || null); };
        req.onerror = function () { db.close(); resolve(null); };
      });
    }).catch(function () { return null; });
  }

  /* ---- Permissions --------------------------------------------------------- */

  function permissionState(h) {
    if (!h || !h.queryPermission) return Promise.resolve('granted');
    return h.queryPermission({ mode: 'readwrite' }).catch(function () { return 'prompt'; });
  }

  function requestPermission(h) {
    if (!h || !h.requestPermission) return Promise.resolve('granted');
    return h.requestPermission({ mode: 'readwrite' }).catch(function () { return 'denied'; });
  }

  /* ---- Public -------------------------------------------------------------- */

  /** Restore a previously chosen folder on startup. Never prompts. */
  function init() {
    if (!supported()) return Promise.resolve(false);
    return getHandle().then(function (h) {
      if (!h) return false;
      handle = h;
      return permissionState(h).then(function (state) {
        return state === 'granted';
      });
    }).catch(function () { return false; });
  }

  /** Ask the owner to pick a folder. Must be called from a click. */
  function choose() {
    if (!supported()) return Promise.reject(new Error('unsupported'));
    return window.showDirectoryPicker({ id: 'cleanflow-backups', mode: 'readwrite' })
      .then(function (h) {
        handle = h;
        return putHandle(h).then(function () { return write(true); });
      });
  }

  function forget() {
    handle = null;
    lastWrite = 0;
    return putHandle(null).catch(function () {});
  }

  function isConfigured() { return !!handle; }

  function status() {
    if (!supported()) return Promise.resolve({ supported: false });
    if (!handle) return Promise.resolve({ supported: true, configured: false });
    return permissionState(handle).then(function (state) {
      return {
        supported: true,
        configured: true,
        permission: state,
        folderName: handle.name || 'chosen folder',
        lastWrite: lastWrite || null
      };
    });
  }

  /**
   * Write the current database into the folder.
   * @param {boolean} force  skip the rate limit (manual save, first setup)
   */
  function write(force) {
    if (!supported() || !handle || busy) return Promise.resolve(false);
    if (!force && Date.now() - lastWrite < MIN_INTERVAL_MS) return Promise.resolve(false);

    busy = true;
    return permissionState(handle)
      .then(function (state) {
        // Re-prompting needs a user gesture, so a background write simply
        // stands down rather than throwing.
        if (state !== 'granted') return force ? requestPermission(handle) : 'denied';
        return 'granted';
      })
      .then(function (state) {
        if (state !== 'granted') throw new Error('permission-denied');
        return handle.getFileHandle(fileName(), { create: true });
      })
      .then(function (fileHandle) { return fileHandle.createWritable(); })
      .then(function (writable) {
        return writable.write(CF.backup.serialise()).then(function () { return writable.close(); });
      })
      .then(function () {
        lastWrite = Date.now();
        busy = false;
        return true;
      })
      .catch(function (err) {
        busy = false;
        throw err;
      });
  }

  /** One file per day, so a bad day never overwrites a good week. */
  function fileName() {
    var d = new Date();
    var biz = (CF.store.get().business.name || 'cleanflow')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cleanflow';
    return biz + '-backup-' +
      d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0') + '.json';
  }

  /** Quiet background refresh; failures are reported through status(), not toasts. */
  function maybeWrite() {
    if (!isConfigured()) return Promise.resolve(false);
    return write(false).catch(function () { return false; });
  }

  CF.vault = {
    supported: supported, init: init, choose: choose, forget: forget,
    write: write, maybeWrite: maybeWrite, status: status,
    isConfigured: isConfigured, fileName: fileName
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/features/backup.js */
/* ==========================================================================
   CleanFlow — Backup, restore and CSV export

   There is no cloud and no account, so the backup file IS the safety net.
   Restore is deliberately cautious: the file is validated and summarised,
   and the caller must confirm before anything is overwritten.
   ========================================================================== */
(function (CF) {
  'use strict';

  var FILE_TAG = 'cleanflow-backup';

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  function slug(text) {
    return String(text || 'cleanflow').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cleanflow';
  }

  /* ---- Full backup -------------------------------------------------------- */

  /** The exact bytes of a backup file — shared by download and folder copy. */
  function serialise() {
    return JSON.stringify({
      _format: FILE_TAG,
      _version: CF.schema.VERSION,
      _exportedAt: new Date().toISOString(),
      _app: 'CleanFlow',
      data: CF.store.get()
    }, null, 2);
  }

  function exportBackup(options) {
    var opts = options || {};
    var db = CF.store.get();
    var name = slug(db.business.name) + '-' +
               (opts.suffix || 'backup') + '-' + stamp() + '.json';
    download(name, serialise(), 'application/json');

    // A pre-restore safety copy is not the user's own backup habit, so it
    // must not reset the "last backed up" reminder.
    if (!opts.silent) {
      CF.store.commit('Backup', function (d) {
        d.settings.lastBackupAt = new Date().toISOString();
      }, { noUndo: true });
    }

    return name;
  }

  /**
   * Read a backup file without applying it, so the UI can show the user
   * what they are about to overwrite themselves with.
   */
  function inspectFile(file) {
    return new Promise(function (resolve, reject) {
      if (!file) { reject(new Error('No file selected')); return; }
      if (file.size > 25 * 1024 * 1024) {
        reject(new Error('That file is unusually large for a CleanFlow backup.'));
        return;
      }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read that file.')); };
      reader.onload = function () {
        var parsed;
        try { parsed = JSON.parse(reader.result); }
        catch (e) {
          reject(new Error('That does not look like a CleanFlow backup — it is not valid JSON.'));
          return;
        }

        var tagged = !!(parsed && parsed._format === FILE_TAG);
        var data = tagged ? parsed.data : parsed;

        var verdict = validateShape(data, tagged);
        if (!verdict.ok) { reject(new Error(verdict.message)); return; }

        var fileVersion = tagged ? Number(parsed._version) : Number(data && data.schemaVersion);

        resolve({
          data: data,
          tagged: tagged,
          exportedAt: (tagged && parsed._exportedAt) || null,
          businessName: (data.business && data.business.name) || '',
          version: isFinite(fileVersion) ? fileVersion : null,
          // A file from a newer CleanFlow may carry fields this build drops on
          // save. The user is told rather than quietly downgraded.
          newerThanApp: isFinite(fileVersion) && fileVersion > CF.schema.VERSION,
          warnings: verdict.warnings,
          counts: {
            clients:  countLive(data.clients),
            jobs:     countLive(data.jobs),
            invoices: countLive(data.invoices),
            quotes:   countLive(data.quotes),
            expenses: countLive(data.expenses)
          }
        });
      };
      reader.readAsText(file);
    });
  }

  function notDeleted(r) { return r && typeof r === 'object' && !r.deletedAt; }

  function countLive(list) {
    return Array.isArray(list) ? list.filter(notDeleted).length : 0;
  }

  /**
   * Is this actually a CleanFlow backup?
   *
   * An untagged file has to look convincingly like one before we let it
   * replace somebody's business — any JSON with a `clients` array used to
   * sail through. Records that are not objects, or have no id, are counted
   * and reported instead of being imported as junk.
   */
  var COLLECTIONS = ['clients', 'jobs', 'invoices', 'quotes', 'expenses', 'services'];

  function validateShape(data, tagged) {
    var warnings = [];

    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      return { ok: false, message: 'That file does not contain CleanFlow data. ' +
        'Pick the .json backup CleanFlow created.' };
    }

    var present = COLLECTIONS.filter(function (k) { return Array.isArray(data[k]); });
    var hasSettings = data.settings && typeof data.settings === 'object';
    var hasBusiness = data.business && typeof data.business === 'object';

    // A tagged file only needs one recognisable collection. An untagged one
    // has to clear a higher bar, because anything could be handing us JSON.
    var convincing = tagged
      ? present.length >= 1
      : (present.length >= 3 && (hasSettings || hasBusiness));

    if (!convincing) {
      return { ok: false, message: present.length
        ? 'That file is missing most of a CleanFlow backup, so restoring it ' +
          'would wipe your data and put almost nothing back. Pick the .json ' +
          'file CleanFlow exported.'
        : 'That file does not contain CleanFlow data. Pick the .json backup ' +
          'CleanFlow created.' };
    }

    var badTotal = 0;
    present.forEach(function (key) {
      var bad = data[key].filter(function (r) {
        return !r || typeof r !== 'object' || Array.isArray(r) || !r.id;
      }).length;
      if (bad) { badTotal += bad; warnings.push(bad + ' unreadable ' + key.slice(0, -1) + ' record(s)'); }
    });

    // A record can be a perfectly good object with an id and still carry a
    // payment history that is not a list. Loading repairs the shape by dropping
    // it, which reads as unpaid — the safe direction, since chasing money that
    // was already paid is recoverable and never chasing it is not. But money
    // recorded as received must not disappear without a word, so it is named
    // here rather than left to be noticed in the accounts months later.
    if (Array.isArray(data.invoices)) {
      var lostHistory = data.invoices.filter(function (r) {
        return r && typeof r === 'object' && r.id &&
               r.payments !== undefined && r.payments !== null &&
               !Array.isArray(r.payments);
      }).length;
      if (lostHistory) {
        warnings.push(lostHistory + ' invoice(s) whose payment history cannot be read — ' +
          'they will show as unpaid, so check them against your records');
      }
    }

    // Entirely made of junk is a corrupt file, not a recoverable one.
    var totalRows = present.reduce(function (a, k) { return a + data[k].length; }, 0);
    if (totalRows > 0 && badTotal === totalRows) {
      return { ok: false, message: 'Every record in that file is unreadable, so it ' +
        'cannot be restored. Try an older backup.' };
    }

    return { ok: true, warnings: warnings };
  }

  /** Apply an inspected backup. Undo still works immediately afterwards. */
  function applyRestore(data) {
    CF.store.replace(data, 'Restore backup');

    // Everything the UI is holding was typed against the business that has just
    // been replaced: saved drafts, and the quote screen's in-memory one. The
    // views each clearing their own left gaps — the proposal draft reappeared
    // inside the restored business — so it is invalidated here, in the one place
    // that knows a restore happened.
    if (CF.drafts && CF.drafts.clearAll) CF.drafts.clearAll();
    if (CF.views && CF.views.quote && CF.views.quote.reset) {
      try { CF.views.quote.reset({}); } catch (e) { /* a view reset must not fail a restore */ }
    }
    if (CF.views && CF.views.grow && CF.views.grow.resetProposal) {
      try { CF.views.grow.resetProposal(); } catch (e) { /* as above */ }
    }

    CF.store.logActivity({ icon: '⬇️', text: 'Restored data from a backup file' });
    return CF.store.flush();
  }

  /* ---- CSV ---------------------------------------------------------------- */

  /**
   * One CSV cell.
   *
   * Numbers are written through untouched — quoting a negative amount as
   * text ("'-54") is what turns an accountant's SUM column into gibberish.
   * Only text is screened for the leading characters that make Excel, Sheets
   * and Numbers evaluate a cell as a formula, and the check looks past any
   * leading whitespace, tab or newline used to smuggle one in.
   */
  function csvCell(value) {
    if (value === null || value === undefined) return '';

    if (typeof value === 'number') {
      return isFinite(value) ? String(value) : '';
    }
    if (typeof value === 'boolean') return value ? 'TRUE' : 'FALSE';

    var s = String(value);

    // \u0000-\u001F covers tab, CR and LF; \u00A0 and friends cover the
    // non-breaking spaces that get pasted in from the web.
    if (/^[\s\u0000-\u001F\u00A0\u2000-\u200B\uFEFF]*[=+\-@\t\r]/.test(s)) {
      s = "'" + s;
    }

    if (/["\r\n,]/.test(s)) {
      // Normalise embedded breaks to CRLF so Excel keeps the row together.
      s = s.replace(/\r\n|\r|\n/g, '\r\n');
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  /** Amounts must reach the spreadsheet as numbers, not decorated strings. */
  function csvNumber(value) {
    var n = Number(value);
    return isFinite(n) ? n : 0;
  }

  function toCsv(headers, rows) {
    var out = [headers.map(csvCell).join(',')];
    rows.forEach(function (r) { out.push(r.map(csvCell).join(',')); });
    return out.join('\r\n');
  }

  function exportCsv(kind) {
    var db = CF.store.get();
    var name = slug(db.business.name) + '-' + kind + '-' + stamp() + '.csv';
    var csv = '';

    if (kind === 'clients') {
      csv = toCsv(
        ['Name', 'Phone', 'Email', 'Address', 'Property', 'Beds', 'Baths',
         'Service', 'Frequency', 'Status', 'Jobs completed', 'Lifetime value', 'Notes'],
        CF.q.activeClients().map(function (c) {
          var st = CF.q.clientStats(c.id);
          return [c.name, c.phone, c.email, c.address, c.propertyType, c.beds, c.baths,
                  CF.q.serviceName(c.preferredServiceId, ''), c.frequency, c.status,
                  csvNumber(st.jobsCompleted), csvNumber(st.lifetimeValue), c.notes];
        })
      );
    } else if (kind === 'jobs') {
      csv = toCsv(
        ['Date', 'Time', 'Client', 'Service', 'Price', 'Extras', 'Total', 'Status', 'Address', 'Notes'],
        CF.q.sortByWhen(CF.q.jobs(), 'desc').map(function (j) {
          var extras = (j.extras || []).reduce(function (a, e) { return a + (Number(e.amount) || 0); }, 0);
          return [j.date, j.time, CF.q.clientName(j.clientId, j.clientName),
                  CF.q.serviceName(j.serviceId, j.serviceName), csvNumber(j.price),
                  csvNumber(extras), csvNumber(CF.q.jobTotal(j)),
                  j.status, j.address, j.notes];
        })
      );
    } else if (kind === 'invoices') {
      csv = toCsv(
        ['Number', 'Issued', 'Due', 'Client', 'Subtotal', 'Tax', 'Total',
         'Received', 'Remaining', 'Status'],
        CF.q.invoices().map(function (i) {
          // Older invoices predate the stored subtotal; derive it so the
          // column is never blank in a spreadsheet that sums it.
          var tax = Number(i.tax) || 0;
          var subtotal = i.subtotal === undefined || i.subtotal === null
            ? (Number(i.total) || 0) - tax
            : Number(i.subtotal) || 0;
          return ['#' + i.number, i.issueDate, i.dueDate,
                  CF.q.clientName(i.clientId, i.clientName),
                  csvNumber(subtotal), csvNumber(tax), csvNumber(i.total),
                  csvNumber(CF.q.invoiceReceived(i)), csvNumber(CF.q.invoiceRemaining(i)),
                  CF.q.invoiceStatus(i).label];
        })
      );
    } else if (kind === 'expenses') {
      csv = toCsv(
        ['Date', 'Category', 'Amount', 'Note'],
        CF.q.expenses().slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })
          .map(function (e) { return [e.date, e.category, csvNumber(e.amount), e.note]; })
      );
    } else if (kind === 'quotes') {
      csv = toCsv(
        ['Number', 'Date', 'Client', 'Service', 'Price', 'Est. cost', 'Est. profit', 'Margin %', 'Status'],
        CF.q.quotes().map(function (q) {
          return ['#' + q.number, q.date, q.clientName || CF.q.clientName(q.clientId),
                  CF.q.serviceName(q.serviceId, ''), csvNumber(q.price), csvNumber(q.cost),
                  csvNumber(q.profit), csvNumber(q.margin), q.status];
        })
      );
    } else if (kind === 'payments') {
      csv = toCsv(
        ['Date', 'Client', 'Invoice', 'Amount', 'Method'],
        CF.q.paymentsIn().map(function (p) {
          return [p.date, CF.q.clientName(p.clientId, p.clientName),
                  '#' + p.invoiceNumber, csvNumber(p.amount), p.method];
        })
      );
    } else {
      return null;
    }

    download(name, '﻿' + csv, 'text/csv');   // BOM so Excel reads UTF-8
    return name;
  }

  /* ---- Backup nagging ------------------------------------------------------ */

  function daysSinceBackup() {
    var last = CF.store.get().settings.lastBackupAt;
    if (!last) return null;
    return Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
  }

  function backupOverdue() {
    var db = CF.store.get();
    var hasRealWork = CF.q.activeClients().length > 0 || CF.q.jobs().length > 0;
    if (!hasRealWork || db.settings.demoMode) return false;
    var days = daysSinceBackup();
    if (days === null) return true;
    // Same trap as the other day counts: `|| 7` turned a stored 0 — remind me
    // every day — into a week of silence.
    var window = Number(db.settings.backupReminderDays);
    if (!isFinite(window) || window < 0) window = 7;
    return days >= window;
  }

  function lastBackupLabel() {
    var last = CF.store.get().settings.lastBackupAt;
    if (!last) return 'Never';
    var days = daysSinceBackup();
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    return days + ' days ago';
  }

  CF.backup = {
    exportBackup: exportBackup, serialise: serialise,
    inspectFile: inspectFile,
    applyRestore: applyRestore,
    exportCsv: exportCsv,
    download: download,
    backupOverdue: backupOverdue,
    daysSinceBackup: daysSinceBackup,
    lastBackupLabel: lastBackupLabel
  };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/data/demo.js */
/* ==========================================================================
   CleanFlow — Demo business

   Sparkle & Shine: a believable one-person operation mid-week. Dates are
   generated relative to today, so the demo always looks live — today has
   jobs, an invoice is genuinely overdue, and two clients have actually
   lapsed. Every Grow opportunity is earned by the data rather than faked.
   ========================================================================== */
(function (CF) {
  'use strict';

  function build() {
    var F = CF.fmt;
    var db = CF.schema.emptyDatabase();
    var today = F.today();
    var day = function (offset) { return F.addDays(today, offset); };

    db.business = {
      name: 'Sparkle & Shine Cleaning Co.',
      owner: 'Sam Rivera',
      phone: '(512) 555-0142',
      email: 'hello@sparkleandshine.co',
      address: '1200 S Lamar Blvd, Austin, TX 78704',
      serviceArea: 'Austin, TX & surrounding suburbs',
      tagline: 'Reliable, thorough, on time.'
    };

    db.settings = Object.assign(db.settings, {
      demoMode: true,
      onboarded: true,
      hourlyCost: 28,
      lastBackupAt: new Date(Date.now() - 3 * 86400000).toISOString()
    });

    var SVC = {
      standard: 'svc-standard', deep: 'svc-deep',
      moveout: 'svc-moveout', airbnb: 'svc-airbnb'
    };

    /* ---- Clients ------------------------------------------------------- */

    db.clients = [
      {
        id: 'c-sarah', name: 'Sarah Miller', phone: '(512) 555-0142',
        email: 'sarah.miller@email.com', address: '142 Maple Ave, Austin, TX',
        propertyType: 'House', sqft: 2100, beds: 3, baths: 2,
        access: 'Side gate code 4471. Key under the blue planter if the gate is latched.',
        pets: 'Friendly golden retriever (Max) — keep the back door closed.',
        preferences: 'Prefers eco-friendly products. Leave the AC off after cleaning.',
        notes: 'Works from home Tuesdays — knock rather than ring the bell.',
        preferredServiceId: SVC.standard, frequency: 'biweekly',
        status: 'active', contract: 'Signed welcome packet on file · bi-weekly agreement',
        createdAt: new Date(Date.now() - 400 * 86400000).toISOString()
      },
      {
        id: 'c-james', name: 'James Ortiz', phone: '(512) 555-0178',
        email: 'j.ortiz@email.com', address: '21 Oak Ct, Austin, TX',
        propertyType: 'Townhouse', sqft: 1650, beds: 2, baths: 2,
        access: 'Alarm code 9821, panel in the hallway closet.',
        pets: 'None.',
        preferences: 'Hates the smell of bleach — use the citrus cleaner.',
        notes: 'Travels for work; texts to confirm the day before.',
        preferredServiceId: SVC.deep, frequency: 'monthly',
        status: 'active', contract: '',
        createdAt: new Date(Date.now() - 260 * 86400000).toISOString()
      },
      {
        id: 'c-linda', name: 'Linda Park', phone: '(512) 555-0196',
        email: 'linda.park@email.com', address: '910 Cedar St, Austin, TX',
        propertyType: 'House', sqft: 2600, beds: 4, baths: 3,
        access: 'Park in the driveway. Lockbox on the side door, code 2208.',
        pets: 'Two cats — keep the upstairs bedroom door shut.',
        preferences: 'Wants the kitchen done first. Leave a note on the counter.',
        notes: 'Longest-running client. Has referred two neighbours.',
        preferredServiceId: SVC.standard, frequency: 'weekly',
        status: 'active', contract: 'Weekly standard cleaning agreement · reviewed each January',
        createdAt: new Date(Date.now() - 700 * 86400000).toISOString()
      },
      {
        id: 'c-marco', name: 'Marco Reyes', phone: '(512) 555-0110',
        email: 'marco.r@email.com', address: '55 Elm Dr, Austin, TX',
        propertyType: 'Apartment', sqft: 950, beds: 2, baths: 1,
        access: 'Empty unit — leasing office holds the key, ask for unit 55.',
        pets: 'None.', preferences: '', notes: 'Landlord pays; invoice the management company.',
        preferredServiceId: SVC.moveout, frequency: 'one-time',
        status: 'active', contract: '',
        createdAt: new Date(Date.now() - 60 * 86400000).toISOString()
      },
      {
        id: 'c-diane', name: 'Diane Cho', phone: '(512) 555-0133',
        email: 'diane.cho@email.com', address: '88 Birch Ln, Austin, TX',
        propertyType: 'Condo', sqft: 1400, beds: 2, baths: 2,
        access: 'Key under the mat. Buzzer code 12#.',
        pets: 'None.', preferences: 'Please do not move anything on the desk.',
        notes: '', preferredServiceId: SVC.standard, frequency: 'biweekly',
        status: 'active', contract: '',
        createdAt: new Date(Date.now() - 300 * 86400000).toISOString()
      },
      {
        id: 'c-ravi', name: 'Ravi Patel', phone: '(512) 555-0188',
        email: 'ravi.p@email.com', address: '300 Pine Rd, Austin, TX',
        propertyType: 'House', sqft: 1900, beds: 3, baths: 2,
        access: 'Front door keypad 5512.',
        pets: 'One small dog, crated during cleans.',
        preferences: '', notes: 'Went quiet after a schedule clash — worth one more try.',
        preferredServiceId: SVC.standard, frequency: 'biweekly',
        status: 'active', contract: '',
        createdAt: new Date(Date.now() - 500 * 86400000).toISOString()
      },
      {
        id: 'c-meridian', name: 'Meridian Coworking', phone: '(512) 555-0200',
        email: 'ops@meridianco.com', address: '400 Congress Ave, Floor 3, Austin, TX',
        propertyType: 'Office', sqft: 4200, beds: 0, baths: 4,
        access: 'Badge access after 7pm — ask reception for the contractor badge.',
        pets: 'None.', preferences: 'Nightly service, must finish before 6am.',
        notes: 'Commercial lead — proposal sent, waiting on their ops manager.',
        preferredServiceId: SVC.standard, frequency: 'weekly',
        status: 'lead', contract: '',
        createdAt: new Date(Date.now() - 20 * 86400000).toISOString()
      }
    ];

    /* ---- Jobs -----------------------------------------------------------
       Four today, a few ahead, and a completed history deep enough that
       lifetime values and rebook timers are real numbers.                  */

    function checklist(serviceId, doneCount) {
      var items = CF.actions.checklistFor(serviceId);
      return items.map(function (i, idx) {
        return Object.assign({}, i, { done: idx < (doneCount || 0) });
      });
    }

    db.jobs = [
      // --- today
      mkJob('j-1', 'c-sarah', SVC.standard, day(0), '09:00', 120, 'scheduled', 0),
      mkJob('j-2', 'c-diane', SVC.standard, day(0), '11:30', 110, 'scheduled', 0),
      mkJob('j-3', 'c-linda', SVC.deep,     day(0), '14:00', 210, 'in_progress', 4),
      mkJob('j-4', 'c-james', SVC.standard, day(0), '16:30', 120, 'scheduled', 0),
      // --- upcoming
      mkJob('j-5', 'c-marco', SVC.moveout,  day(1), '10:00', 260, 'scheduled', 0),
      mkJob('j-6', 'c-diane', SVC.standard, day(4), '09:00', 110, 'scheduled', 0),
      mkJob('j-7', 'c-linda', SVC.standard, day(7), '09:00', 110, 'scheduled', 0),
      mkJob('j-8', 'c-sarah', SVC.standard, day(14), '09:00', 120, 'scheduled', 0),
      // --- completed history
      mkDone('j-9',  'c-james', SVC.standard, day(-1),  120),
      mkDone('j-10', 'c-linda', SVC.standard, day(-3),  110),
      mkDone('j-11', 'c-sarah', SVC.standard, day(-4),  120),
      mkDone('j-12', 'c-ravi',  SVC.standard, day(-38), 115),
      mkDone('j-13', 'c-marco', SVC.moveout,  day(-52), 250),
      mkDone('j-14', 'c-linda', SVC.standard, day(-10), 110),
      mkDone('j-15', 'c-diane', SVC.standard, day(-12), 110),
      mkDone('j-16', 'c-sarah', SVC.standard, day(-18), 120),
      mkDone('j-17', 'c-linda', SVC.standard, day(-17), 110)
    ];

    function mkJob(id, clientId, serviceId, date, time, price, status, doneCount) {
      var c = db.clients.filter(function (x) { return x.id === clientId; })[0];
      var svc = db.services.filter(function (x) { return x.id === serviceId; })[0];
      var freq = c.frequency;
      return {
        id: id, clientId: clientId, clientName: c.name,
        serviceId: serviceId, serviceName: svc.name,
        date: date, time: time, price: price,
        address: c.address,
        notes: [c.access, c.pets].filter(Boolean).join(' '),
        status: status,
        recurrence: { frequency: freq, endedAt: null },
        checklist: checklist(serviceId, doneCount),
        extras: [],
        startedAt: status === 'in_progress' ? new Date(Date.now() - 32 * 60000).toISOString() : null,
        elapsedSeconds: 0, finishedAt: null, completedDate: null,
        invoiceId: null, quoteId: null,
        createdAt: new Date().toISOString()
      };
    }

    function mkDone(id, clientId, serviceId, date, price) {
      var j = mkJob(id, clientId, serviceId, date, '09:00', price, 'completed', 99);
      j.completedDate = date;
      j.finishedAt = new Date().toISOString();
      j.elapsedSeconds = 9000 + Math.round(Math.random() * 3600);
      return j;
    }

    /* ---- Invoices + payments ---------------------------------------------
       One genuinely overdue, one partly paid, the rest settled.            */

    db.invoices = [
      mkInvoice('i-1', 'j-13', 'c-marco', 250, day(-52), day(-38), []),
      mkInvoice('i-2', 'j-12', 'c-ravi',  115, day(-38), day(-24),
                [{ amount: 115, date: day(-30), method: 'Cash' }]),
      mkInvoice('i-3', 'j-17', 'c-linda', 110, day(-17), day(-3),
                [{ amount: 110, date: day(-14), method: 'Bank transfer' }]),
      mkInvoice('i-4', 'j-16', 'c-sarah', 120, day(-18), day(-4),
                [{ amount: 120, date: day(-15), method: 'Card' }]),
      mkInvoice('i-5', 'j-15', 'c-diane', 110, day(-12), day(2),
                [{ amount: 110, date: day(-9), method: 'Bank transfer' }]),
      mkInvoice('i-6', 'j-14', 'c-linda', 110, day(-10), day(4),
                [{ amount: 110, date: day(-8), method: 'Bank transfer' }]),
      mkInvoice('i-7', 'j-11', 'c-sarah', 120, day(-4), day(10),
                [{ amount: 120, date: day(-2), method: 'Card' }]),
      mkInvoice('i-8', 'j-10', 'c-linda', 110, day(-3), day(11), []),
      mkInvoice('i-9', 'j-9',  'c-james', 120, day(-1), day(13),
                [{ amount: 60, date: day(-1), method: 'Cash' }])

    function mkInvoice(id, jobId, clientId, total, issue, due, payments) {
      var c = db.clients.filter(function (x) { return x.id === clientId; })[0];

      return {

        clientId: clientId, clientName: c.name, jobId: jobId,

        subtotal: total, tax: 0, total: total,
        issueDate: issue, dueDate: due,
        payments: payments.map(function (p, i) {
          return Object.assign({ id: id + '-p' + i }, p);

        notes: '', createdAt: new Date().toISOString()
      };
    }

    // Number them in issue order so the sequence reads sensibly.
    db.invoices.slice().sort(function (a, b) {
      return a.issueDate < b.issueDate ? -1 : 1;
    }).forEach(function (inv, i) { inv.number = String(101 + i); });
    db.counters.invoice = 101 + db.invoices.length;

    /* ---- Quotes ----------------------------------------------------------
       Two sent and going cold — that is what powers Grow's follow-up card. */

    db.quotes = [
      {

    // they did in between. See store.undoHandle.

      // after the decision has been taken, which covers every modal, sheet and

   *
   * Three years of work is roughly 1,500 finished jobs and as many invoices,
   * and rendering a row for every one cost over a second and 13,500 DOM nodes
   * — on a phone, a visible stall every time the tab was touched. The newest
   * rows are the ones being looked for, so the rest wait behind one tap.
   *
   * Nothing is hidden and no figure changes: the tab counts, the totals and
   * the CSV export all still come from the whole set, because they are read
   * from the data and not from what happens to be on screen.
   *
   * `config.cap` rows are drawn unless `config.showAll` is set; `onShowAll`
   * is called when the owner asks for the rest. A list shorter than the cap
   * renders exactly as it did before, with no extra markup at all.
   */
  function cappedList(config) {
    var rows = Array.isArray(config.rows) ? config.rows : [];
    var cap = config.cap > 0 ? config.cap : LIST_CAP;
    var shown = config.showAll ? rows : rows.slice(0, cap);
    var held = rows.length - shown.length;
    var list = el('div.list', shown.map(config.row));
    if (held <= 0) return list;

    var noun = config.noun || 'record';
    return el('div', [
      list,
      el('div.card.card--roomy', { style: { textAlign: 'center' } }, [
        el('div.meta', 'Showing the ' + shown.length + ' most recent of ' +
          rows.length + ' — ' + held + ' older ' +
          (held === 1 ? noun + ' is' : plural(noun) + ' are') + ' further back.'),
        el('button.linkbtn', {
          type: 'button', style: { marginTop: '6px' }, onclick: config.onShowAll
        }, 'Show all ' + rows.length)
      ])
    ]);

    function plural(word) { return /s$/.test(word) ? word : word + 's'; }
  }

  /* ---- Page header ----------------------------------------------------------------- */

  function pageHeader(config) {
    return el('div.row.between.row-4.row-wrap.mb-5', [
      el('div', [
        el('h1.h-page', config.title),
        config.sub ? el('div.sub', config.sub) : null
      ]),
      config.actions ? el('div.row.row-3.row-wrap', config.actions) : null
    ]);
  }

  function sectionHeader(title, action) {
    return el('div.row.between.row-3.mb-3', [
      el('h2.h-section', title),
      action || null
    ]);
  }

  function backLink(label, onClick) {
    return el('button.back-link', { type: 'button', onclick: onClick },
      ['← ', label]);
  }

  /* ---- Stat tiles -------------------------------------------------------------------- */

  function kpi(label, value, tone) {
    return el('div.kpi', [
      el('div.kpi__label', label),
      el('div.kpi__value' + (tone === 'warn' ? '.kpi__value--warn' : ''), value)
    ]);
  }

  function stat(config) {
    return el('div.stat' + (config.tone ? '.stat--' + config.tone : ''), [
      el('div.stat__label', config.label),
      el('div.stat__value', config.value),
      config.note ? el('div.stat__note', config.note) : null
    ]);
  }

  /* ---- Misc --------------------------------------------------------------------------- */

  function avatar(name, large) {
    return el('div.avatar' + (large ? '.avatar--lg' : ''), { 'aria-hidden': 'true' },
      CF.fmt.initials(name));
  }

  function progress(percent) {
    return el('div.progress', {
      role: 'progressbar', 'aria-valuenow': percent,
      'aria-valuemin': '0', 'aria-valuemax': '100'
    }, [el('div.progress__bar', { style: { width: percent + '%' } })]);
  }

  function defRow(label, value, isTotal) {
    return el('div.defrow' + (isTotal ? '.defrow--total' : ''), [
      el('span', label),
      el('span' + (isTotal ? '' : '.defrow__value'), value)
    ]);
  }

  /** The amber access/pets/parking panel a cleaner reads on the doorstep. */
  function accessNote(text) {
    if (!text) return null;
    return el('div.callout.callout--warn', [
      el('div.callout__title', '⚠ ACCESS, PETS & PARKING'),
      el('div.callout__body', text)
    ]);
  }

  CF.ui = CF.ui || {};
  Object.assign(CF.ui, {
    field: field, segmented: segmented, tabs: tabs, checkRow: checkRow,
    badge: badge, statusBadge: statusBadge,
    empty: empty, emptySoft: emptySoft, loading: loading,
    cappedList: cappedList, LIST_CAP: LIST_CAP,
    pageHeader: pageHeader, sectionHeader: sectionHeader, backLink: backLink,
    kpi: kpi, stat: stat, avatar: avatar, progress: progress,
    defRow: defRow, accessNote: accessNote
  });
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/onboarding.js */
/* ==========================================================================
   Onboarding — two minutes, four steps, then get out of the way

   The "See Demo" path matters as much as the setup path: most people want
   to look around before they commit their real business to a new tool.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  var step = 0;
  var draft = null;

  /**
   * A base price typed during setup.
   *
   * This used `Number(v) || 0`, which lets a negative through unchanged and
   * turns 1e999 into Infinity — and it is the first price a buyer ever enters,
   * so every job booked against that service inherited it. The same guard the
   * Settings service editor uses.
   */
  function servicePrice(v) {
    var n = Number(v);
    if (!isFinite(n) || n < 0) return 0;
    return Math.min(n, 10000000);
  }

  function reset() {
    step = 0;
    draft = {
      business: '', area: '', owner: '',
      currency: 'USD',
      services: { 'svc-standard': true, 'svc-deep': true, 'svc-moveout': true, 'svc-airbnb': false },
      prices: { 'svc-standard': 120, 'svc-deep': 210, 'svc-moveout': 260, 'svc-airbnb': 95 },
      clientName: '', clientAddress: '', clientPhone: ''
    };
  }

  function render() {
    if (!draft) reset();
    var host = el('div.onboard', [el('div.onboard__card.anim-fade-up', body())]);
    return host;
  }

  function repaint() { CF.shell.repaint(); }

  function body() {
    if (step === 0) return welcome();
    if (step >= 1 && step <= 4) return wizard();
    return finished();
  }

  /* ---- Step 0 ---------------------------------------------------------------- */

  function welcome() {
    return el('div', [
      el('div.row.row-3.mb-6', [
        el('div.brand__mark.brand__mark--lg', { 'aria-hidden': 'true' }, 'C'),
        el('div', { style: { fontWeight: '800', fontSize: '18px', letterSpacing: '-0.02em' } },
          'CleanFlow')
      ]),
      el('h1', { style: { fontSize: '28px', fontWeight: '800', letterSpacing: '-0.02em',
                          lineHeight: '1.2', margin: 0 } },
        'Welcome to CleanFlow 👋'),
      el('p', { style: { fontSize: '16px', color: 'var(--text-muted)', marginTop: '10px',
                         lineHeight: '1.5' } },
        'Everything for your cleaning business — clients, quotes, jobs, invoices and ' +
        'follow-ups — on this device. No account, no subscription, no internet needed.'),

      el('div.stack.stack-3.mt-8', [
        el('button.btn.btn--primary.btn--lg.btn--block.is-lifted', {
          type: 'button', autofocus: true, onclick: startDemo
        }, 'See the Demo First'),
        el('button.btn.btn--secondary.btn--lg.btn--block', {
          type: 'button', onclick: function () { step = 1; repaint(); }
        }, 'Set Up My Business'),
        el('button.linkbtn.linkbtn--quiet.btn--block', {
          type: 'button', style: { marginTop: '4px' }, onclick: restore
        }, 'Restore from a backup file')
      ]),

      el('p.meta.center.mt-5',
        'Your data stays on this device. Export a backup any time to move it or keep it safe.')
    ]);
  }

  function startDemo() {
    CF.demo.load().then(function () {
      draft = null;
      CF.router.go('#/home');
      CF.shell.repaint();
      CF.ui.toast('Exploring a demo business — nothing here is yours yet');
    });
  }

  function restore() {
    CF.shell.pickBackupFile(function () {
      draft = null;
      CF.router.go('#/home');
      CF.shell.repaint();
    });
  }

  /* ---- Steps 1–4 --------------------------------------------------------------- */

  var STEP_COPY = {
    1: ['Tell us about your business', 'This appears on your invoices, quotes and proposals.'],
    2: ['What services do you offer?', 'Pick the ones you actually sell — you can change these later.'],
    3: ['Set your starting prices', 'Rough is fine. The Smart Quote calculator adjusts from here.'],
    4: ['Add your first client', 'Optional, but it gets you to a real booking faster.']
  };

  function wizard() {
    var copy = STEP_COPY[step];
    var U = CF.ui;

    return el('div', [
      el('div.onboard__steps', [1, 2, 3, 4].map(function (n) {
        return el('div.onboard__step' + (n <= step ? '.is-done' : ''));
      })),
      el('div.onboard__eyebrow', 'Step ' + step + ' of 4'),
      el('h1.onboard__title', copy[0]),
      el('p.onboard__sub.mb-6', copy[1]),

      el('div.stack.stack-4', stepBody()),

      el('div.row.row-3.mt-8', [
        el('button.btn.btn--secondary', {
          type: 'button', onclick: function () { step--; repaint(); }
        }, 'Back'),
        el('button.btn.btn--primary', {
          type: 'button', style: { flex: '1' }, onclick: next
        }, step === 4 ? 'Finish Setup' : 'Continue')
      ]),

      step === 4 ? el('div.center.mt-3', [
        el('button.linkbtn.linkbtn--quiet', {
          type: 'button', onclick: function () { step = 5; repaint(); }
        }, 'Skip — I\'ll add clients later')
      ]) : null
    ]);

    function stepBody() {
      if (step === 1) return businessStep();
      if (step === 2) return servicesStep();
      if (step === 3) return pricesStep();
      return clientStep();
    }

    function businessStep() {
      return [
        U.field({ label: 'Business name', value: draft.business, autofocus: true, required: true,
          placeholder: 'e.g. Sparkle & Shine Cleaning Co.',
          onInput: function (v) { draft.business = v; } }).node,
        U.field({ label: 'Your name', value: draft.owner,
          placeholder: 'e.g. Sam Rivera',
          onInput: function (v) { draft.owner = v; } }).node,
        U.field({ label: 'Service area', value: draft.area,
          placeholder: 'e.g. Austin, TX & surrounding suburbs',
          onInput: function (v) { draft.area = v; } }).node,
        U.field({ label: 'Currency', type: 'select', value: draft.currency,
          options: CF.schema.CURRENCIES.map(function (c) {
            return { value: c.code, label: c.label + ' (' + c.symbol.trim() + ')' };
          }),
          onChange: function (v) { draft.currency = v; } }).node
      ];
    }

    function servicesStep() {
      return [el('div.stack.stack-2', CF.schema.defaultServices().map(function (s) {
        return U.checkRow({
          label: s.name,
          checked: !!draft.services[s.id],
          onToggle: function () {
            draft.services[s.id] = !draft.services[s.id];
            repaint();
          }
        });
      }))];
    }

    function pricesStep() {
      var chosen = CF.schema.defaultServices().filter(function (s) { return draft.services[s.id]; });
      if (!chosen.length) {
        return [el('div.callout.callout--warn',
          'No services picked. Go back a step and choose at least one.')];
      }
      return chosen.map(function (s) {
        return U.field({
          label: s.name, type: 'number', inputmode: 'decimal',
          value: draft.prices[s.id],
          prefix: symbolFor(draft.currency),
          hint: 'Your starting price for a typical job.',
          onInput: function (v) { draft.prices[s.id] = servicePrice(v); }
        }).node;
      }).concat([
        el('p.meta', 'You can fine-tune everything later in Settings → Services & Pricing.')
      ]);
    }

    function clientStep() {
      return [
        U.field({ label: 'Client name', value: draft.clientName, autofocus: true,
          placeholder: 'e.g. Sarah Miller',
          onInput: function (v) { draft.clientName = v; } }).node,
        U.field({ label: 'Address', value: draft.clientAddress,
          placeholder: '142 Maple Ave',
          onInput: function (v) { draft.clientAddress = v; } }).node,
        U.field({ label: 'Phone', value: draft.clientPhone, type: 'tel',
          placeholder: '(512) 555-0100',
          onInput: function (v) { draft.clientPhone = v; } }).node
      ];
    }

    function next() {
      if (step === 1 && !draft.business.trim()) {
        CF.ui.toast('Enter your business name to continue', { tone: 'bad' });
        return;
      }
      if (step === 2 && !Object.keys(draft.services).some(function (k) { return draft.services[k]; })) {
        CF.ui.toast('Pick at least one service', { tone: 'bad' });
        return;
      }
      if (step === 4) { commit(); return; }
      step++;
      repaint();
    }
  }

  function symbolFor(code) {
    var c = CF.schema.CURRENCIES.filter(function (x) { return x.code === code; })[0];
    return c ? c.symbol : '$';
  }

  /* ---- Commit ---------------------------------------------------------------- */

  function commit() {
    var currency = CF.schema.CURRENCIES.filter(function (c) {
      return c.code === draft.currency;
    })[0] || CF.schema.CURRENCIES[0];

    CF.store.commit('Finish setup', function (d) {
      d.business.name = draft.business.trim();
      d.business.owner = draft.owner.trim();
      d.business.serviceArea = draft.area.trim();

      d.settings.currency = currency.code;
      d.settings.currencySymbol = currency.symbol;
      d.settings.demoMode = false;
      d.settings.onboarded = true;

      d.services = d.services.map(function (s) {
        return Object.assign({}, s, {
          active: !!draft.services[s.id],
          basePrice: draft.prices[s.id] !== undefined
            ? servicePrice(draft.prices[s.id])
            : s.basePrice
        });
      });
    }, { noUndo: true });

    if (draft.clientName.trim()) {
      CF.actions.createClient({
        name: draft.clientName.trim(),
        address: draft.clientAddress.trim(),
        phone: draft.clientPhone.trim(),
        status: 'active'
      });
    }

    step = 5;
    repaint();
  }

  function leave(route) {
    draft = null;
    step = 0;
    CF.router.go(route);
    CF.shell.repaint();
  }

  function finished() {
    var db = CF.store.get();
    var firstClient = CF.q.activeClients()[0];

    return el('div.center.anim-pop', { style: { padding: '12px 0' } }, [
      el('div', { style: { fontSize: '52px', marginBottom: '8px' } , 'aria-hidden': 'true' }, '🎉'),
      el('h1', { style: { fontSize: '26px', fontWeight: '800', letterSpacing: '-0.02em', margin: 0 } },
        'You\'re ready!'),
      el('p', { style: { fontSize: '15px', color: 'var(--text-muted)', marginTop: '8px',
                         lineHeight: '1.5' } },
        (db.business.name || 'Your business') + ' is set up' +
        (firstClient ? ', and ' + firstClient.name + ' is on your books' : '') +
        '. Next: build a quote or book your first job.'),

      el('div.stack.stack-3.mt-8', [
        el('button.btn.btn--primary.btn--lg.btn--block', {
          type: 'button', autofocus: true,
          onclick: function () { leave('#/home'); }
        }, 'Go to Dashboard'),
        el('button.btn.btn--secondary.btn--block', {
          type: 'button',
          onclick: function () { leave('#/money/quote'); }
        }, 'Build My First Quote')
      ]),

      el('p.meta.mt-6',
        '💡 Tip: export a backup from Settings once you have real data. ' +
        'It is the only copy that exists.')
    ]);
  }

  /**
   * True while onboarding still owns the screen. Finishing setup flips
   * `onboarded` to true, so without this the shell would swap straight to the
   * dashboard and the user would never see the final step.
   */
  function isActive() {
    var db = CF.store.get();
    if (step === 5) return true;                 // showing "You're ready!"
    return !db.settings.onboarded && !db.settings.demoMode;
  }

  CF.views = CF.views || {};
  CF.views.onboarding = { render: render, reset: reset, isActive: isActive };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/home.js */
/* ==========================================================================
   🏠 HOME — "what needs my attention today?"

   Ordered by what it costs to ignore: the next job, the numbers, the
   action list, then today's schedule. Analytics stay out of the way.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  function render() {
    var U = CF.ui, F = CF.fmt, Q = CF.q;
    var go = CF.router.go;

    var clients = Q.activeClients();
    var jobs = Q.jobs();
    var isBlank = clients.length === 0 && jobs.length === 0;

    var page = el('div.anim-fade-up', [
      el('h1.h-hello', greeting()),
      el('div.sub', isBlank
        ? 'Let\'s get your first client on the books.'
        : 'Here\'s your business today.')
    ]);

    if (isBlank) {
      page.appendChild(el('div.mt-6', U.empty({
        title: 'Your day starts here 👋',
        body: 'Add a client or build a quote, and CleanFlow fills in the rest — ' +
              'jobs, invoices and follow-ups all flow from there.',
        action: { label: '+ Create Your First Quote', onClick: function () { go('#/money/quote'); } }
      })));
      page.appendChild(quickActions());
      return page;
    }

    /* ---- Next job ----------------------------------------------------- */
    var next = Q.todaysJobs()[0] || Q.upcomingJobs()[0];
    if (next) page.appendChild(el('div.mt-6', nextJobCard(next)));

    /* ---- KPIs ---------------------------------------------------------- */
    var todayList = Q.todaysJobsIncludingDone();
    var outstanding = Q.outstandingTotal();
    var followUps = Q.staleQuotes().length + Q.readyToRebook().length;

    page.appendChild(el('div.grid.grid-4.mt-4', [
      U.kpi('Jobs Today', String(todayList.length)),
      U.kpi('Expected', F.money(Q.expectedToday())),
      U.kpi('Waiting to Collect', F.money(outstanding), outstanding > 0 ? 'warn' : null),
      U.kpi('Follow-Ups', String(followUps))
    ]));

    /* ---- Needs attention ------------------------------------------------ */
    var attention = Q.needsAttention();
    page.appendChild(el('div.mt-8', [
      U.sectionHeader('Needs Your Attention'),
      attention.length
        ? el('div.list', attention.map(attentionRow))
        : el('div.callout.callout--ok', '✅ You\'re all caught up — nothing needs attention right now.')
    ]));

    /* ---- Today + activity ------------------------------------------------ */
    page.appendChild(el('div.grid.grid-split.mt-8', [
      el('div', [
        U.sectionHeader('Today\'s Jobs'),
        todayList.length
          ? el('div.list', todayList.map(todayRow))
          : U.emptySoft('Nothing on the books for today.')
      ]),
      el('div', [
        U.sectionHeader('Recent Activity'),
        recentActivity()
      ])
    ]));

    page.appendChild(quickActions());
    return page;

    /* ---- pieces ---------------------------------------------------------- */

    function greeting() {
      var h = new Date().getHours();
      var word = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
      var owner = CF.store.get().business.owner;
      return word + (owner ? ', ' + owner.split(' ')[0] : '') + ' 👋';
    }

    function nextJobCard(job) {
      var isToday = job.date === F.today();
      return el('button.nextjob', {
        type: 'button',
        onclick: function () { go('#/jobs/' + job.id); }
      }, [
        el('div.nextjob__when', [
          isToday ? 'Next Job' : F.relativeDate(job.date),
          el('br'),
          F.clockTime(job.time)
        ]),
        el('div.nextjob__rule', { 'aria-hidden': 'true' }),
        el('div.grow', [
          el('div.nextjob__client', Q.clientName(job.clientId, job.clientName)),
          el('div.nextjob__meta',
            Q.serviceName(job.serviceId, job.serviceName) + ' · ' + F.money(Q.jobTotal(job)))
        ]),
        el('span.btn.btn--primary.btn--sm', { 'aria-hidden': 'true' },
          job.status === 'in_progress' ? 'Resume' : 'View Job')
      ]);
    }

    function attentionRow(item) {
      return el('div.attention__row', [
        el('span.dot.dot--' + item.tone, { 'aria-hidden': 'true' }),
        el('div.grow', [
          el('div.listrow__title', item.title),
          el('div.listrow__sub', item.sub)
        ]),
        el('button.btn.btn--quiet.btn--sm', {
          type: 'button', onclick: function () { go(item.route); }
        }, item.cta)
      ]);
    }

    function todayRow(job) {
      var done = job.status === 'completed';
      return el('button.listrow', {
        type: 'button', onclick: function () { go('#/jobs/' + job.id); }
      }, [
        el('div.listrow__time', { style: { minWidth: '62px' } }, F.clockTime(job.time)),
        el('div.grow', [
          el('div.listrow__title', Q.clientName(job.clientId, job.clientName)),
          el('div.listrow__sub', Q.serviceName(job.serviceId, job.serviceName))
        ]),
        done ? U.badge('Done', 'ok') : el('div.listrow__price', F.money(Q.jobTotal(job)))
      ]);
    }

    function recentActivity() {
      var rows = CF.store.get().activity.slice(0, 5);
      if (!rows.length) {
        return U.emptySoft('Your activity — completed jobs, payments, quotes — will show up here.');
      }
      return el('div.card.stack.stack-3', rows.map(function (a) {
        return el('div.activity__item', [
          el('span', { 'aria-hidden': 'true' }, a.icon),
          el('div.activity__text', a.text)
        ]);
      }));
    }

    function quickActions() {
      var actions = [
        { label: 'Client',  route: '#/clients/new' },
        { label: 'Quote',   route: '#/money/quote' },
        { label: 'Job',     route: '#/jobs/new' },
        { label: 'Expense', route: null, onClick: function () { CF.views.money.expenseModal(); } }
      ];
      return el('div.mt-8', [
        U.sectionHeader('Quick Actions'),
        el('div.row.row-3.row-wrap', actions.map(function (a) {
          return el('button.btn.btn--secondary', {
            type: 'button',
            onclick: a.onClick || function () { go(a.route); }
          }, [el('span.btn__plus', { 'aria-hidden': 'true' }, '+'), a.label]);
        }))
      ]);
    }
  }

  CF.views = CF.views || {};
  CF.views.home = { render: render };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/views/clients.js */
/* ==========================================================================
   👥 CLIENTS — a CRM that fits in your head

   The list answers "who are they and when do I see them next". The profile
   uses progressive disclosure: the four things you need on the doorstep are
   open, everything else is one tap away.
   ========================================================================== */
(function (CF) {
  'use strict';

  function el() { return CF.dom.el.apply(null, arguments); }

  var filter = 'all';
  var term = '';
  var openSection = 'access';

  /* ---- List ---------------------------------------------------------------- */

  function renderList() {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var all = Q.activeClients();

    var page = el('div.anim-fade-up', [
      U.pageHeader({
        title: 'Clients',
        sub: all.length ? F.plural(all.length, 'client') : null,
        actions: [
          all.length ? el('button.btn.btn--secondary.btn--sm', {
            type: 'button', onclick: function () { CF.backup.exportCsv('clients'); }
          }, 'Export CSV') : null,
          el('button.btn.btn--primary', {
            type: 'button', onclick: function () { go('#/clients/new'); }
          }, '+ New Client')
        ].filter(Boolean)
      })
    ]);

    if (!all.length) {
      page.appendChild(U.empty({
        title: 'Your first client starts here 👋',
        body: 'Add them once and CleanFlow reuses their details for quotes, jobs ' +
              'and invoices — you\'ll never re-type an address again.',
        action: { label: '+ Add First Client', onClick: function () { go('#/clients/new'); } }
      }));
      return page;
    }

    /* ---- filters ---- */
    var rebookIds = Q.readyToRebook().map(function (r) { return r.client.id; });
    var counts = {
      all: all.length,
      active: all.filter(function (c) { return c.status === 'active'; }).length,
      lead: all.filter(function (c) { return c.status === 'lead'; }).length,
      rebook: rebookIds.length
    };

    var search = U.field({
      label: null, value: term, type: 'search',
      ariaLabel: 'Search clients by name, phone or address',
      placeholder: 'Search name, phone or address…',
      onInput: function (v) { term = v; repaintRows(); }
    });
    search.node.style.flex = '1';
    search.node.style.maxWidth = '340px';

    page.appendChild(el('div.row.row-3.row-wrap.mb-4', [
      search.node,
      U.segmented({
        label: 'Filter clients',
        value: filter,
        outline: true,
        options: [
          { value: 'all',    label: 'All (' + counts.all + ')' },
          { value: 'active', label: 'Active (' + counts.active + ')' },
          { value: 'rebook', label: 'Ready to Rebook (' + counts.rebook + ')' },
          { value: 'lead',   label: 'Leads (' + counts.lead + ')' }
        ],
        onChange: function (v) { filter = v; CF.shell.repaint(); }
      })
    ]));

    var tableHost = el('div');
    page.appendChild(tableHost);
    repaintRows();

    var archived = Q.archivedClients();
    if (archived.length) {
      page.appendChild(el('div.mt-6.center', [
        el('button.linkbtn.linkbtn--quiet', {
          type: 'button', onclick: function () { showArchived(archived); }
        }, 'View ' + F.plural(archived.length, 'archived client'))
      ]));
    }

    return page;

    function visible() {
      var q = term.trim().toLowerCase();
      return all.filter(function (c) {
        if (filter === 'active' && c.status !== 'active') return false;
        if (filter === 'lead' && c.status !== 'lead') return false;
        if (filter === 'rebook' && rebookIds.indexOf(c.id) === -1) return false;
        if (!q) return true;
        return [c.name, c.phone, c.email, c.address].some(function (v) {
          return String(v || '').toLowerCase().indexOf(q) !== -1;
        });
      });
    }

    function repaintRows() {
      var rows = visible();
      CF.dom.mount(tableHost, rows.length ? table(rows) : U.empty({
        small: true,
        title: 'No clients match that',
        body: term ? 'Try a different name, or clear the search.'
                   : 'Nothing in this filter yet.'
      }));
    }

    function table(rows) {
      return el('div.table', [
        el('div.table__head', { 'aria-hidden': 'true' }, [
          el('div', 'Name'), el('div', 'Service'),
          el('div', 'Next Cleaning'), el('div', 'Status')
        ])
      ].concat(rows.map(function (c) {
        var stats = Q.clientStats(c.id);
        var isRebook = rebookIds.indexOf(c.id) !== -1;
        var next = stats.nextJob
          ? F.relativeDate(stats.nextJob.date)
          : (isRebook ? 'Ready to rebook' : 'Not scheduled');

        return el('button.table__row', {
          type: 'button', onclick: function () { go('#/clients/' + c.id); }
        }, [
          el('div.row.row-3', [U.avatar(c.name), el('div.listrow__title', c.name)]),
          el('div', { style: { fontSize: '13.5px', color: 'var(--text-3)' } },
            Q.serviceName(c.preferredServiceId, '—')),
          el('div', { style: { fontSize: '13.5px', color: isRebook ? 'var(--warn-text)' : 'var(--text-3)' } }, next),
          el('div', statusBadge(c, isRebook))
        ]);
      })));
    }

    function statusBadge(c, isRebook) {
      if (isRebook) return U.badge('Ready to Rebook', 'warn');
      if (c.status === 'lead') return U.badge('Lead', 'brand');
      if (c.status === 'inactive') return U.badge('Inactive', 'neutral');
      return U.badge('Active', 'ok');
    }

    function showArchived(list) {
      CF.ui.modal({
        size: 'md', title: 'Archived clients',
        sub: 'Their history is kept. Restore one to bring them back to your list.',
        body: el('div.stack.stack-2', list.map(function (c) {
          return el('div.listrow', [
            el('div.grow', [
              el('div.listrow__title', c.name),
              el('div.listrow__sub', 'Archived ' + F.agoPhrase(F.toKey(c.archivedAt)))
            ]),
            el('button.btn.btn--secondary.btn--sm', {
              type: 'button',
              onclick: function () {
                CF.actions.unarchiveClient(c.id);
                CF.ui.toast(c.name + ' restored');
              }
            }, 'Restore')
          ]);
        })),
        actions: function (close) {
          return [el('button.btn.btn--secondary', { type: 'button', onclick: function () { close(); } }, 'Close')];
        }
      });
    }
  }

  /* ---- Profile ------------------------------------------------------------- */

  function renderProfile(id) {
    var U = CF.ui, F = CF.fmt, Q = CF.q, go = CF.router.go;
    var c = CF.store.find('clients', id);

    if (!c || c.deletedAt) {
      return U.empty({
        title: 'That client is no longer here',
        body: 'They may have been deleted. Head back to your client list.',
        action: { label: 'Back to Clients', onClick: function () { go('#/clients'); } }
      });
    }

    var stats = Q.clientStats(c.id);
    var history = Q.jobsForClient(c.id);

    return el('div.anim-fade-up', [
      U.backLink('Back to Clients', function () { go('#/clients'); }),

      el('div.row.between.row-5.row-wrap.mb-6', [
        el('div.row.row-4', [
          U.avatar(c.name, true),
          el('div', [
            el('h1.h-card', c.name),
            el('div.sub', [
              Q.serviceName(c.preferredServiceId, 'No service set'), ' · ',
              frequencyLabel(c.frequency)
            ])
          ])
        ]),
        el('div.row.row-3.row-wrap', [
          el('button.btn.btn--secondary', {
            type: 'button', onclick: function () { go('#/clients/' + c.id + '/edit'); }
          }, 'Edit'),
          el('button.btn.btn--secondary', {
            type: 'button', onclick: function () { go('#/money/quote?client=' + c.id); }
          }, 'Create Quote'),
          el('button.btn.btn--primary', {
            type: 'button', onclick: function () { go('#/jobs/new?client=' + c.id); }
          }, 'Book Job')
        ])
      ]),

      el('div.grid.grid-3.mb-6', [
        U.stat({ label: 'Lifetime Value', value: F.money(stats.lifetimeValue) }),
        U.stat({ label: 'Jobs Completed', value: String(stats.jobsCompleted) }),
        U.stat({
          label: 'Next Cleaning',
          value: stats.nextJob ? F.relativeDate(stats.nextJob.date) : 'Not scheduled'
        })
      ]),

      stats.outstanding > 0
        ? el('div.callout.callout--warn.mb-4',
            F.money(stats.outstanding) + ' still outstanding from this client.' +
            // An outstanding figure built partly from an invoice that does not
            // add up must not be presented as settled fact just because this is
            // not the invoice screen.
            (Q.openInvoices().some(function (i) {
              return i.clientId === c.id && Q.invoiceInconsistent(i);
            })
              ? ' One of these invoices does not add up — check it before chasing.'
              : ''))
        : null,

      el('div.stack.stack-3', sections().map(accordion)),

      el('div.mt-6.center', [
        el('button.linkbtn.linkbtn--quiet', {
          type: 'button', onclick: archive
        }, 'Archive Client')
      ])
    ]);

    function sections() {
      var rows = [];

      rows.push({ key: 'access', title: 'Access, Pets & Parking', build: function () {
        var lines = [
          c.access ? ['Access', c.access] : null,
          c.pets ? ['Pets', c.pets] : null,
          c.preferences ? ['Preferences', c.preferences] : null
        ].filter(Boolean);
        if (!lines.length) return el('div.faint', 'Nothing noted yet — add access codes, pets and parking here so you never have to remember them.');
        return el('div.stack.stack-2', lines.map(function (l) {
          return el('div', [el('strong', l[0] + ': '), l[1]]);
        }));
      } });

      rows.push({ key: 'contact', title: 'Contact', build: function () {
        var lines = [];
        if (c.phone) lines.push(el('div', ['Phone: ', el('a', { href: 'tel:' + c.phone }, c.phone)]));
        if (c.email) lines.push(el('div', ['Email: ', el('a', { href: 'mailto:' + c.email }, c.email)]));
        if (c.address) lines.push(el('div', 'Address: ' + c.address));
        return lines.length ? el('div.stack.stack-1', lines) : el('div.faint', 'No contact details yet.');
      } });

      rows.push({ key: 'property', title: 'Property Details', build: function () {
        var bits = [
          c.propertyType,
          c.sqft ? F.money ? (c.sqft + ' sq ft') : null : null,
          c.beds ? F.plural(c.beds, 'bed') : null,
          c.baths ? F.plural(c.baths, 'bath') : null
        ].filter(Boolean);
        return bits.length ? el('div', bits.join(' · ')) : el('div.faint', 'No property details yet.');
      } });

      rows.push({ key: 'history', title: 'Job & Payment History', build: function () {
        if (!history.length) return el('div.faint', 'No jobs yet.');
        return el('div.stack.stack-2', history.slice(0, 8).map(function (j) {
          return el('button.listrow', {
            type: 'button', style: { padding: '10px 12px' },
            onclick: function () { go('#/jobs/' + j.id); }
          }, [
            el('div.grow', [
              el('div.listrow__title', { style: { fontSize: '13.5px' } },
                Q.serviceName(j.serviceId, j.serviceName)),
              el('div.listrow__sub', F.shortDate(j.date))
            ]),
            el('div.listrow__price', { style: { fontSize: '13.5px' } }, F.money(Q.jobTotal(j))),
            U.badge(statusLabel(j.status), statusTone(j.status))
          ]);
        }));
      } });

      rows.push({ key: 'notes', title: 'Notes', build: function () {
        return c.notes ? el('div', c.notes) : el('div.faint', 'No notes yet.');
      } });

      rows.push({ key: 'contract', title: 'Contract & Welcome Info', build: function () {
        return c.contract ? el('div', c.contract) : el('div.faint', 'No contract details recorded.');
      } });

      return rows;
    }

    function accordion(sec) {
      var isOpen = openSection === sec.key;
      var body = el('div.acc__body');
      if (isOpen) body.appendChild(sec.build());

      return el('div.acc', [
        el('button.acc__head', {
          type: 'button',
          'aria-expanded': isOpen ? 'true' : 'false',
          onclick: function () {
            openSection = isOpen ? null : sec.key;
            CF.shell.repaint();
          }
        }, [
          el('span.acc__title', sec.title),
          el('span.acc__chev', { 'aria-hidden': 'true' }, isOpen ? '−' : '+')
        ]),
        isOpen ? body : null
      ]);
    }

    function archive() {
      // Say out loud what happens to work already on the calendar. Archiving
      // silently used to leave an ex-client's clean sitting on Today's list.
      var pending = CF.actions.futureWorkFor(c.id);
      var owed = CF.q.openInvoices().filter(function (i) { return i.clientId === c.id; });

      var lines = ['They come off your active list but every job, invoice and note is kept. ' +
                   'You can restore them at any time.'];
      if (pending.length) {
        lines.push(CF.fmt.plural(pending.length, 'upcoming job') +
                   ' will be cancelled and any repeat stopped.');
      }
      if (owed.length) {
        lines.push(CF.fmt.money(owed.reduce(function (a, i) {
          return a + CF.q.invoiceRemaining(i);
        }, 0)) + ' still owed stays on your books to collect.');
      }

      CF.ui.confirm({
        title: 'Archive ' + c.name + '?',
        message: lines.join(' '),
        confirmLabel: 'Archive'
      }).then(function (ok) {
        if (!ok) return;
        CF.actions.archiveClient(c.id);
        CF.router.go('#/clients');
        CF.ui.toast(c.name + ' archived', {
          undo: function () { CF.store.undo(); CF.shell.repaint(); }
        });
      });
    }
  }

  function statusLabel(id) {
    var s = CF.schema.JOB_STATUS.filter(function (x) { return x.id === id; })[0];
    return s ? s.label : id;
  }
  function statusTone(id) {
    var s = CF.schema.JOB_STATUS.filter(function (x) { return x.id === id; })[0];
    return s ? s.tone : 'neutral';
  }
  function frequencyLabel(id) {
    var f = CF.schema.FREQUENCIES.filter(function (x) { return x.id === id; })[0];
    return f ? f.label : 'One-time';
  }

  /* ---- Create / edit form --------------------------------------------------- */

  function renderForm(id) {
    var U = CF.ui, Q = CF.q, go = CF.router.go;
    var existing = id ? CF.store.find('clients', id) : null;
    var isEdit = !!existing;

    var draft = Object.assign({
      name: '', phone: '', email: '', address: '',
      propertyType: 'House', sqft: '', beds: 2, baths: 1,
      access: '', pets: '', preferences: '', notes: '',
      preferredServiceId: (Q.activeServices()[0] || {}).id || '',
      frequency: 'one-time', status: 'active', contract: ''
    }, existing || {});

    var dupeAcknowledged = false;
    var emailField;

    var nameField = U.field({
      label: 'Client name', value: draft.name, required: true, autofocus: !isEdit,
      placeholder: 'e.g. Sarah Miller',
      onInput: function (v) { draft.name = v; nameField.setError(''); }
    });

    var form = el('form.stack.stack-5', {
      // The browser's own validation bubble is a tooltip that vanishes and is
      // easy to miss one-handed in someone's kitchen. Validation is handled in
      // save() instead, so every message appears inline under its field, in the
      // same voice as the rest of the app, and stays there.
      novalidate: true,
      onsubmit: function (e) { e.preventDefault(); save(); }
    }, [
      el('div.card.card--roomy.stack.stack-4', [
        el('h2.h-section', 'Who they are'),
        nameField.node,
        el('div.grid.grid-2', [
          U.field({ label: 'Phone', value: draft.phone, type: 'tel',
            placeholder: '(512) 555-0100',
            onInput: function (v) { draft.phone = v; } }).node,
          (emailField = U.field({ label: 'Email', value: draft.email, type: 'email',
            placeholder: 'name@email.com',
            onInput: function (v) { draft.email = v; emailField.setError(''); } })).node
        ]),
        U.field({ label: 'Address', value: draft.address,
          placeholder: '142 Maple Ave, Austin, TX',
          onInput: function (v) { draft.address = v; } }).node
      ]),

      el('div.card.card--roomy.stack.stack-4', [
        el('h2.h-section', 'Their property'),
        el('div.grid.grid-2', [
          U.field({ label: 'Property type', type: 'select', value: draft.propertyType,

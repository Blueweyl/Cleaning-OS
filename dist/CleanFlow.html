<style>/* assets/css/tokens.css */
/* ==========================================================================
   CleanFlow — Design Tokens
   Every color, space, radius and type step in the product is defined here.
   Change a value here and it changes everywhere. Never hard-code a hex
   value in a component file.
   ========================================================================== */

:root {
  /* ---- Brand ---------------------------------------------------------- */
  --brand:            #3E6FD9;
  --brand-hover:      #2E5BC0;
  --brand-active:     #2850AB;
  --brand-tint:       #EEF3FC;  /* chips, active nav, avatars          */
  /* Brand at 4.69 on white and 4.21 on its own tint reads as a link but misses
     AA as text. Fills keep --brand; anything that is *words* uses this. */
  --brand-text:       #3A66C8;
  --brand-tint-2:     #F5F8FE;  /* selected rows, info panels          */
  --brand-border:     #DCE6FA;
  --brand-on-dark:    #8FA6D9;  /* brand text on the ink surface       */

  /* Focus. Kept as its own token because the ring has to contrast with
     whatever sits behind it, and that is a different colour in each theme. */
  --focus-ring:       #3E6FD9;  /* :focus-visible outline               */
  --focus-border:     #3E6FD9;  /* a focused input's own border         */
  --focus-glow:       #EEF3FC;  /* the soft ring around a focused input */

  /* ---- Ink (dark surface used for hero cards + toasts) ---------------- */
  --ink:              #1B2430;
  --ink-text:         #FFFFFF;
  --ink-muted:        #9AA7BC;
  --ink-muted-2:      #8B96A8;
  /* 3.72 on the ink panel — below AA. #8E9DBA measures 5.73 and still reads
     as the quietest thing on a dark card. */
  --ink-faint:        #8E9DBA;
  --ink-body:         #C7D2E8;
  --ink-rule:         rgba(255, 255, 255, 0.12);
  --ink-rule-soft:    rgba(255, 255, 255, 0.10);
  --ink-fill:         rgba(255, 255, 255, 0.06);
  --ink-stroke:       rgba(255, 255, 255, 0.20);

  /* ---- Neutrals ------------------------------------------------------- */
  --text:             #1B2430;  /* primary copy                        */
  --text-2:           #334155;  /* secondary copy                      */
  --text-3:           #475569;  /* field labels                        */
  /* Measured against every surface these sit on (white, page, chip and
     brand tint) at WCAG AA. The old values were 4.44 and 2.39 against the page
     background — the faint one was effectively unreadable in daylight, which is
     where this app is used. Five distinct steps are preserved: 14.6 / 9.7 / 7.1
     / 5.7 / 4.8. */
  --text-muted:       #556377;  /* supporting copy                     */
  --text-faint:       #5F6E85;  /* meta, timestamps, placeholders      */

  --surface:          #FFFFFF;
  --surface-sunken:   #FAFBFD;  /* inputs, secondary buttons           */
  --page:             #F6F7F9;
  --chip:             #F5F6F8;  /* unselected segmented control        */
  --chip-alt:         #F1F2F4;

  --border:           #E9EBEF;  /* card borders                        */
  --border-strong:    #E1E5EB;  /* input + button borders              */
  --border-soft:      #F0F1F4;  /* internal rules                      */
  --border-softer:    #F5F6F8;  /* list dividers                       */
  --border-dashed:    #D8DEE7;  /* empty-state outlines                */

  /* ---- Semantic: success --------------------------------------------- */
  --ok-bg:            #F0F9F1;
  --ok-border:        #D8EEDA;
  --ok-text:          #237A42;
  --ok-mid:           #23703E;
  --ok-soft:          #2C6B45;
  --ok-bright:        #6FCF97;  /* profit figures on the ink surface   */
  /* A *fill* that carries white text, as distinct from --ok-text which is ink
     on a pale tint. They happen to coincide in this theme; in the dark theme
     they are near opposites, which is why they are separate tokens. */
  --ok-fill:          #237A42;
  --ok-dot:           #3E9E64;

  /* ---- Semantic: warning --------------------------------------------- */
  --warn-bg:          #FFF8ED;
  --warn-border:      #F3E4C3;
  /* 3.44 on its own tint. Solo cleaners read these badges in daylight. */
  --warn-text:        #8C5A06;
  --warn-dark:        #966008;
  --warn-deep:        #7A5A16;
  --warn-fill:        #966008;  /* white text sits on this */
  --warn-dot:         #E0B23C;
  --warn-dot-hot:     #E08A3C;

  /* ---- Semantic: danger ---------------------------------------------- */
  --bad-bg:           #FDF3F2;
  --bad-border:       #F6DDDB;
  --bad-text:         #B03A34;
  --bad-fill:         #B03A34;  /* white text sits on this — see --ok-fill */
  --bad-dot:          #E0524C;

  /* ---- Spacing scale (4px base) --------------------------------------- */
  --s-1:  4px;   --s-2:  8px;   --s-3:  12px;  --s-4:  16px;
  --s-5:  20px;  --s-6:  24px;  --s-7:  28px;  --s-8:  32px;
  --s-10: 40px;  --s-12: 48px;  --s-14: 56px;  --s-16: 64px;

  /* ---- Radius --------------------------------------------------------- */
  --r-sm:   8px;
  --r-md:   10px;
  --r-lg:   12px;
  --r-xl:   14px;
  --r-2xl:  16px;
  --r-3xl:  18px;
  --r-4xl:  24px;
  --r-pill: 999px;

  /* ---- Type scale ----------------------------------------------------- */
  --t-xs:   11.5px;
  --t-sm:   12.5px;
  --t-base: 13.5px;
  --t-md:   14.5px;
  --t-lg:   17px;
  --t-xl:   20px;
  --t-2xl:  24px;
  --t-3xl:  26px;
  --t-hero: 56px;

  /* ---- Elevation ------------------------------------------------------ */
  --shadow-sm:    0 1px 2px rgba(20, 30, 50, 0.04);
  --shadow-md:    0 12px 40px -20px rgba(20, 30, 50, 0.15);
  --shadow-lg:    0 20px 60px -20px rgba(20, 30, 50, 0.15);
  --shadow-modal: 0 24px 60px -20px rgba(20, 30, 50, 0.35);
  --shadow-brand: 0 8px 20px -6px rgba(62, 111, 217, 0.5);
  --shadow-toast: 0 12px 30px -10px rgba(0, 0, 0, 0.4);
  --scrim:        rgba(20, 30, 50, 0.4);
  --scrim-strong: rgba(20, 30, 50, 0.45);

  /* ---- Motion --------------------------------------------------------- */
  --ease:      cubic-bezier(0.2, 0, 0.2, 1);
  --dur-fast:  120ms;
  --dur:       200ms;
  --dur-slow:  350ms;

  /* ---- Layout --------------------------------------------------------- */
  --page-max:   1180px;
  --nav-h:      64px;
  --tap:        44px;   /* minimum touch target */

  /* ---- Type family ----------------------------------------------------
     Plus Jakarta Sans is loaded from Google Fonts when online. The fallback
     stack is deliberately close in metrics so an offline download still
     looks composed rather than broken.                                    */
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system,
          'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

</style>
<style>/* assets/css/base.css */
/* ==========================================================================
   CleanFlow — Reset, typography, layout primitives, utilities
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  overflow-x: hidden;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  background: var(--page);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: var(--brand-text); text-decoration: none; }
a:hover { color: var(--brand-hover); }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* Visible focus everywhere. Never remove this without a replacement. */
:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 4px;
}
:focus:not(:focus-visible) { outline: none; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border-dashed); border-radius: var(--r-sm); }

/* --------------------------------------------------------------------------
   Motion
   -------------------------------------------------------------------------- */
@keyframes cf-fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes cf-pop {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes cf-slide-up {
  from { transform: translateY(100%); }
  to   { transform: none; }
}
@keyframes cf-slide-left {
  from { transform: translateX(24px); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
@keyframes cf-spin { to { transform: rotate(360deg); } }

.anim-fade-up   { animation: cf-fade-up var(--dur-slow) var(--ease); }
.anim-pop       { animation: cf-pop var(--dur) var(--ease); }
.anim-slide-up  { animation: cf-slide-up var(--dur) var(--ease); }
.anim-slide-left{ animation: cf-slide-left var(--dur) var(--ease); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* --------------------------------------------------------------------------
   Typography roles
   -------------------------------------------------------------------------- */
.h-page    { font-size: var(--t-2xl); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.h-hello   { font-size: var(--t-3xl); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.h-section { font-size: var(--t-lg); font-weight: 800; letter-spacing: -0.01em; }
.h-card    { font-size: var(--t-xl); font-weight: 800; letter-spacing: -0.02em; }

.sub       { font-size: 15px; color: var(--text-muted); margin-top: var(--s-1); }
.meta      { font-size: var(--t-sm); color: var(--text-faint); }
.eyebrow   { font-size: var(--t-sm); font-weight: 700; color: var(--text-faint);
             text-transform: uppercase; letter-spacing: 0.04em; }

.num       { font-variant-numeric: tabular-nums; }

.muted     { color: var(--text-muted); }
.faint     { color: var(--text-faint); }

/* --------------------------------------------------------------------------
   Layout
   -------------------------------------------------------------------------- */
.app       { min-height: 100vh; display: flex; flex-direction: column; }

.page {
  flex: 1;
  width: 100%;
  min-width: 0;
  max-width: var(--page-max);
  margin: 0 auto;
  padding: var(--s-8) var(--s-7) var(--s-16);
}
.page--narrow { max-width: 640px; }
.page--form   { max-width: 520px; }

.stack   { display: flex; flex-direction: column; }
.stack-1 { gap: var(--s-1); } .stack-2 { gap: var(--s-2); }
.stack-3 { gap: var(--s-3); } .stack-4 { gap: var(--s-4); }
.stack-5 { gap: var(--s-5); } .stack-6 { gap: var(--s-6); }

.row     { display: flex; align-items: center; }
.row-2   { gap: var(--s-2); } .row-3 { gap: var(--s-3); }
.row-4   { gap: var(--s-4); } .row-5 { gap: var(--s-5); }
.row-wrap{ flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow    { flex: 1; min-width: 0; }
.shrink0 { flex-shrink: 0; }

.grid    { display: grid; gap: var(--s-3); }
.grid-2  { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3  { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4  { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-split { grid-template-columns: 1.3fr 1fr; gap: var(--s-6); }
.grid-calc  { grid-template-columns: 1fr 1fr; gap: var(--s-6); align-items: start; }

.mt-2 { margin-top: var(--s-2); } .mt-3 { margin-top: var(--s-3); }
.mt-4 { margin-top: var(--s-4); } .mt-5 { margin-top: var(--s-5); }
.mt-6 { margin-top: var(--s-6); } .mt-8 { margin-top: var(--s-8); }
.mb-3 { margin-bottom: var(--s-3); } .mb-4 { margin-bottom: var(--s-4); }
.mb-5 { margin-bottom: var(--s-5); } .mb-6 { margin-bottom: var(--s-6); }

.center     { text-align: center; }
.right      { text-align: right; }
.scroll-x   { overflow-x: auto; -webkit-overflow-scrolling: touch;
              scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.nowrap     { white-space: nowrap; }
.truncate   { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: var(--s-2); top: -60px; z-index: 200;
  background: var(--brand); color: #fff; padding: var(--s-3) var(--s-4);
  border-radius: var(--r-md); font-weight: 700; transition: top var(--dur) var(--ease);
}
.skip-link:focus { top: var(--s-2); color: #fff; }

/* --------------------------------------------------------------------------
   Responsive — phone first in behaviour, desktop enhanced
   -------------------------------------------------------------------------- */
@media (max-width: 860px) {
  .page { padding: var(--s-5) var(--s-4) calc(var(--s-16) + var(--s-8)); }
  .desktop-only { display: none !important; }
  .grid-2, .grid-3, .grid-split, .grid-calc { grid-template-columns: 1fr !important; }
  /* Four small stat tiles still scan fine two-up on a phone. */
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .h-hello { font-size: var(--t-2xl); }
  .h-page  { font-size: var(--t-xl); }
}
@media (min-width: 861px) {
  .mobile-only { display: none !important; }
}

/* --------------------------------------------------------------------------
   Print — invoices, quotes and proposals must print cleanly
   -------------------------------------------------------------------------- */
@media print {
  .no-print { display: none !important; }
  body { background: #fff; }
  .page { padding: 0; max-width: none; }
  .card, .paper { border: none !important; box-shadow: none !important; }
  .print-only { display: block !important; }
}
.print-only { display: none; }

</style>
<style>/* assets/css/components.css */
/* ==========================================================================
   CleanFlow — Components
   ========================================================================== */

/* --------------------------------------------------------------------------
   Buttons
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: var(--tap);
  padding: var(--s-3) var(--s-5);
  border-radius: var(--r-lg);
  border: 1px solid transparent;
  background: var(--surface);
  color: var(--text);
  font-size: 14px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease),
              transform var(--dur-fast) var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { cursor: not-allowed; opacity: 0.55; }
.btn[disabled]:active, .btn[aria-disabled="true"]:active { transform: none; }

.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover:not([disabled]) { background: var(--brand-hover); }
.btn--primary.is-lifted { box-shadow: var(--shadow-brand); }

.btn--secondary { background: var(--surface); border-color: var(--border-strong); }
.btn--secondary:hover:not([disabled]) { background: var(--surface-sunken); }

.btn--quiet { background: var(--surface-sunken); border-color: var(--border-strong); }
.btn--quiet:hover:not([disabled]) { background: var(--chip); }

.btn--ghost { background: transparent; color: var(--brand-text); padding-inline: var(--s-3); }
.btn--ghost:hover { background: var(--brand-tint); }

.btn--danger { background: var(--bad-fill); color: #fff; }
.btn--danger:hover:not([disabled]) { filter: brightness(0.94); }

.btn--on-ink { background: transparent; color: #fff; border-color: var(--ink-stroke); }
.btn--on-ink:hover { background: var(--ink-fill); }

.btn--sm  { min-height: 36px; padding: var(--s-2) var(--s-4); font-size: var(--t-base); }
.btn--lg  { min-height: 52px; padding: var(--s-4) var(--s-6); font-size: 15px; }
.btn--xl  { min-height: 56px; font-size: 15.5px; font-weight: 800; border-radius: var(--r-xl); }
.btn--block { width: 100%; }

.btn__plus { color: var(--brand-text); font-weight: 800; }
.btn--primary .btn__plus, .btn--danger .btn__plus { color: currentColor; }

/* A text link that behaves like a button */
.linkbtn {
  background: none; border: none; padding: var(--s-2) var(--s-1);
  color: var(--brand-text); font-size: var(--t-base); font-weight: 700;
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.linkbtn:hover { color: var(--brand-hover); }
.linkbtn--quiet { color: var(--text-faint); text-decoration: none; }
.linkbtn--quiet:hover { color: var(--text-muted); text-decoration: underline; }
.linkbtn--on-ink { color: var(--brand-on-dark); }

.back-link {
  display: inline-flex; align-items: center; gap: var(--s-1);
  background: none; border: none; padding: var(--s-2) 0;
  color: var(--brand-text); font-size: var(--t-base); font-weight: 700;
  cursor: pointer; margin-bottom: var(--s-4);
}
.back-link:hover { color: var(--brand-hover); }

/* --------------------------------------------------------------------------
   Cards + surfaces
   -------------------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--s-4) var(--s-5);
}
.card--flush   { padding: 0; overflow: hidden; }
.card--roomy   { padding: var(--s-6); border-radius: var(--r-3xl); }
.card--tight   { padding: var(--s-4); border-radius: var(--r-lg); }

.card--tap {
  cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit;
  transition: border-color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
}
.card--tap:hover { border-color: var(--brand-border); box-shadow: var(--shadow-sm); }

.ink {
  background: var(--ink); color: var(--ink-text);
  border-radius: var(--r-3xl); padding: var(--s-6) var(--s-7);
}
.ink--quote { border-radius: var(--r-4xl); padding: var(--s-8) var(--s-7); text-align: center; }

.paper {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-2xl); padding: var(--s-8);
  box-shadow: var(--shadow-md);
}

.callout {
  border-radius: var(--r-xl); padding: var(--s-4) var(--s-5);
  font-size: var(--t-base); line-height: 1.6;
}
.callout--ok   { background: var(--ok-bg);    border: 1px solid var(--ok-border);    color: var(--ok-text); font-weight: 600; }
.callout--warn { background: var(--warn-bg);  border: 1px solid var(--warn-border);  color: var(--warn-dark); }
/* Was a hard-coded #345691, which stayed navy-on-navy in the dark theme
   at 2.26:1. Every colour in here has to come from a token. */
.callout--info { background: var(--brand-tint-2); border: 1px solid var(--brand-border); color: var(--brand-text); }
.callout--bad  { background: var(--bad-bg);   border: 1px solid var(--bad-border);    color: var(--bad-text); }

.callout__title { font-size: var(--t-sm); font-weight: 700; margin-bottom: var(--s-1); }
.callout--warn .callout__title { color: var(--warn-text); }
.callout--warn .callout__body  { color: var(--warn-deep); font-size: var(--t-base); line-height: 1.5; }

/* Empty states — every list has one. */
.empty {
  text-align: center; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r-3xl);
  padding: var(--s-14) var(--s-6);
}
.empty--soft {
  border: 1px dashed var(--border-dashed); border-radius: var(--r-xl);
  padding: var(--s-5); text-align: left;
  font-size: 13px; color: var(--text-faint);
}
.empty__title { font-size: var(--t-xl); font-weight: 800; }
.empty__title--sm { font-size: var(--t-lg); }
.empty__body {
  font-size: 14px; color: var(--text-muted); margin: var(--s-2) auto 0;
  max-width: 380px; line-height: 1.6;
}
.empty .btn { margin-top: var(--s-5); }

/* Loading */
.spinner {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border-strong); border-top-color: var(--brand);
  animation: cf-spin 700ms linear infinite;
}
.loading { display: flex; align-items: center; justify-content: center; gap: var(--s-3);
           padding: var(--s-12); color: var(--text-faint); font-size: var(--t-base); }

/* --------------------------------------------------------------------------
   Badges + status
   -------------------------------------------------------------------------- */
.badge {
  display: inline-block; padding: 5px 11px; border-radius: var(--r-sm);
  font-size: 12px; font-weight: 700; white-space: nowrap;
}
.badge--ok      { background: var(--ok-bg);    color: var(--ok-text); }
.badge--warn    { background: var(--warn-bg);  color: var(--warn-text); }
.badge--bad     { background: var(--bad-bg);   color: var(--bad-text); }
.badge--brand   { background: var(--brand-tint); color: var(--brand-text); }
.badge--neutral { background: var(--chip-alt); color: var(--text-muted); }
.badge--lg      { padding: 7px 14px; font-size: var(--t-sm); font-weight: 800; border-radius: var(--r-md); }

.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot--bad  { background: var(--bad-dot); }
.dot--hot  { background: var(--warn-dot-hot); }
.dot--warn { background: var(--warn-dot); }
.dot--ok   { background: var(--ok-dot); }

.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--brand-tint); color: var(--brand-text);

<style>/* assets/css/dark.css */
/* ==========================================================================
   CleanFlow — Dark theme

   Only tokens are redefined here. Every component already draws from them, so
   nothing in components.css or views.css needs a dark-mode branch.

   The theme is applied as data-theme="dark" on <html> by a small script in the
   head, before the first paint. That means one selector rather than a copy of
   this whole palette inside a prefers-color-scheme block — and it lets someone
   choose dark on a device set to light, which a media query alone cannot.

   Every colour here was measured against the surfaces it actually lands on.
   The text ramp runs 13.8 / 11.0 / 8.4 / 6.5 / 5.5 against a card, so all five
   steps clear WCAG AA with the same hierarchy the light theme has.
   ========================================================================== */

:root[data-theme="dark"] {
  color-scheme: dark;

  /* ---- Brand -----------------------------------------------------------
     The fill keeps its exact light-mode value: it is the product's identity,
     white text on it still measures 4.69, and a brand that shifts between
     themes stops feeling like one brand. Only brand-as-text changes, because
     #3E6FD9 on a dark card is unreadable.                                  */
  --brand:            #3E6FD9;
  --brand-hover:      #4B7BE3;
  --brand-active:     #5886EC;
  --brand-tint:       #1B2740;
  --brand-text:       #8FB0F5;  /* 7.5 on a card, 8.5 on the page        */
  --brand-tint-2:     #161F31;
  --brand-border:     #2E3F62;
  --brand-on-dark:    #8FB0F5;

  /* The light theme's focus glow is a pale tint. Dropped into the dark theme
     unchanged it became a navy glow on a navy card — 1.09 against the surface,
     which is to say invisible. These are the dark equivalents, measured
     against what actually surrounds them. */
  --focus-ring:       #8FB0F5;  /* 7.5 on a card, vs 3.47 for raw brand */
  --focus-border:     #8FB0F5;
  --focus-glow:       #5C82D8;  /* 4.37 against a card                  */

  /* ---- Ink surface -----------------------------------------------------
     The hero card is the one thing that was already dark. In a dark theme it
     has to become *lighter* than the page or it stops reading as raised.    */
  --ink:              #232F3D;
  --ink-text:         #FFFFFF;
  --ink-muted:        #AEBCD0;
  --ink-muted-2:      #9DABBF;
  --ink-faint:        #9AA8BD;
  --ink-body:         #D2DCEC;
  --ink-rule:         rgba(255, 255, 255, 0.14);
  --ink-rule-soft:    rgba(255, 255, 255, 0.10);
  --ink-fill:         rgba(255, 255, 255, 0.07);
  --ink-stroke:       rgba(255, 255, 255, 0.22);

  /* ---- Neutrals -------------------------------------------------------- */
  --text:             #E8EDF4;
  --text-2:           #CBD5E3;
  --text-3:           #AFBCCD;
  --text-muted:       #97A5B8;
  --text-faint:       #8A97AA;

  --surface:          #18212B;
  --surface-sunken:   #111922;  /* inputs sit *below* the card, not above */
  --page:             #0D1219;
  --chip:             #1E2733;
  --chip-alt:         #242E3C;

  /* Dark UI separates planes with light edges rather than shadow, which is
     why these are lighter than the surfaces they sit on. */
  --border:           #2B3543;
  --border-strong:    #36424F;
  --border-soft:      #232C38;
  --border-softer:    #1D2630;
  --border-dashed:    #3D4859;

  /* ---- Semantic: success ----------------------------------------------- */
  --ok-bg:            #12241A;
  --ok-border:        #1F4230;
  --ok-text:          #6FCF97;
  --ok-mid:           #63C68C;
  --ok-soft:          #7FBF9C;
  --ok-bright:        #7BDCA4;
  --ok-dot:           #4FBF7D;
  /* The fill does NOT lighten with the theme: it carries white text, and a
     pale green behind white is the one combination that is unreadable in
     either theme. */
  --ok-fill:          #1F7340;

  /* ---- Semantic: warning ----------------------------------------------- */
  --warn-bg:          #241C0E;
  --warn-border:      #4A3A1B;
  --warn-text:        #E5B75A;
  --warn-dark:        #EFC46B;
  --warn-deep:        #D8AE55;
  --warn-fill:        #8C5A06;  /* stays deep: it carries white text */
  --warn-dot:         #E0B23C;
  --warn-dot-hot:     #E8954A;

  /* ---- Semantic: danger ------------------------------------------------- */
  --bad-bg:           #2A1615;
  --bad-border:       #5A2B28;
  --bad-text:         #F08A84;
  --bad-fill:         #C0453F;
  --bad-dot:          #E86A63;

  /* ---- Elevation --------------------------------------------------------
     A shadow tuned for white does nothing over a dark page. These go deeper
     and the scrims go heavier so a modal still lifts off its background.    */
  --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.40);
  --shadow-md:    0 12px 40px -20px rgba(0, 0, 0, 0.75);
  --shadow-lg:    0 20px 60px -20px rgba(0, 0, 0, 0.80);
  --shadow-modal: 0 24px 60px -18px rgba(0, 0, 0, 0.85);
  --shadow-brand: 0 8px 20px -6px rgba(62, 111, 217, 0.55);
  --shadow-toast: 0 12px 30px -10px rgba(0, 0, 0, 0.7);
  --scrim:        rgba(3, 6, 10, 0.66);
  --scrim-strong: rgba(3, 6, 10, 0.74);
}

/* Form controls the browser paints itself — date pickers, the sq ft slider,
   scrollbars — follow this rather than staying stubbornly light. */
:root[data-theme="dark"] input,
:root[data-theme="dark"] select,
:root[data-theme="dark"] textarea { color-scheme: dark; }

/* The one place dark must not follow the screen: paper. An invoice or quote
   printed from a dark theme would come out as a solid block of ink, so
   printing always falls back to the light palette. */
@media print {
  :root[data-theme="dark"] {
    color-scheme: light;
    --text: #1B2430; --text-2: #334155; --text-3: #475569;
    --text-muted: #556377; --text-faint: #5F6E85;
    --surface: #FFFFFF; --surface-sunken: #FAFBFD; --page: #FFFFFF;
    --chip: #F5F6F8; --chip-alt: #F1F2F4;
    --border: #E9EBEF; --border-strong: #E1E5EB;
    --border-soft: #F0F1F4; --border-softer: #F5F6F8; --border-dashed: #D8DEE7;
    --brand-text: #3A66C8;
    --ink: #FFFFFF; --ink-text: #1B2430; --ink-body: #334155;
    --ink-muted: #556377; --ink-muted-2: #556377; --ink-faint: #5F6E85;
    --ok-bg: #F0F9F1; --ok-text: #237A42; --ok-mid: #23703E; --ok-soft: #2C6B45;
    --warn-bg: #FFF8ED; --warn-text: #8C5A06; --warn-dark: #966008;
    --bad-bg: #FDF3F2; --bad-text: #B03A34;
  }
}

</style>

<!-- Theme, before the first paint.

     This runs inline and synchronously on purpose: choosing the theme from a
     script that loads with the rest of the app would show a white page for a
     moment first, which is exactly what someone turning dark mode on does not
     want to see. It reads the same preference the app stores, falls back to
     the device setting, and never throws if storage is blocked. -->
<script>
(function () {
  var root = document.documentElement;
  function systemDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function resolve(choice) {
    if (choice === 'dark' || choice === 'light') return choice;
    return systemDark() ? 'dark' : 'light';
  }
  var saved = null;
  try { saved = localStorage.getItem('cleanflow:theme'); } catch (e) {}
  var mode = resolve(saved);
  root.setAttribute('data-theme', mode);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', mode === 'dark' ? '#0D1219' : '#3E6FD9');
  // Follow the device while the preference is "system", including a change
  // made while the app is open.
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function () {
      var current = null;
      try { current = localStorage.getItem('cleanflow:theme'); } catch (e) {}
      if (current === 'dark' || current === 'light') return;
      if (window.CF && CF.theme) CF.theme.apply('system');
      else root.setAttribute('data-theme', systemDark() ? 'dark' : 'light');
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
})();
</script>

<script>/* assets/js/core/theme.js */
/* ==========================================================================
   CleanFlow — Theme

   Three choices: follow the device, always light, always dark. The chosen one
   lives in the database like every other setting, so it travels in a backup
   and restores with everything else.

   It is *also* mirrored into localStorage under its own key. The head script
   has to pick a theme before the first pixel is painted, and the database is
   opened asynchronously — by the time it answers, a white page has already
   been on screen. The mirror is the only thing fast enough to read there. The
   database stays the source of truth; the mirror is a cache of one string.
   ========================================================================== */
(function (CF) {
  'use strict';

  var KEY = 'cleanflow:theme';
  var CHOICES = ['system', 'light', 'dark'];

  function systemPrefersDark() {
    return !!(window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  /** The literal theme to paint, given a choice. */
  function resolve(choice) {
    if (choice === 'dark' || choice === 'light') return choice;
    return systemPrefersDark() ? 'dark' : 'light';
  }

  function current() {
    return document.documentElement.getAttribute('data-theme') === 'dark'
      ? 'dark' : 'light';
  }

  /** What the user picked, as opposed to what is on screen. */
  function choice() {
    var db = CF.store && CF.store.get && CF.store.get();
    var stored = db && db.settings && db.settings.theme;
    if (CHOICES.indexOf(stored) !== -1) return stored;
    var mirrored = read();
    return CHOICES.indexOf(mirrored) !== -1 ? mirrored : 'system';
  }

  function read() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function mirror(value) {
    // A blocked or full localStorage must not stop the theme changing — the
    // only cost is a flash of the other theme on the next cold start.
    try {
      if (value === 'system') localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, value);
    } catch (e) {}
  }

  /** Paint a choice. Does not persist it. */
  function apply(pick) {
    var mode = resolve(pick);
    document.documentElement.setAttribute('data-theme', mode);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', mode === 'dark' ? '#0D1219' : '#3E6FD9');
    listeners.forEach(function (fn) {
      try { fn(mode, pick); } catch (e) { console.error(e); }
    });
    return mode;
  }

  /** Paint it, remember it, and mirror it for the next cold start. */
  function set(pick) {
    var value = CHOICES.indexOf(pick) !== -1 ? pick : 'system';
    mirror(value);
    apply(value);
    if (CF.store && CF.store.get && CF.store.get()) {
      CF.store.commit('Theme', function (d) { d.settings.theme = value; });
    }
    return value;
  }

  /**
   * Called once the database is open. The stored setting wins over the mirror,
   * which may be stale after a restore from someone else's backup.
   */
  function sync() {
    var db = CF.store && CF.store.get && CF.store.get();
    var stored = db && db.settings && db.settings.theme;
    if (CHOICES.indexOf(stored) === -1) stored = 'system';
    if (stored !== read() && !(stored === 'system' && !read())) mirror(stored);
    apply(stored);
    return stored;
  }

  var listeners = [];
  function onChange(fn) {
    listeners.push(fn);
    return function () {
      listeners = listeners.filter(function (l) { return l !== fn; });
    };

  CF.theme = {
    CHOICES: CHOICES,
    resolve: resolve, current: current, choice: choice,
    apply: apply, set: set, sync: sync, onChange: onChange,

<script>/* assets/js/core/drafts.js */
/* ==========================================================================
   CleanFlow — Unsaved draft rescue

   The Smart Quote and the Commercial Proposal are the two screens where
   someone types for several minutes before anything is saved. Both kept that
   work in a plain variable, so a refresh, a back-swipe, an accidental reload
   after Print, or closing the tab threw all of it away with no warning and no
   way back.

   This keeps the in-progress draft in localStorage as you type and offers it
   back when you return. It is deliberately *not* part of the main database:
   a half-typed proposal is not a business record, it must never appear in a
   backup, and it must never collide with the real save. One key per screen,
   cleared the moment the draft is saved or cleared by hand.
   ========================================================================== */
(function (CF) {
  'use strict';

  var PREFIX = 'cleanflow:draft:';
  var MAX_AGE_DAYS = 14;      // older than this and it is not worth offering back

  // Said once per session, never on every keystroke.
  var warnedUnavailable = false;

  /** Storage can be unavailable (private mode, a locked-down browser). */
  function store() {
    try {
      if (!window.localStorage) return null;
      return window.localStorage;
    } catch (e) { return null; }
  }

  function save(name, data) {
    var ls = store();
    if (!ls) return announceFailure();
    try {
      ls.setItem(PREFIX + name, JSON.stringify({ at: Date.now(), data: data }));
      return true;
    } catch (e) {
      // A full quota or a locked-down browser must never break typing — but it
      // must not be silent either. Believing a draft is safe when it is not is
      // worse than knowing it isn't, so say so once and let them decide whether
      // to print or save now.
      return announceFailure();
    }
  }

  function announceFailure() {
    if (!warnedUnavailable) {
      warnedUnavailable = true;
      if (CF.ui && CF.ui.toast) {
        CF.ui.toast('This browser will not keep an unsaved draft — save or print ' +
                    'before you leave this screen', { tone: 'bad', duration: 7000 });
      }
    }
    return false;
  }

  function load(name) {
    var ls = store();
    if (!ls) return null;
    try {
      var raw = ls.getItem(PREFIX + name);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || !parsed.data) return null;
      var ageDays = (Date.now() - (Number(parsed.at) || 0)) / 86400000;
      if (!isFinite(ageDays) || ageDays > MAX_AGE_DAYS) { clear(name); return null; }
      return parsed.data;
    } catch (e) {
      clear(name);
      return null;
    }
  }

  function clear(name) {
    var ls = store();
    if (!ls) return;
    try { ls.removeItem(PREFIX + name); } catch (e) { /* nothing to do */ }
  }

  /**
   * Drop every draft.
   *
   * A restore replaces the whole business, and a draft is text typed against the
   * one being replaced. Left in place, a proposal written before the restore

          quarantinedAs: quarantined

      // mistaken for the store simply being empty.

      // is the case this whole file exists for: a read that FAILED must never
      // look like a store that is EMPTY, because the next keystroke would
      // write an empty database over the top of a real business.

        data: winner ? winner.data : null,

        // whether the IndexedDB side was stale or unreadable.

      // Do NOT fall back to "empty". If localStorage has something, use it.
      if (lsResult.ok && lsResult.payload) {
        mode = 'local';
        return { ok: true, data: lsResult.payload.data, recoveredFrom: 'localStorage' };
      }

   * mirror is kept alongside it whenever it fits: it is the only store that
   * can be written synchronously when the tab is closing.

        catch (err) { lastError = err; reject(describeWriteError(err)); }
      });
    }

    return idbWrite(payload)
      .then(function () {
        // Mirror for crash safety. Failing here is not fatal — IndexedDB holds
        // the authoritative copy — but it does mean the close-tab safety net
        // is gone, and the app must know so it can compensate and say so.
        try {
          localWrite(payload);

          // looks newer and this one no longer is.

      .catch(function (err) {

        // localStorage, which load() now knows to prefer when it is newer.

   * promise will not be given the chance to settle. Returns true if the data

/* ==========================================================================
   CleanFlow — Hash router
   Hash routing (not the History API) because this file is opened straight
   from disk, where pushState paths do not resolve.
   ========================================================================== */
(function (CF) {
  'use strict';

  var handler = null;
  var current = null;

  function parse(hash) {
    var raw = String(hash || '').replace(/^#\/?/, '');
    var queryAt = raw.indexOf('?');
    var query = {};

    if (queryAt !== -1) {
      raw.slice(queryAt + 1).split('&').forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split('=');
        query[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
      });
      raw = raw.slice(0, queryAt);
    }

    var parts = raw.split('/').filter(Boolean).map(decodeURIComponent);
    return {
      section: parts[0] || 'home',
      view: parts[1] || null,
      id: parts[2] || null,
      parts: parts,
      query: query,
      path: '#/' + parts.join('/')
    };
  }

  function go(path, options) {
    var target = String(path).indexOf('#') === 0 ? path : '#/' + String(path).replace(/^\/+/, '');
    if (options && options.replace) {
      location.replace(target);
      resolve();
    } else if (location.hash === target) {
      resolve();                       // same route — force a re-render
    } else {
      location.hash = target;
    }
  }

  function back(fallback) {
    if (history.length > 1) history.back();
    else go(fallback || '#/home');
  }

  function resolve() {
    current = parse(location.hash);
    if (handler) handler(current);
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', function () {
      resolve();
      // A new screen starts at the top, like a page navigation should.
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
    if (!location.hash) location.replace('#/home');
    resolve();
  }

  function get() { return current || parse(location.hash); }

  CF.router = { start: start, go: go, back: back, get: get, parse: parse, resolve: resolve };
})(window.CF = window.CF || {});

</script>
<script>/* assets/js/core/tabguard.js */
/* ==========================================================================
   CleanFlow — Single-writer guard

   Each tab holds the whole database in memory and writes it back whole. Two
   tabs open on the same machine therefore clobber each other: whichever
   saves last wins, and the other tab's work disappears with no warning.

   Opening the file twice is an easy thing for a buyer to do by accident, so
   this elects one writer. The first tab keeps working exactly as before; a
   second tab goes read-only and says why, with a one-tap way to take over.

   BroadcastChannel where available, a localStorage heartbeat everywhere else
   (including file:// in older browsers). No dependencies either way.
   ========================================================================== */
(function (CF) {
  'use strict';

  var CHANNEL = 'cleanflow-tabs';
  var LOCK_KEY = 'cleanflow:writer';
  var HEARTBEAT_MS = 2000;
  var STALE_MS = 6000;
  var PROBE_MS = 1200;    // how long to wait for the current writer to answer

  var tabId = 'tab-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  var isWriter = true;
  var myLockAt = 0;         // when this tab last wrote the lock
  var channel = null;
  var timer = null;
  var listeners = [];
  var sawWriter = false;

  function now() { return Date.now(); }

  function readLock() {
    try {
      var raw = localStorage.getItem(LOCK_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeLock() {
    try {
      var at = now();
      localStorage.setItem(LOCK_KEY, JSON.stringify({ id: tabId, at: at }));
      myLockAt = at;
      return true;
    } catch (e) { return false; }
  }

  function releaseLock() {
    var lock = readLock();
    if (lock && lock.id === tabId) {
      try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
    }
  }

  /** Another tab holds the lock right now. */
  function someoneElseHoldsIt() {
    var held = readLock();
    return !!(held && held.id !== tabId && (now() - (held.at || 0)) <= STALE_MS);
  }

  function setWriter(value) {
    if (isWriter === value) return;
    isWriter = value;
    listeners.forEach(function (fn) {
      try { fn(isWriter); } catch (e) { console.error(e); }
    });
  }

  function start() {
    // No localStorage means no way to coordinate — and also no persistence
    // worth protecting, so stay out of the way.
    var lock = readLock();
    var claimed = false;

    if (!lock || (now() - (lock.at || 0)) > STALE_MS || lock.id === tabId) {
      claimed = writeLock();
      setWriter(claimed !== false);
    } else {
      setWriter(false);
    }

    if (typeof BroadcastChannel !== 'undefined') {
      try {
        channel = new BroadcastChannel(CHANNEL);
        channel.onmessage = function (e) {
          var msg = e && e.data;
          if (!msg || msg.from === tabId) return;
          if (msg.type === 'claim') {
            // Another tab took over. Stand down rather than race it.
            if (isWriter) setWriter(false);
          } else if (msg.type === 'ping' && isWriter) {
            channel.postMessage({ type: 'here', from: tabId });
          } else if (msg.type === 'here') {
            sawWriter = true;
          }
        };
        channel.postMessage({ type: 'ping', from: tabId });

        // Waiting for the heartbeat to go stale takes ~6.5s when the writing
        // tab is frozen rather than closed. Asking it directly answers in a
        // fraction of that: silence means nobody is home.
        if (!isWriter) {
          sawWriter = false;
          setTimeout(function () {
            // Re-read the lock. Nobody answering the ping does not prove
            // nobody has claimed: two tabs whose probes time out together
            // would otherwise both take over, and both write.
            if (!isWriter && !sawWriter && !someoneElseHoldsIt()) takeOver(true);
          }, PROBE_MS);
        }
      } catch (e) { channel = null; }
    }

    timer = setInterval(function () {
      if (isWriter) {
        // Holding the lock is not the same as still owning it. Two tabs can
        // claim in the same instant — each sets itself writer before the
        // other's claim message lands, so neither stands down — and this tick
        // used to just rewrite the lock and carry on. Three tabs all believed
        // they were the writer, and all three wrote.
        //
        // The stored lock is the single source of truth, and it is checked
        // before it is renewed. A lock written at or after this tab's own last
        // write belongs to whoever claimed most recently, so this tab yields.
        // Every tab reaches the same verdict from the same value, which leaves
        // exactly one writer and cannot oscillate.
        var held = readLock();
        if (held && held.id !== tabId &&
            (now() - (held.at || 0)) <= STALE_MS &&
            (held.at || 0) >= myLockAt) {
          setWriter(false);
          return;
        }
        writeLock();
        return;
      }

      // The writing tab may have been closed; take over once its lock goes stale.
      var current = readLock();
      if (!current || (now() - (current.at || 0)) > STALE_MS) { takeOver(true); return; }

      // It may also still be open but wedged. Ask, and take over if it does
      // not answer before the next tick.
      if (channel) {
        sawWriter = false;
        try { channel.postMessage({ type: 'ping', from: tabId }); } catch (e) {}
        setTimeout(function () {
          if (!isWriter && !sawWriter && !someoneElseHoldsIt()) takeOver(true);
        }, PROBE_MS);
      }
    }, HEARTBEAT_MS);

    window.addEventListener('pagehide', releaseLock);
    window.addEventListener('beforeunload', releaseLock);
  }

  /**
   * Become the writing tab. `quiet` skips telling the other tab, for takeover
   * after it has already gone away.
   *
   * The database is re-read from disk first. This tab has been sitting on the
   * copy it loaded when it opened, and the tab that was writing has moved on
   * since: without the refresh, the first save after a takeover wrote this
   * stale snapshot over the other tab's newer work, and a payment recorded
   * there was simply gone. The lock is only granted once the refresh settles,
   * so nothing can be written from the old copy in between.
   */
  function takeOver(quiet) {
    var claim = function () {
      writeLock();
      if (!quiet && channel) {
        try { channel.postMessage({ type: 'claim', from: tabId }); } catch (e) {}
      }
      setWriter(true);
    };

    if (isWriter || !CF.store || !CF.store.refreshFromDisk) { claim(); return; }

    // A refresh that fails leaves this tab on the copy it already had, which is
    // the same position it was in a moment ago — so it still takes the lock
    // rather than being left unable to write at all.
    CF.store.refreshFromDisk().then(claim, claim);
  }

  function canWrite() { return isWriter; }
  function onChange(fn) {
    listeners.push(fn);
    return function () { listeners = listeners.filter(function (l) { return l !== fn; }); };
  }

  CF.tabguard = {
    start: start, canWrite: canWrite, takeOver: takeOver,
    onChange: onChange, id: function () { return tabId; }
  };
})(window.CF = window.CF || {});

</script>

      address: '', serviceArea: '',
      tagline: 'Reliable, thorough, on time.'
    };
  }

  function defaultSettings() {
    return {
      currency: 'USD',
      currencySymbol: '$',
      currencyAfter: false,
      locale: '',
      // 'system' follows the device; 'light' and 'dark' override it.
      theme: 'system',
      taxEnabled: false,
      taxRate: 0,
      taxLabel: 'Tax',
      hourlyCost: 28,          // what an hour of work costs you
      costRatio: 0.43,         // fallback cost estimate as a share of price
      rebookGraceDays: 7,      // how long past due before "ready to rebook"
      quoteFollowUpDays: 3,
      invoiceTermsDays: 14,
      referralOffer: '$20',
      roundTo: 5,              // round suggested prices to the nearest $5
      demoMode: false,
      onboarded: false,
      lastBackupAt: null,
      backupReminderDays: 7
    };
  }

  /** A brand-new, empty database. */
  /**
   * Key order matters here, because JSON.stringify follows it and a write
   * that gets cut off loses the tail. The owner's irreplaceable records are
   * written first; the defaults that CleanFlow can simply regenerate —
   * services, checklists, message templates — go last, where truncation
   * costs nothing.
   */
  function emptyDatabase() {
    return {
      schemaVersion: SCHEMA_VERSION,
      business: defaultBusiness(),
      settings: defaultSettings(),

      // Irreplaceable: written first so damage reaches it last.
      clients: [],
      jobs: [],
      invoices: [],
      quotes: [],
      expenses: [],
      payments: [],
      counters: { invoice: 100, quote: 100, proposal: 100 },
      outreach: {},
      activity: [],

      // Regenerable defaults; migrate() puts them back if they go missing.
      services: defaultServices(),
      addons: defaultAddons(),
      checklists: defaultChecklists(),
      templates: defaultTemplates()
    };
  }

  /**
   * Fill in anything a stored database is missing. Runs on every load, so
   * an older backup restored into a newer build still opens cleanly.
   */
  /**
   * Drop anything that is not a usable record: nulls, strings, arrays and
   * objects with no id all crash the views downstream. Duplicate ids are
   * collapsed to the first occurrence so lookups stay deterministic.
   */
  function sanitiseRecords(list) {
    if (!Array.isArray(list)) return null;
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (!r || typeof r !== 'object' || Array.isArray(r)) continue;
      if (!r.id || typeof r.id !== 'string') continue;
      if (seen[r.id]) continue;
      seen[r.id] = true;
      out.push(r);
    }
    return out;
  }

  function migrate(data) {
    var base = emptyDatabase();
    if (!data || typeof data !== 'object' || Array.isArray(data)) return base;

    var out = {};
    Object.keys(base).forEach(function (key) {
      var incoming = data[key];
      if (incoming === undefined || incoming === null) { out[key] = base[key]; return; }
      if (Array.isArray(base[key])) {
        var cleaned = sanitiseRecords(incoming);
        out[key] = cleaned === null ? base[key] : cleaned;
      } else if (typeof base[key] === 'object') {
        out[key] = (incoming && typeof incoming === 'object' && !Array.isArray(incoming))
          ? Object.assign({}, base[key], incoming)
          : base[key];
      } else {
        out[key] = incoming;
      }
    });

    // Counters must stay ahead of the documents already issued, or restoring
    // an older backup starts handing out invoice numbers that already exist.
    out.counters = Object.assign({}, base.counters, out.counters);
    out.counters.invoice = highestNumber(out.invoices, out.counters.invoice);
    out.counters.quote   = highestNumber(out.quotes,   out.counters.quote);

    // A restored file must never arrive with no way to quote work.
    // A truncated file loses its tail, which is now where the regenerable
    // defaults live — so put them back rather than opening with no services.
    if (!out.services.length)   out.services = defaultServices();
    if (!out.addons.length)     out.addons = defaultAddons();
    if (!out.checklists.length) out.checklists = defaultChecklists();
    if (!out.templates.length)  out.templates = defaultTemplates();

    repairFinancials(out);
    freezeAcceptedQuotes(out);
    recogniseExistingBusiness(out);

    out.schemaVersion = SCHEMA_VERSION;
    return out;
  }

  /**
   * A restored file holding a real business is not a first run.
   *
   * The welcome screen shows whenever `onboarded` is false. A file that never
   * carried the flag — a backup taken before setup finished, an older export, a
   * hand-edited or truncated file — therefore restored *successfully* and then
   * hid everything behind "Welcome to CleanFlow", which to the person who just
   * restored it is indistinguishable from having lost the lot.
   *
   * Evidence of a real business is a named business or any record of work. That
   * is inferred, not invented: nothing is added to the file, and a genuinely
   * empty first-run file still gets the welcome it should.
   */
  function recogniseExistingBusiness(out) {
    if (out.settings.onboarded) return;
    var hasWork = ['clients', 'jobs', 'invoices', 'quotes', 'expenses'].some(function (k) {
      return (out[k] || []).length > 0;
    });
    var named = !!(out.business && String(out.business.name || '').trim());
    if (hasWork || named) out.settings.onboarded = true;
  }

  /**
   * Make the money in a restored file safe to read.
   *
   * Everything downstream — totals, revenue, profit, the outstanding figure —
   * assumes these fields are numbers and that `payments` is a list. A file that
   * broke either assumption took the whole Money screen with it: `payments`
   * holding a string threw on the first `.forEach`, and one expense of
   * `Infinity` made the month's expenses *and* profit non-finite, so every
   * figure on screen read as nothing.
   *
   * This repairs shapes, not amounts. A value that is already a finite number
   * is the owner's record and is left exactly as it is, even where it looks
   * odd — only what cannot be read as money at all is replaced, and a negative
   * amount is floored at zero because no screen can render a negative bill
   * sensibly. Nothing here rewrites a figure that was readable.
   */
  function repairFinancials(out) {
    var CAP = 10000000;

    function amount(value, fallback) {
      var n = Number(value);
      if (!isFinite(n)) return fallback;
      if (n < 0) return 0;
      return Math.round(Math.min(n, CAP) * 100) / 100;
    }
    function text(value, max) {
      if (value === null || value === undefined) return '';
      if (typeof value === 'object') return '';
      return String(value).replace(/[\u0000-\u001F\u007F]/g, ' ')
        .replace(/\s+/g, ' ').trim().slice(0, max || 120);
    }
    // schema.js has no date helpers of its own; migrate always runs well after
    // every core script has loaded, so CF.fmt is available here.
    function dateOrNull(value) {
      return CF.fmt.isDateKey(value) ? String(value) : null;
    }
    function today() { return CF.fmt.today(); }

    (out.invoices || []).forEach(function (inv) {
      if (!inv || typeof inv !== 'object') return;

      // `payments` must be a list. A string here was a hard crash.
      if (!Array.isArray(inv.payments)) inv.payments = [];
      inv.payments = inv.payments.filter(function (pay) {
        return pay && typeof pay === 'object' && !Array.isArray(pay);
      }).map(function (pay) {
        return {
          id: text(pay.id, 60) || ('pay-' + Math.random().toString(36).slice(2, 9)),
          amount: amount(pay.amount, 0),
          method: text(pay.method, 40) || 'Cash',
          date: dateOrNull(pay.date) || dateOrNull(inv.issueDate) || today()
        };
      }).filter(function (pay) { return pay.amount > 0; });

      if (!Array.isArray(inv.lines)) inv.lines = [];
      inv.lines = inv.lines.filter(function (l) {
        return l && typeof l === 'object' && !Array.isArray(l);
      }).map(function (l) {
        return { label: text(l.label, 120) || 'Cleaning', amount: amount(l.amount, 0) };
      });

      var linesTotal = inv.lines.reduce(function (a, l) { return a + l.amount; }, 0);
      inv.subtotal = amount(inv.subtotal, Math.round(linesTotal * 100) / 100);
      inv.tax = amount(inv.tax, 0);
      inv.total = amount(inv.total, Math.round((inv.subtotal + inv.tax) * 100) / 100);
      inv.issueDate = dateOrNull(inv.issueDate) || today();
      inv.dueDate = dateOrNull(inv.dueDate) || inv.issueDate;
    });

    (out.expenses || []).forEach(function (e) {
      if (!e || typeof e !== 'object') return;
      e.amount = amount(e.amount, 0);
      e.category = text(e.category, 40) || 'Other';
      e.note = text(e.note, 2000);
      e.date = dateOrNull(e.date) || today();
    });

    (out.jobs || []).forEach(function (j) {
      if (!j || typeof j !== 'object') return;
      j.price = amount(j.price, 0);
      if (!Array.isArray(j.extras)) j.extras = [];
      j.extras = j.extras.filter(function (x) {
        return x && typeof x === 'object' && !Array.isArray(x);
      }).map(function (x) {
        return {
          id: text(x.id, 60) || ('ex-' + Math.random().toString(36).slice(2, 9)),
          label: text(x.label, 120) || 'Extra',
          amount: amount(x.amount, 0)
        };
      });
      if (!Array.isArray(j.checklist)) j.checklist = [];
    });

    (out.quotes || []).forEach(function (q) {
      if (!q || typeof q !== 'object') return;
      q.price = amount(q.price, 0);
      if (q.tax !== undefined) q.tax = amount(q.tax, 0);
      if (q.total !== undefined) q.total = amount(q.total, q.price + (Number(q.tax) || 0));
    });
  }

  /**
   * Record the tax rate an accepted quote was agreed at.
   *
   * Accepted quotes now freeze their price, tax and total, so a later rate
   * change in Settings cannot rewrite a figure a client already agreed to.
   * Files written before that carry no rate, and one shape of old record —
   * an accepted quote with no `tax` field at all — was still re-deriving its
   * total live, so a rate change moved it ($324.75 became $360).
   *
   * Nothing here invents or alters money. Where a tax figure was stored, the
   * rate is derived from the numbers already in the file. Where none was, the
   * old build was displaying the current rate, so that is what gets frozen —
   * the owner sees exactly the total they saw yesterday, and from now on it
   * holds still.
   */
  function freezeAcceptedQuotes(out) {
    var s = out.settings || {};
    var enabled = !!s.taxEnabled;
    var rate = Number(s.taxRate);
    if (!isFinite(rate) || rate <= 0) rate = 0;
    rate = Math.min(rate, 100);

    (out.quotes || []).forEach(function (q) {
      if (!q || q.status !== 'accepted') return;
      if (q.taxRateAtAccept !== undefined && q.taxRateAtAccept !== null) return;

      var price = Number(q.price);
      if (!isFinite(price) || price < 0) price = 0;
      var stored = Number(q.tax);

      if (isFinite(stored)) {
        // The agreed tax is already in the file — keep it exactly, and record
        // the rate it implies so the document can say what applied.
        q.taxRateAtAccept = price > 0
          ? Math.round((stored / price) * 10000) / 100
          : 0;
        q.taxEnabledAtAccept = stored > 0;
        if (!isFinite(Number(q.total))) {
          q.total = Math.round((price + stored) * 100) / 100;
        }
      } else {
        // No tax was ever recorded. Freeze what the old build was showing.
        var tax = enabled ? Math.round(price * rate) / 100 : 0;
        q.tax = tax;
        q.total = Math.round((price + tax) * 100) / 100;
        q.taxRateAtAccept = enabled ? rate : 0;
        q.taxEnabledAtAccept = enabled;
      }
    });
  }

  function highestNumber(rows, current) {
    var top = Number(current) || 100;
    (rows || []).forEach(function (r) {
      var n = parseInt(r && r.number, 10);
      if (isFinite(n) && n > top) top = n;
    });
    return top;
  }

  CF.schema = {
    VERSION: SCHEMA_VERSION,
    CURRENCIES: CURRENCIES,
    FREQUENCIES: FREQUENCIES,
    CLIENT_STATUS: CLIENT_STATUS,
    JOB_STATUS: JOB_STATUS,
    QUOTE_STATUS: QUOTE_STATUS,
    PROPERTY_TYPES: PROPERTY_TYPES,
    CONDITIONS: CONDITIONS,
    EXPENSE_CATEGORIES: EXPENSE_CATEGORIES,
    PAYMENT_METHODS: PAYMENT_METHODS,
    defaultServices: defaultServices,
    defaultAddons: defaultAddons,
    defaultChecklists: defaultChecklists,
    defaultTemplates: defaultTemplates,
    defaultSettings: defaultSettings,
    defaultBusiness: defaultBusiness,
    emptyDatabase: emptyDatabase,
    migrate: migrate,
    sanitiseRecords: sanitiseRecords
  };
})(window.CF = window.CF || {});

<script>/* assets/js/core/store.js */
/* ==========================================================================
   CleanFlow — Store

   Holds the whole database in memory, persists it after every change, and
   notifies subscribers so the shell can re-render. Writes are debounced
   and coalesced: typing in a notes field does not hammer the disk.

   Deletion is deliberately hard to do by accident. `remove()` soft-deletes
   by stamping `deletedAt`, and everything that reads records filters those
   out. A snapshot is taken before every mutation so Undo always has
   somewhere to go back to.
   ========================================================================== */
(function (CF) {
  'use strict';

  var db = null;
  var listeners = [];
  var undoStack = [];
  var saveTimer = null;
  var pendingSave = false;
  var saveInFlight = false;
  var saveError = null;
  var retryCount = 0;
  var locked = null;         // set when the stored data could not be read
  var loadNotice = null;
  var MAX_UNDO = 25;
  var MAX_RETRY_DELAY = 30000;
  var writeSeq = 0;   // bumped on every change, so a slow write knows it is stale
  var txDepth = 0;    // >0 while a multi-step action is grouped into one undo

  /* ---- Ids ------------------------------------------------------------- */

  function uid(prefix) {
    return (prefix || 'id') + '-' +
           Date.now().toString(36) + '-' +
           Math.random().toString(36).slice(2, 8);
  }

  /* ---- Lifecycle -------------------------------------------------------- */

  function init() {
    return CF.storage.init()
      .then(function () { return CF.storage.load(); })
      .then(function (result) {
        // A failed read is not an empty store. Boot into a locked, read-only
        // state instead of handing the user a blank database that the next
        // keystroke would write over the top of their real data.
        if (!result.ok) {
          locked = {
            reason: result.corrupt ? 'corrupt' : 'unreadable',
            error: result.error,
            quarantinedAs: result.quarantinedAs || null
          };
          db = CF.schema.migrate(null);
          invalidateDerived();
          return db;
        }
        locked = null;
        loadNotice = result.recoveredFrom
          ? 'Recovered your most recent changes from this device\'s backup copy.'
          : (result.corrupt ? 'Some stored data was unreadable and has been set aside.' : null);
        db = CF.schema.migrate(result.data);
        invalidateDerived();
        return db;
      });
  }

  /**
   * Re-read the database from disk, discarding this tab's in-memory copy.
   *
   * A read-only tab is holding a snapshot from whenever it opened. Handing it
   * the write lock without this let it save that stale snapshot straight over
   * the other tab's newer work — a payment recorded in the writing tab simply
   * vanished, because the tab that took over had never seen it.
   *
   * Nothing is written here, so a failed read costs nothing: the tab keeps the
   * copy it already had and the caller is told it could not refresh.
   */
  function refreshFromDisk() {
    return CF.storage.load().then(function (result) {
      if (!result || !result.ok) return false;
      db = CF.schema.migrate(result.data);
      // The undo history describes edits to a database this tab no longer
      // holds; keeping it would let one Undo reinstate the stale snapshot.
      undoStack.length = 0;
      invalidateDerived();
      notify();

      // An open modal describes that same replaced database, and this runs at
      // the moment a second tab takes over the writer role: a Record Payment
      // modal opened here before the other tab restored a backup could still
      // be saved afterwards, banking the money onto whatever invoice held that
      // id in the restored file. Only a takeover reaches this, never an
      // ordinary cross-tab save, so nothing half-typed is lost to routine sync.
      if (CF.ui && CF.ui.closeOverlays) CF.ui.closeOverlays();

      return true;
    }).catch(function () { return false; });
  }

  /* ---- Safety lock --------------------------------------------------------
     While locked, nothing is written to disk. The user is told what happened
     and offered the only two safe ways out: restore a backup, or start fresh
     (which they must confirm).                                              */

  function isLocked() { return !!locked; }
  function lockInfo() { return locked; }
  function takeLoadNotice() { var n = loadNotice; loadNotice = null; return n; }

  /** Deliberately clear the lock — the user has chosen to overwrite. */
  function unlock() { locked = null; schedule(); }

  function get() { return db; }

  function subscribe(fn) {
    listeners.push(fn);
    return function () {
      listeners = listeners.filter(function (l) { return l !== fn; });
    };
  }

  function notify() {
    listeners.forEach(function (fn) {
      try { fn(db); } catch (e) { console.error('[CleanFlow] listener failed', e); }
    });
  }

  /**
   * Drop anything derived from the database. Called on every mutation, not
   * from a change subscriber — a `silent` commit skips notify(), and a cached
   * index that outlives the data it summarises is a correctness bug.
   */
  function invalidateDerived() {
    if (CF.q && CF.q.invalidate) CF.q.invalidate();
  }

  /* ---- Persistence ------------------------------------------------------ */

  /**
   * Persist now. The pending flag is only cleared once the write has actually
   * landed — clearing it up front means a failed save is never retried and the
   * change is lost with nothing left to say so.
   */
  function flush() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (locked) return Promise.resolve();          // never write over data we could not read
    if (!pendingSave) return Promise.resolve();
    if (saveInFlight) return Promise.resolve();    // the in-flight write will pick up the latest db

    saveInFlight = true;
    var snapshotSeq = writeSeq;

    return CF.storage.save(db)
      .then(function () {
        saveInFlight = false;
        // Only settled if nothing changed while the write was in flight.
        if (writeSeq === snapshotSeq) pendingSave = false;
        else schedule();
        retryCount = 0;
        if (saveError) {
          saveError = null;
          if (CF.ui && CF.ui.toast) CF.ui.toast('Saved — your data is safe again', { tone: 'ok' });
        }
        notifySaveState();
      })
      .catch(function (err) {
        saveInFlight = false;
        saveError = err;                 // pendingSave stays true
        console.error('[CleanFlow] save failed', err);

        // Back off, but keep trying: a quota error often clears once the user
        // frees space, and a locked database usually frees up on its own.
        retryCount += 1;
        var delay = Math.min(500 * Math.pow(2, retryCount - 1), MAX_RETRY_DELAY);
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(flush, delay);

        if (retryCount === 1 && CF.ui && CF.ui.toast) {
          CF.ui.toast(err && err.quota
            ? 'This device is out of space — export a backup now'
            : 'Could not save to this device — export a backup now',
            { tone: 'bad', sticky: true });
        }
        notifySaveState();
      });
  }

  var DEBOUNCE_MIRRORED = 400;
  var DEBOUNCE_BARE = 60;

  /**
   * Batch writes so typing does not hammer the disk. When the synchronous
   * close-tab mirror is unavailable (a large database no longer fits in
   * localStorage) that debounce becomes the window in which work can be lost,
   * so it collapses to almost nothing.
   */
  function schedule() {
    pendingSave = true;
    writeSeq += 1;
    if (saveTimer) clearTimeout(saveTimer);
    var wait = (CF.storage.mirrorHealthy && !CF.storage.mirrorHealthy())
      ? DEBOUNCE_BARE : DEBOUNCE_MIRRORED;
    saveTimer = setTimeout(flush, wait);
  }

  /**
   * Synchronous last chance, for `pagehide`. Promises do not get to settle
   * while a tab is closing, so an async save can simply never run.
   */
  function flushSync() {
    if (locked || !pendingSave) return true;
    var ok = CF.storage.saveSync(db);
    if (ok) { pendingSave = false; retryCount = 0; }
    return ok;
  }

  function hasUnsavedChanges() { return pendingSave || saveInFlight; }
  function lastSaveError() { return saveError; }

  var saveStateListeners = [];
  function onSaveState(fn) {
    saveStateListeners.push(fn);
    return function () {
      saveStateListeners = saveStateListeners.filter(function (l) { return l !== fn; });
    };
  }
  function notifySaveState() {
    saveStateListeners.forEach(function (fn) {
      try { fn({ error: saveError, pending: pendingSave, retries: retryCount }); }
      catch (e) { console.error(e); }
    });
  }

  /* ---- Mutation --------------------------------------------------------- */

  /**
   * The only way the database changes.
   *   commit('Booked job', function (d) { d.jobs.push(job); })
   * Options:
   *   silent   — persist but do not re-render (rare; used for timers)
   *   noUndo   — do not push a snapshot (used for bulk/irreversible ops)
   */
  function commit(label, mutator, options) {
    var opts = options || {};

    // A second tab must not overwrite the tab that is actually being used.
    if (CF.tabguard && !CF.tabguard.canWrite()) {
      if (CF.ui && CF.ui.toast) {
        CF.ui.toast('CleanFlow is open in another tab — changes here are not saved', { tone: 'bad' });
      }
      return db;
    }

    if (locked) {
      if (CF.ui && CF.ui.toast) {
        CF.ui.toast('Your saved data could not be read — resolve that first', { tone: 'bad' });
      }
      return db;
    }

    // Inside a transaction the group's single snapshot is already banked, so
    // a step does not get an undo entry of its own.
    if (!opts.noUndo && txDepth === 0) pushUndo(label);

    mutator(db);
    invalidateDerived();

    if (!opts.skipActivity && opts.activity) logActivity(opts.activity);

    schedule();
    if (!opts.silent && txDepth === 0) notify();
    return db;
  }

  /**
   * Group several steps into one undoable action.
   *
   *   transaction('Complete job', function () { ...update, insert, insert... });
   *
   * Completing a clean stamps the job, raises an invoice and books the next
   * visit. Without this, each of those is its own undo entry, so one press of
   * Undo takes back the *next booking* and leaves the job completed and the
   * invoice raised — the opposite of what the button appears to offer.
   */
  function transaction(label, fn) {
    if (txDepth > 0) return fn();                 // already grouped

    // Bail before banking a snapshot if the write would be refused anyway.
    if (CF.tabguard && !CF.tabguard.canWrite()) {
      if (CF.ui && CF.ui.toast) {
        CF.ui.toast('CleanFlow is open in another tab — changes here are not saved', { tone: 'bad' });
      }
      return null;
    }
    if (locked) {
      if (CF.ui && CF.ui.toast) {
        CF.ui.toast('Your saved data could not be read — resolve that first', { tone: 'bad' });
      }
      return null;
    }

    pushUndo(label);
    txDepth += 1;
    try {
      return fn();
    } finally {
      txDepth -= 1;
      notify();
    }
  }

  function pushUndo(label) {
    undoStack.push({ id: uid('undo'), label: label, snapshot: JSON.stringify(db) });
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  function canUndo() { return undoStack.length > 0; }

  /**
   * An identifier for the change currently at the top of the undo stack.
   *
   * `undo()` pops whatever is newest, which is right for an Undo control that
   * means "the last thing I did" but wrong for the Undo offered inside a toast:
   * that one names a specific change and stays on screen for six seconds. Make
   * another change in those six seconds and the toast took back the wrong one —
   * tapping "Quote marked declined · Undo" after booking the job deleted the job
   * and the client it had just created, and said nothing. A toast records this
   * handle when it appears and compares it before acting.
   */
  function undoHandle() {
    var top = undoStack[undoStack.length - 1];
    return top ? top.id : null;
  }

  function undo() {
    var entry = undoStack.pop();
    if (!entry) return false;
    db = JSON.parse(entry.snapshot);
    invalidateDerived();
    schedule();
    notify();
    return entry.label || true;
  }

  /** Replace the whole database — restore from backup, reset, seed demo. */
  function replace(next, label) {
    // Restoring or resetting is the user's explicit decision to overwrite,
    // so it is also what releases a read-failure lock.
    locked = null;
    pushUndo(label || 'Replace data');
    db = CF.schema.migrate(next);
    invalidateDerived();
    schedule();
    notify();

    // Every screen is rebuilt by the notify above, but an open modal is not:
    // it sits outside the repainted region holding a reference to the business
    // that has just been replaced, and its Save button still works. Eight
    // places replace the database — restore, recover, reset, erase, demo — and
    // each was closing only the one drawer it happened to know about. The swap
    // is the single fact they share, so the stale overlays are dismissed here.
    // This is the one call that reaches from the store up to the UI; leaving it
    // to the callers is what let the modal through in the first place.
    if (CF.ui && CF.ui.closeOverlays) CF.ui.closeOverlays();

    return db;
  }

  /* ---- Activity log ------------------------------------------------------ */

  function logActivity(entry) {
    if (!entry) return;
    db.activity.unshift({
      id: uid('act'),
      at: new Date().toISOString(),
      date: CF.fmt.today(),
      icon: entry.icon || '•',
      text: entry.text,
      link: entry.link || null
    });
    if (db.activity.length > 200) db.activity.length = 200;
  }

  /* ---- Generic collection access ----------------------------------------
     Every read goes through `all()` so soft-deleted records stay invisible
     without each view having to remember to filter.                        */

  function all(collection) {
    return (db[collection] || []).filter(function (r) { return !r.deletedAt; });
  }

  function find(collection, id) {
    if (!id) return null;
    var list = db[collection] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function insert(collection, record, label, activity) {
    var row = Object.assign({ id: uid(collection.slice(0, 3)) }, record);
    row.createdAt = row.createdAt || new Date().toISOString();
    commit(label || ('Add ' + collection), function (d) {
      d[collection].unshift(row);
    }, { activity: activity });
    return row;
  }

  function update(collection, id, patch, label, activity) {
    var found = null;
    commit(label || ('Update ' + collection), function (d) {
      var list = d[collection] || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) {
          list[i] = Object.assign({}, list[i], patch, {
            updatedAt: new Date().toISOString()
          });
          found = list[i];
          break;
        }
      }
    }, { activity: activity });
    return found;
  }

  /** Soft delete. The record stays in the file so Undo and history work. */
  function remove(collection, id, label, activity) {
    return update(collection, id,
      { deletedAt: new Date().toISOString() },
      label || ('Delete ' + collection),
      activity);
  }

  function restore(collection, id, label) {
    return update(collection, id, { deletedAt: null }, label || 'Restore');
  }

  /** Sequential, human-friendly document numbers. */
  function nextNumber(kind) {
    var n = (db.counters[kind] || 100) + 1;
    db.counters[kind] = n;
    schedule();
    return String(n);
  }

  CF.store = {
    init: init, get: get, subscribe: subscribe, notify: notify,
    commit: commit, transaction: transaction, undo: undo, canUndo: canUndo,
    undoHandle: undoHandle, replace: replace,
    refreshFromDisk: refreshFromDisk,
    all: all, find: find, insert: insert, update: update,
    remove: remove, restore: restore,
    nextNumber: nextNumber, logActivity: logActivity,
    flush: flush, flushSync: flushSync, lastSaveError: lastSaveError,

})(window.CF = window.CF || {});

<script>/* assets/js/features/queries.js */
/* ==========================================================================
   CleanFlow — Derived data

   Everything the screens display but nothing stores: today's schedule, what
   needs attention, invoice status, growth opportunities. Keeping this in
   one place means Home, Money and Grow can never disagree about whether an
   invoice is overdue.
   ========================================================================== */
(function (CF) {
  'use strict';

  var S = function () { return CF.store; };
  var F = function () { return CF.fmt; };

  /* ---- Per-client index ---------------------------------------------------
     clientStats() used to scan every job and every invoice, and the Home and
     Grow screens call it once per client. That is fine for a working solo
     cleaner and quadratic for anyone with years of history. The index is
     built once per change and thrown away whenever the store moves.        */

  var index = null;

  function invalidate() { index = null; }

  function buildIndex() {
    var byClientJobs = Object.create(null);
    var byClientInvoices = Object.create(null);

    (S().get().jobs || []).forEach(function (j) {
      if (!j || j.deletedAt || !j.clientId) return;
      (byClientJobs[j.clientId] || (byClientJobs[j.clientId] = [])).push(j);
    });
    (S().get().invoices || []).forEach(function (i) {
      if (!i || i.deletedAt || !i.clientId) return;
      (byClientInvoices[i.clientId] || (byClientInvoices[i.clientId] = [])).push(i);
    });

    return { jobs: byClientJobs, invoices: byClientInvoices };
  }

  function idx() {
    if (!index) index = buildIndex();
    return index;
  }

  // store.js calls invalidate() directly on every mutation — including the
  // ones that skip notify() — so there is no subscriber to fall out of sync.

  /* ---- Lookups ---------------------------------------------------------- */

  function client(id)  { return S().find('clients', id); }
  function service(id) { return S().find('services', id); }

  function clientName(id, fallback) {
    var c = client(id);
    return c ? c.name : (fallback || 'Unknown client');
  }

  function serviceName(id, fallback) {
    var s = service(id);
    return s ? s.name : (fallback || 'Cleaning');
  }

  function activeClients() {
    return S().all('clients').filter(function (c) { return !c.archivedAt; });
  }

  function archivedClients() {
    return S().all('clients').filter(function (c) { return !!c.archivedAt; });
  }

  function activeServices() {
    return S().all('services').filter(function (s) { return s.active !== false; });
  }

  /* ---- Jobs -------------------------------------------------------------- */

  function jobs() { return S().all('jobs'); }

  function liveJobs() {
    return jobs().filter(function (j) { return j.status !== 'cancelled'; });
  }

  function sortByWhen(list, direction) {
